# Pass 08 -- Crypto Posture: operator-extensible algorithm catalogue
# Approved and deprecated cipher, hash, KDF, and padding scheme entries.
# Sources: BSI TR-02102-1 (Kryptographische Verfahren, v2024), NIST SP 800-131A Rev.2.
# Workspace overrides: wsp/inputs/pass-catalogs/pass-08-crypto-algorithms.yaml
#
# Entry ID collision: workspace entry wins over built-in on matching id.
# Contribute additions: https://github.com/Accenture/SWAO
#
# Matching (#3410, shared catalogue matcher, see README.md "Matching rules"):
#   detection.imports      literal tokens, matched in code files
#   detection.config_keys  literal tokens, matched in configuration files
#   detection.context      regexes (case-insensitive), matched in both; the
#                          only place a bare acronym (3DES, TDEA, RC4, SHA1,
#                          MD5, EC) may appear, inside a call or assignment
#   match / case_sensitive per token, per entry or under match_defaults
# Java (#3422): JCA engine calls (`Cipher`, `MessageDigest`, `Mac`,
# `KeyGenerator`, `SecretKeyFactory`, `Signature` `.getInstance("...")`),
# BouncyCastle lightweight classes and Spring Security password encoders are
# detected through the same imports / context fields; every JCA call with a
# literal algorithm string is also listed in the pass YAML (`jca_inventory`).
# Tokens default to `identifier` matching: `TDEA` never matches inside
# `istDeaktiviert`. Generated/minified files, files over 512 KB, lines over
# 1,000 characters, base64 runs and data: URIs are never matched.

pass_number: 8
pass_name: "Crypto Posture"

match_defaults:
  match: identifier
  case_sensitive: false

entries:

  # ---------- Approved symmetric encryption ----------

  - id: aes-256-gcm
    name: "AES-256-GCM"
    category: symmetric_encryption
    detection:
      imports:
        - "AES/GCM"
        - "AES_256_GCM"
        - "aes-256-gcm"
        - "GCMParameterSpec"
        - "GCMBlockCipher"
        - "GCMModeCipher"
      config_keys:
        - "aes-256-gcm"
        - "AES_256_GCM"
    posture:
      severity: approved_preferred
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: aes-128-gcm
    name: "AES-128-GCM"
    category: symmetric_encryption
    detection:
      imports:
        - "aes-128-gcm"
        - "AES_128_GCM"
      config_keys:
        - "aes-128-gcm"
        - "AES_128_GCM"
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: chacha20-poly1305
    name: "ChaCha20-Poly1305"
    category: symmetric_encryption
    detection:
      imports:
        - "chacha20-poly1305"
        - "CHACHA20_POLY1305"
        - "ChaCha20Poly1305"
        - "ChaCha20"
      config_keys:
        - "chacha20-poly1305"
        - "chacha20_poly1305"
    posture:
      severity: approved_preferred
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Approved asymmetric encryption ----------

  - id: rsa-oaep-sha256
    name: "RSA-OAEP with SHA-256"
    category: asymmetric_encryption
    detection:
      imports:
        - "RSA/ECB/OAEPWithSHA-256AndMGF1Padding"
        - "OAEPWithSHA-256AndMGF1Padding"
        - "RSA_OAEP_SHA256"
        - "RSA_PKCS1_OAEP_PADDING"
        - "RSA-OAEP-256"
      config_keys:
        - "rsa-oaep"
        - "oaep-sha256"
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Approved digital signatures ----------

  - id: ecdsa-p256
    name: "ECDSA with P-256 (secp256r1)"
    category: digital_signature
    detection:
      imports:
        - "secp256r1"
        - "prime256v1"
        - "SHA256withECDSA"
        - { token: "P-256", case_sensitive: true }
      config_keys:
        - "ec-p256"
        - "ecdsa-p256"
      # The bare "EC" token matched almost every file before #3410.
      context:
        - 'KeyPairGenerator\.getInstance\(\s*"EC"'
        - 'generateKeyPair(?:Sync)?\(\s*[''"]ec[''"]'
        - 'namedCurve\s*[:=]\s*[''"]P-256[''"]'
    posture:
      severity: approved_preferred
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: ecdsa-p384
    name: "ECDSA with P-384 (secp384r1)"
    category: digital_signature
    detection:
      imports:
        - "secp384r1"
        - "SHA384withECDSA"
        - { token: "P-384", case_sensitive: true }
      config_keys:
        - "ec-p384"
    posture:
      severity: approved_preferred
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Approved key derivation functions ----------

  - id: argon2id
    name: "Argon2id"
    category: kdf
    detection:
      imports:
        - "argon2"
        - "argon2id"
        - "Argon2BytesGenerator"
        - "Argon2PasswordEncoder"
        - "Argon2Parameters"
      config_keys:
        - "argon2id"
        - "argon2"
    posture:
      severity: approved_preferred
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: bcrypt
    name: "bcrypt"
    category: kdf
    detection:
      imports:
        - "bcrypt"
        - "bcryptjs"
        - "BCryptPasswordEncoder"
        - "org.springframework.security.crypto.bcrypt"
      config_keys:
        - "bcrypt"
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001]

  - id: hkdf-sha256
    name: "HKDF with SHA-256"
    category: kdf
    detection:
      imports:
        - "HKDF"
        - "HKDFBytesGenerator"
        - "hkdf-sha256"
        - "HKDFParameterSpec"
      config_keys:
        - "hkdf"
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # #3422: Java PBKDF2 (JCA algorithm names, Spring Security, BouncyCastle).
  - id: pbkdf2-sha2
    name: "PBKDF2 with HMAC-SHA-256 / SHA-512"
    category: kdf
    detection:
      imports:
        - "PBKDF2WithHmacSHA256"
        - "PBKDF2WithHmacSHA384"
        - "PBKDF2WithHmacSHA512"
        - "Pbkdf2PasswordEncoder"
        - "PKCS5S2ParametersGenerator"
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
      note: "NIST SP 800-132 key derivation; use a high iteration count (OWASP: 600,000 for PBKDF2-HMAC-SHA256)."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # #3422: Java scrypt (Spring Security, BouncyCastle).
  - id: scrypt
    name: "scrypt"
    category: kdf
    detection:
      imports:
        - "SCryptPasswordEncoder"
        - "org.bouncycastle.crypto.generators.SCrypt"
      context:
        - 'SCrypt\.generate\('
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001]

  # #3422: SHA-2 / SHA-3 digests through JCA, Commons Codec and BouncyCastle.
  - id: sha2-sha3
    name: "SHA-256 / SHA-384 / SHA-512 / SHA-3"
    category: hash_function
    detection:
      imports:
        - "SHA256Digest"
        - "SHA384Digest"
        - "SHA512Digest"
        - "SHA3Digest"
        - { token: "SHA256withRSA", case_sensitive: true }
        - { token: "SHA512withRSA", case_sensitive: true }
      context:
        - 'MessageDigest\.getInstance\(\s{0,10}"SHA(?:-256|-384|-512|-512/256|3-256|3-384|3-512)"'
        - 'DigestUtils\.sha(?:256|384|512|3_256|3_512)(?:Hex)?\('
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # #3422: HMAC with SHA-2 through JCA (`Mac.getInstance("HmacSHA256")`).
  - id: hmac-sha2
    name: "HMAC-SHA-256 / SHA-384 / SHA-512"
    category: mac
    detection:
      imports:
        - { token: "HmacSHA256", case_sensitive: true }
        - { token: "HmacSHA384", case_sensitive: true }
        - { token: "HmacSHA512", case_sensitive: true }
    posture:
      severity: approved
      bsi_tr02102_status: approved
      nist_status: approved
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Deprecated hash functions ----------

  - id: md5
    name: "MD5"
    category: hash_function
    detection:
      imports:
        - "System.Security.Cryptography.MD5"
        - "MD5CryptoServiceProvider"
        - "hashlib.md5"
        - "MD5Digest"
        - { token: "HmacMD5", case_sensitive: true }
        - { token: "MD5withRSA", case_sensitive: true }
      context:
        - 'MessageDigest\.getInstance\(\s*"MD5"'
        - 'createHash\(\s*[''"]md5[''"]'
        - 'MD5\.Create\('
        - 'DigestUtils\.md5'
        - '(?:algorithm|hash)\s*[:=]\s*[''"]?MD5[''"]?'
    posture:
      severity: weak
      bsi_tr02102_status: prohibited
      nist_status: withdrawn
      note: "MD5 is collision-broken; prohibited for all cryptographic uses. Non-cryptographic use (checksums) requires explicit justification."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: sha1
    name: "SHA-1"
    category: hash_function
    detection:
      imports:
        - "System.Security.Cryptography.SHA1"
        - "SHA1CryptoServiceProvider"
        - "SHA1Managed"
        - "hashlib.sha1"
        - "sha1WithRSAEncryption"
        - { token: "HmacSHA1", case_sensitive: true }
        - "SHA1Digest"
        - { token: "SHA1withRSA", case_sensitive: true }
        - { token: "SHA1withECDSA", case_sensitive: true }
        - { token: "SHA1withDSA", case_sensitive: true }
      context:
        - 'MessageDigest\.getInstance\(\s*"SHA-?1"'
        - 'createHash\(\s*[''"]sha-?1[''"]'
        - 'createHmac\(\s*[''"]sha-?1[''"]'
        - 'SHA1\.Create\('
        - 'DigestUtils\.sha1'
        - '(?:algorithm|hash|digest)\s*[:=]\s*[''"]?SHA-?1[''"]?'
        - 'otpauth://[^\s''"]{0,200}algorithm=SHA-?1'
    # #3412: context exceptions, evaluated per hit. `pattern` must match the
    # hit's own line, `near` a line within `window` lines (default 5) either
    # side; the first matching exception sets the hit's severity and is named
    # in the signal. Override by redefining this entry in the workspace
    # catalogue (ADR-0063).
    exceptions:
      - id: totp-rfc6238
        pattern: '(?:algorithm\s*[:=]\s*[''"]?SHA-?1|otpauth://)'
        near: 'totp|hotp|otplib|authenticator|otpauth|speakeasy'
        severity: informational
        rationale: "TOTP/HOTP (RFC 6238 / RFC 4226) defaults to HMAC-SHA1 and authenticator apps commonly require it; not CWE-327 misuse"
      - id: hmac-sha1
        pattern: 'HmacSHA1|createHmac\(\s*[''"]sha-?1[''"]|HMACSHA1|hmac\.new\([^)]{0,120}sha1'
        severity: low
        rationale: "HMAC-SHA1: BSI TR-02102 permits SHA-1 in HMAC with conditions; plan migration to HMAC-SHA256"
      # Anchored to a digest call and to narrow content-addressing markers so
      # that a password digest next to a `checksum` variable or a comment
      # about git history stays High.
      - id: checksum-content-addressing
        pattern: 'createHash\(\s*[''"]sha-?1|MessageDigest\.getInstance\(\s*"SHA-?1|DigestUtils\.sha1|hashlib\.sha1|SHA1\.Create\('
        near: 'sha1sum|\bgit\s+(?:object|blob|tree|commit)\b|[`''"]blob \$?\{?|\betag\b'
        window: 3
        severity: informational
        rationale: "Non-cryptographic use (git object hash, sha1sum checksum, ETag); no security property relies on collision resistance"
    posture:
      severity: deprecated
      bsi_tr02102_status: deprecated
      nist_status: deprecated
      note: "SHA-1 deprecated for all new use. BSI TR-02102 permits SHA-1 only for HMAC through 2025 with conditions; new designs must use SHA-256 or better."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Deprecated symmetric ciphers ----------

  - id: des
    name: "DES (Data Encryption Standard)"
    category: symmetric_encryption
    detection:
      imports:
        - "DESKeySpec"
        - "DESCryptoServiceProvider"
        - "DESEngine"
      context:
        - 'Cipher\.getInstance\(\s*"DES[/"]'
        - '(?:KeyGenerator|SecretKeyFactory)\.getInstance\(\s{0,10}"DES"'
        - 'createCipheriv\(\s*[''"]des(?:-ecb|-cbc)?[''"]'
        - 'DES\.Create\('
        - '(?:algorithm|cipher)\s*[:=]\s*[''"]?DES[''"]?'
    posture:
      severity: weak
      bsi_tr02102_status: prohibited
      nist_status: withdrawn
      note: "DES has 56-bit key; brute-forceable. Prohibited since NIST 2005 withdrawal. No compliant use case remains."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: 3des
    name: "Triple DES (3DES / TDEA)"
    category: symmetric_encryption
    detection:
      imports:
        - { token: "DESede", case_sensitive: true }
        - { token: "TripleDES", case_sensitive: true }
        - "DESedeKeySpec"
        - "DESedeEngine"
        - "TripleDESCryptoServiceProvider"
        - "System.Security.Cryptography.TripleDES"
      config_keys:
        - { token: "DESede", case_sensitive: true }
      # "3DES" and "TDEA" are bare acronyms: they count only in a cipher call
      # or an algorithm assignment, never in prose or identifiers (#3410).
      context:
        - 'createCipheriv\(\s*[''"]des-ede3?(?:-cbc)?[''"]'
        - '(?:algorithm|cipher)\s*[:=]\s*[''"]?(?:3DES|TDEA|TripleDES|DESede)[''"]?'
    posture:
      severity: deprecated
      bsi_tr02102_status: deprecated
      nist_status: deprecated
      note: "3DES deprecated by NIST 2023 (SP 800-131A Rev.2); BSI TR-02102 permits only for legacy interoperability through 2024. No new use."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: rc4
    name: "RC4 (Rivest Cipher 4)"
    category: symmetric_encryption
    detection:
      imports:
        - "RC4Engine"
      context:
        - 'createCipheriv\(\s*[''"]rc4'
        - '(?:Cipher|KeyGenerator)\.getInstance\(\s*"(?:RC4|ARCFOUR)'
        - '(?:algorithm|cipher)\s*[:=]\s*[''"]?(?:RC4|ARCFOUR)[''"]?'
        - 'ssl\.cipher\.suites.{0,200}RC4'
        - 'TLS_[A-Z0-9_]{0,40}_RC4_'
    posture:
      severity: weak
      bsi_tr02102_status: prohibited
      nist_status: withdrawn
      note: "RC4 is prohibited; statistical biases allow plaintext recovery. TLS 1.3 formally removed it."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Deprecated padding schemes ----------

  - id: rsa-pkcs1v1-5
    name: "RSA PKCS#1 v1.5 padding (for encryption)"
    category: asymmetric_encryption
    detection:
      imports:
        - "RSA/ECB/PKCS1Padding"
        - "RSA_PKCS1_PADDING"
        - "PKCS1v15"
      config_keys:
        - "rsa-pkcs1"
      context:
        - 'Cipher\.getInstance\(\s*"RSA"\s*\)'
    posture:
      severity: deprecated
      bsi_tr02102_status: deprecated
      nist_status: deprecated
      note: "BSI TR-02102 deprecated RSA-PKCS1v1.5 for encryption earlier than NIST (Bleichenbacher padding oracle). Use RSA-OAEP instead. PKCS1v1.5 for SIGNATURES only is conditionally permitted through 2025."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  - id: ecb-mode
    name: "ECB block cipher mode (Electronic Codebook)"
    category: block_cipher_mode
    detection:
      imports:
        - "AES/ECB"
        - "DES/ECB"
        - "CipherMode.ECB"
      context:
        - 'createCipheriv\(\s*[''"]aes-\d{3}-ecb[''"]'
        - '(?:mode|cipher-mode)\s*[:=]\s*[''"]?ECB[''"]?'
    posture:
      severity: weak
      bsi_tr02102_status: prohibited
      nist_status: deprecated
      note: "ECB mode provides no semantic security; identical plaintext blocks produce identical ciphertext. Prohibited for all new use."
    cross_reference_frameworks: [BSI_C5, ISO_27001, BSI_TR_02102]

  # ---------- Deprecated password storage (#3422) ----------

  - id: spring-legacy-password-encoder
    name: "Spring Security legacy password encoder (plain text or unsalted digest)"
    category: password_storage
    detection:
      imports:
        - "NoOpPasswordEncoder"
        - "StandardPasswordEncoder"
        - "MessageDigestPasswordEncoder"
        - "LdapShaPasswordEncoder"
        - "Md4PasswordEncoder"
        - "ShaPasswordEncoder"
        - "Md5PasswordEncoder"
    posture:
      severity: weak
      bsi_tr02102_status: prohibited
      nist_status: withdrawn
      note: "Deprecated Spring Security encoders store passwords in plain text or as fast digests (CWE-916). Migrate to DelegatingPasswordEncoder with bcrypt, scrypt, Argon2 or PBKDF2."
    cross_reference_frameworks: [BSI_C5, ISO_27001]
