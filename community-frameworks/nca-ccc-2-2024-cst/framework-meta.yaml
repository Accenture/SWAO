# SWAO community framework metadata (design 029 §2.3 + §11)
# NCA CCC-2:2024 -- Cloud Cybersecurity Controls, Version 2 (2024)
# Cloud Service Tenant (CST) control catalogue.
# Source: National Cybersecurity Authority, Kingdom of Saudi Arabia.
# Sprint-100 #1133 -- authored 2026-07-18.

framework:
  id: NCA_CCC_CST
  name: "National Cybersecurity Authority -- Cloud Cybersecurity Controls (CCC-2:2024) -- Cloud Service Tenant (CST)"
  version: "CCC-2:2024 -- issued by NCA Saudi Arabia, effective 2024"
  authority: "National Cybersecurity Authority (NCA), Kingdom of Saudi Arabia"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
  applicability_hints:
    - ksa_regulated_entity
    - cloud_workload
    - cloud_tenant
    - saas_workload
  assessment_type_scope: [app, aud]
  signal_prefix: NCA_CCC_CST
  description: >-
    NCA Cloud Cybersecurity Controls (CCC-2:2024) -- Cloud Service Tenant (CST)
    obligations. This catalogue covers the 18 main CST controls (T-notation)
    across 4 domains: Cloud Cybersecurity Governance (Domain 1), Cloud
    Cybersecurity Defense (Domain 2), Cloud Cybersecurity Resilience (Domain 3),
    and Third-Party Cloud Cybersecurity (Domain 4). CCC-2:2024 is a mandatory
    extension to the Essential Cybersecurity Controls (ECC-2:2024); CSTs must
    comply with both ECC and CCC. Applicable to all Saudi government agencies,
    entities owning or operating Critical National Infrastructure (CNI), and
    private-sector entities currently using or planning to use cloud services.
    CST controls govern the tenant side of the shared-responsibility model:
    credential lifecycle, community cloud isolation verification, exit strategy,
    data encryption, key management, vulnerability cycles, and BCM for cloud.
  references:
    - "https://nca.gov.sa/en-US/Regulations/Pages/Cloud-Cybersecurity-Controls.aspx"
    - "CCC-2:2024 English PDF: https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
  catalogue_version: "1.0.0"
  last_reviewed: "2026-07-18"

  replaces: []

  cross_mapping_hints:
    target_frameworks:
      - NCA_ECC          # parent standard; each CCC control cites its ECC parent
      - NCA_CCC_CSP      # the complementary CSP catalogue for shared-responsibility heatmap
      - ISO_27001        # ISO 27001:2022 Annex A security controls
      - SAMA_CSF         # Saudi Central Bank Cybersecurity Framework (financial-sector overlap)

  redistribution_note: >-
    NCA CCC-2:2024 is published by the National Cybersecurity Authority of
    the Kingdom of Saudi Arabia and is classified as publicly available. Control
    descriptions in this catalogue paraphrase the English text of the official
    NCA publication for SWAO machine ingestion. The authoritative source is the
    official NCA website listed under references. Reviewers verify control
    accuracy by locating the cited domain and control reference in the source
    publication. No legal advice is provided; consult qualified legal and
    information security professionals for interpretation of how a requirement
    applies to a specific workload in the Kingdom of Saudi Arabia.
