# SWAO Community Frameworks registry.
#
# Index of every framework bundled with the SWAO binary at build time.
# `swao framework list` reads this file to enumerate the available set;
# `swao framework install <id>` copies the matching subfolder into
# `<workspace>/catalogs/community/<id>/`.
#
# Sprint-037 #0340 lands GDPR as the first regulatory regime packaged as
# a community framework (operator-authored 53-control catalogue, design
# 029 §11 shape). The remaining flagship regimes (HIPAA, PCI_DSS,
# ISO_27001, SOC_2, BSI_C5, DORA) follow in sprint-038+.

version: 1

frameworks:
  - id: AI_10_PILLARS
    folder: ai-10-pillars
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "2026-Q2"
    applicability_hints:
      - ai_workload
      - llm_app
      - rag_pipeline
      - genai_application
    description: "Ten-pillar architecture rulebook for securing AI systems."

  - id: GDPR
    folder: gdpr
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "Regulation (EU) 2016/679"
    applicability_hints:
      - eu_data
      - personal_data
      - consumer_app
      - health_data
      - employee_data
      - cross_border_transfer
      - automated_decisioning
      - profiling
    description: >
      EU General Data Protection Regulation packaged as the first regulatory
      community framework. 53 controls across Chapters II-V (Principles,
      Data subject rights, Controller/processor, Third-country transfers).
      Supersedes the bundled stub at controls/standard/gdpr-controls.yaml
      via regime_meta.replaces: [GDPR] at install time.

  - id: NIST_SP_800_66R2
    folder: nist-sp-800-66r2-hipaa
    contributor: "Accenture SWAO team (community packaging)"
    version: "NIST SP 800-66r2 / 2024-02"
    applicability_hints:
      - us_health
      - phi
      - electronic_phi
      - healthcare
      - covered_entity
      - business_associate
      - hipaa_security_rule
    description: >
      HIPAA Security Rule (45 CFR Part 164 Subpart C) with NIST SP 800-66
      Revision 2 implementation guidance. 49 controls expanding the 3-control
      bundled HIPAA stub at standard scope. Declares replaces: [HIPAA] at the
      regime_meta level (cross-id supersession; loader respects same-id only
      today, cross-id is a sprint-038 candidate).

  - id: PCI_DSS
    folder: pci-dss
    contributor: "Accenture SWAO team (community packaging)"
    version: "4.0"
    applicability_hints:
      - payments
      - cardholder_data
      - ecommerce
    description: >
      PCI DSS v4.0 thin community packaging (sprint-039 #0358 Phase 1
      migration from the standard-scope stub). 5-control PoC depth at
      Requirements 3.4 / 4.1 / 6.2 / 8.3 / 10; catalogue can deepen
      independently via a future authoring sprint.

  - id: ISO_27001
    folder: iso-27001
    contributor: "Accenture SWAO team (community packaging)"
    version: "2022"
    applicability_hints:
      - enterprise
      - ism
      - broad_coverage
    description: >
      ISO/IEC 27001:2022 thin community packaging (sprint-039 #0358
      Phase 1 migration from the standard-scope stub). 5-control PoC
      depth; the 2022 revision's full 93-control Annex A is a future
      authoring deepening.

  - id: SOC_2
    folder: soc-2
    contributor: "Accenture SWAO team (community packaging)"
    version: "2017-revised"
    applicability_hints:
      - saas
      - b2b
      - us_market
    description: >
      SOC 2 Trust Services Criteria thin community packaging (sprint-039
      #0358 Phase 1 migration from the standard-scope stub). 5-control
      PoC depth covering the CC security baseline.

  - id: BSI_C5
    folder: bsi-c5
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "2020"
    signal_prefix: C5
    applicability_hints:
      - de_sovereign
      - public_sector
      - cloud
      - kritis
      - german_regulated
      - bsi_c5_attested
    description: >
      BSI C5:2020 (Cloud Computing Compliance Criteria Catalogue) -- full
      Basic Criteria coverage. 62 controls across all 17 C5:2020 domains:
      OIS, PRY, HRS, IDM, CRY, COS, OPS, AVL, DEV, INM, SIM, COM, PSS,
      BCP, DAT, and PI. Mandatory baseline for German public-sector cloud
      usage; strongly recommended for KRITIS-regulated sectors. Cross-mapped
      to BSI_GRUNDSCHUTZ_2023, ISO_27001, GDPR, SOC_2, EUCS, and DORA.

  - id: DORA
    folder: dora
    contributor: "Accenture SWAO team (community packaging)"
    version: "2024-01"
    applicability_hints:
      - financial_services
      - eu_critical_infrastructure
    description: >
      DORA (EU Regulation 2022/2554) thin community packaging
      (sprint-039 #0358 Phase 1 migration from the standard-scope stub).
      5-control PoC depth covering ICT risk + incident reporting +
      operational resilience testing + third-party ICT risk + info
      sharing.

  - id: LLM_SELECTION
    folder: llm-selection
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "1.0"
    applicability_hints:
      - llm_app
      - genai_application
      - foundation_model
      - ai_workload
    description: >
      LLM Selection Framework for Sovereign Deployment (Design 063 Phase 5).
      34 controls across 7 domains: DSR (data sovereignty), MT (model
      transparency), PR (performance), CLF (cultural fit), SB (safety and
      bias), PEO (people readiness), AC (agentic capabilities). Scores into
      a Sovereignty Readiness Score (SRS). Mode B component of the LLM
      benchmark; DSR-01/DSR-02 are hard eligibility gates. Requires LLM
      provider context files in apps/{app}/context/ or Hybrid Assessment
      audit evidence for controls to yield signals.

  - id: BSI_GRUNDSCHUTZ_2023
    folder: bsi-grundschutz-2023
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "Edition 2023 (published January 2023) -- v0.2.0"
    applicability_hints:
      - german_public_sector
      - regulated_industry
      - cloud_workload
      - on_premise
      - critical_infrastructure
      - sovereign_cloud
      - iso_27001_aligned
      - bsi_certified
    description: >
      BSI IT-Grundschutz Kompendium Edition 2023 -- full ISMS methodology
      from the German Federal Office for Information Security (BSI). 105 controls
      across 27 Bausteine drawn from ISMS, ORP, CON, OPS, DER, APP, SYS, and
      NET layers. v0.2.0 ships 72 Basis (B) and 33 Standard (S) requirements.
      Distinct from BSI_C5: Grundschutz covers the full ISMS lifecycle for
      on-premise, hybrid, and cloud workloads; C5 is cloud-specific.
      Cross-mapped to GDPR, ISO 27001, BSI C5, DORA, and SOC 2.

  - id: GDPR_DEMO
    folder: gdpr-demo
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "Regulation (EU) 2016/679 -- demo subset 2026-07-02"
    applicability_hints:
      - eu_data
      - personal_data
      - health_data
      - automated_decisioning
      - demo
    description: >
      Demo-sized subset of the GDPR community framework. 12 controls selected
      for maximum cross-regime coverage with AI_10_PILLARS_DEMO, NIST_SP_800_66R2_DEMO,
      and BSI_GRUNDSCHUTZ_2023_DEMO. Scaffolded by default on swao init for all
      tiers. Use for live presentations and first-run exploration.

  - id: AI_10_PILLARS_DEMO
    folder: ai-10-pillars-demo
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "2026-Q2 -- demo subset 2026-07-02"
    applicability_hints:
      - ai_workload
      - llm_app
      - rag_pipeline
      - genai_application
      - demo
    description: >
      All 11 controls from the AI 10 Pillars framework, packaged as a demo-ready
      set. Equivalent to AI_10_PILLARS (same control count). Cross-mapped to
      GDPR_DEMO, NIST_SP_800_66R2_DEMO, and BSI_GRUNDSCHUTZ_2023_DEMO. Scaffolded by
      default on swao init for all tiers.

  - id: NIST_SP_800_66R2_DEMO
    folder: nist-sp-800-66r2-demo
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "NIST SP 800-66r2 / 2024-02 -- demo subset 2026-07-02"
    applicability_hints:
      - us_health
      - phi
      - electronic_phi
      - healthcare
      - hipaa_security_rule
      - demo
    description: >
      Demo-sized subset of NIST SP 800-66r2 HIPAA Security Rule. 12 controls
      from Administrative Safeguards (6), Technical Safeguards (5), and
      Organisational Requirements (1). Cross-mapped to GDPR_DEMO,
      AI_10_PILLARS_DEMO, and BSI_GRUNDSCHUTZ_2023_DEMO. Scaffolded by default
      on swao init for all tiers.

  - id: BSI_GRUNDSCHUTZ_2023_DEMO
    folder: bsi-grundschutz-2023-demo
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "Edition 2023 (published January 2023) -- demo subset 2026-07-07"
    applicability_hints:
      - german_public_sector
      - regulated_industry
      - cloud_workload
      - on_premise
      - sovereign_cloud
      - demo
    description: >
      Demo-sized subset of BSI IT-Grundschutz Kompendium Edition 2023. 12
      controls across all 8 Schichten (ISMS, ORP, CON, OPS, DER, APP, SYS,
      NET) selected for maximum cross-regime coverage with GDPR_DEMO,
      AI_10_PILLARS_DEMO, and NIST_SP_800_66R2_DEMO. Scaffolded by default on
      swao init for all tiers.

  # ---- Sprint-100 #1133-#1140: Saudi Arabia NCA regulatory frameworks ----

  - id: NCA_ECC
    folder: nca-ecc-2-2024
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "ECC-2:2024 -- issued by NCA Saudi Arabia, effective 2024"
    applicability_hints:
      - ksa_regulated_entity
      - cloud_workload
      - government_systems
      - critical_infrastructure
      - financial_services
    description: >
      NCA Essential Cybersecurity Controls version 2 (ECC-2:2024), the mandatory
      cybersecurity baseline for all entities subject to NCA oversight in the
      Kingdom of Saudi Arabia. 28 controls covering 4 domains: Governance (10
      subdomains), Defense (15 subdomains), Resilience (1), Third-Party and Cloud
      (2). Cross-mapped to ISO_27001, NIST_CSF, SAMA_CSF, NCA_CCC_CSP, NCA_CCC_CST.

  - id: NCA_ECC_DEMO
    folder: nca-ecc-demo
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "ECC-2:2024 -- demo subset 2026-07-18"
    applicability_hints:
      - ksa_regulated_entity
      - cloud_workload
      - demo
    description: >
      Demo-sized subset of NCA ECC-2:2024 for live-presentation use. 20 controls
      selected to cover all 4 domains with maximum automated signal coverage.

  - id: NCA_CCC_CST
    folder: nca-ccc-2-2024-cst
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "CCC-2:2024 -- issued by NCA Saudi Arabia, effective 2024"
    applicability_hints:
      - ksa_regulated_entity
      - cloud_workload
      - cloud_tenant
      - saas_workload
    description: >
      NCA Cloud Cybersecurity Controls version 2 (CCC-2:2024) -- Cloud Service
      Tenant (CST) perspective. Governs the cybersecurity obligations of entities
      that consume cloud services in the Kingdom of Saudi Arabia. Covers 18 main
      tenant controls across 4 domains. Use alongside NCA_CCC_CSP for provider
      assessments. Emits cst_class_required in the WSP plan when active.

  - id: NCA_CCC_CSP
    folder: nca-ccc-2-2024-csp
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "CCC-2:2024 -- issued by NCA Saudi Arabia, effective 2024"
    applicability_hints:
      - ksa_regulated_entity
      - cloud_provider
      - iaas_provider
      - paas_provider
      - saas_provider
    description: >
      NCA Cloud Cybersecurity Controls version 2 (CCC-2:2024) -- Cloud Service
      Provider (CSP) perspective. Governs the cybersecurity obligations of cloud
      service providers operating in the Kingdom of Saudi Arabia. 37 main provider
      controls across 4 domains. Includes additional defense controls for key
      management, system development security, and storage media security.

  # ---- Sprint-100 #1141-#1143: Saudi Arabia SAMA CSF ----

  - id: SAMA_CSF
    folder: sama-csf-v1
    contributor: "Helmut Schindlwick (Accenture SWAO team)"
    version: "CSF v1.0 -- issued by SAMA, first published 2017; current as of 2026"
    applicability_hints:
      - ksa_financial_sector
      - ksa_regulated_entity
      - banking
      - insurance
      - finance_company
    description: >
      Saudi Arabian Monetary Authority Cyber Security Framework v1.0 (SAMA CSF),
      the mandatory cybersecurity framework for SAMA-regulated financial entities
      (banks, insurance companies, finance companies, payment providers). Uses a
      6-level maturity model (Level 0 Incomplete to Level 5 Optimising); regulatory
      minimum is Level 3 (Defined). 30 controls across 5 domains: Leadership and
      Governance, Risk Management and Compliance, Cybersecurity Operations,
      Third-Party Cybersecurity, and Cyber Resilience.

