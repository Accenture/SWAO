# SWAO community framework controls (design 029 §2.4 + §11)
# NCA CCC-2:2024 Cloud Service Provider (CSP) -- 37 controls.
# Source: NCA CCC-2:2024 English PDF (P-notation controls).
# Sprint-100 #1133 -- authored 2026-07-18.

regime_meta:
  id: NCA_CCC_CSP
  name: "NCA Cloud Cybersecurity Controls (CCC-2:2024) -- Cloud Service Provider"
  version: "CCC-2:2024"
  authority: "National Cybersecurity Authority (NCA), Kingdom of Saudi Arabia"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
