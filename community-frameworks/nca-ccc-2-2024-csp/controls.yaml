    - saas_provider
  source_sha256: ""

controls:

  - id: NCA_CCC_CSP_01
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-1 Cybersecurity Roles and Responsibilities"
    title: "Cybersecurity Roles and RACI for Cloud Services"
    description: >-
      In addition to ECC control 1-4-1, the Authorizing Official of the CSP
      shall identify, document, and approve cybersecurity roles and RACI
      assignments for all stakeholders of cloud services, including the
      Authorizing Official's own roles and responsibilities.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-01-roles-raci.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-1-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_1-4-1
      - ISO_27001_A.6.1.1
    remediation: >-
      Document a RACI matrix covering all cloud service roles, including CSP
      operations, security, and the Authorizing Official. Review and update
      whenever organisational structure or cloud service scope changes.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_02
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-2 Cybersecurity Risk Management"
    title: "Cybersecurity Risk Management for Cloud Services"
    description: >-
      In addition to ECC Subdomain 1-5, the CSP cybersecurity risk management
      methodology shall: define acceptable risk levels for cloud services and
      disclose them to CSTs where relevant; incorporate data and information
      classification levels in the methodology; and develop and periodically
      monitor a cybersecurity risk register for cloud services.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-02-risk-management.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-2-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_1-5
      - ISO_27001_Clause_6.1
    remediation: >-
      Maintain a cloud-specific risk register reviewed at least quarterly.
      Define explicit risk acceptance thresholds for each data classification
      level and disclose risk posture summaries to CSTs under contract.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_03
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-3 Compliance with Cybersecurity Standards, Laws, and Regulations"
    title: "Continuous Compliance with Saudi Cybersecurity Legislation"
    description: >-
      In addition to ECC control 1-7-1, the CSP shall ensure continuous
      compliance with all laws, regulations, instructions, decisions, regulatory
      frameworks, controls, and mandates regarding cybersecurity in the Kingdom
      of Saudi Arabia.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-03-legal-compliance.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-3-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_1-7-1
      - ISO_27001_A.5.31
    remediation: >-
      Establish a regulatory horizon-scanning process for Saudi cybersecurity
      legislation. Maintain a compliance register mapping NCA requirements to
      CSP controls. Conduct at least annual gap analyses against updated NCA
      frameworks.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_04
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-4 Cybersecurity in Human Resources"
    title: "HR Security -- Saudisation, Screening, and Policy Acknowledgement"
    description: >-
      In addition to ECC controls 1-9-3 and 1-9-4, prior to and during the
      professional relationship: positions of cybersecurity functions in CSP
      data centres within the Kingdom of Saudi Arabia must be filled with
      qualified and suitable Saudi nationals; candidates of personnel with
      access to the Cloud Technology Stack shall be screened or vetted
      periodically; and cybersecurity policies shall be signed and approved as
      a prerequisite for access to the Cloud Technology Stack.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-04-hr-saudisation.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-4-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_1-9-3
      - NCA_ECC_1-9-4
      - ISO_27001_A.6.1
      - ISO_27001_A.6.2
    remediation: >-
      Identify all data-centre cybersecurity positions covered by the
      Saudisation requirement and track hiring against them. Apply periodic
      background screening for Cloud Technology Stack personnel. Require
      signed acknowledgement of cybersecurity policies prior to granting access.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_05
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-4 Cybersecurity in Human Resources"
    title: "HR Security -- Asset Return on Termination"
    description: >-
      In addition to ECC control 1-9-5, on termination or completion of a
      professional relationship, the CSP shall ensure that assets owned by
      the entity, especially those with security exposure, are fully accounted
      for and returned.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-05-hr-termination.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-4-P-2"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_1-9-5
      - ISO_27001_A.6.5
    remediation: >-
      Maintain a leavers checklist that covers return of all physical assets
      (laptops, tokens, badges) and revocation of logical access. Require
      signed asset return confirmation for roles with Cloud Technology Stack
      access before final clearance.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_06
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-5 Cybersecurity in Change Management"
    title: "Change Management Security Requirements -- Identification and Documentation"
    description: >-
      Cybersecurity requirements for change management within the CSP shall
      be identified, documented, and approved.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-06-change-mgmt-policy.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-5-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.32
    remediation: >-
      Document cybersecurity requirements within the change management policy,
      covering security testing, review gates, rollback criteria, and
      communication to affected CSTs. Obtain sign-off from the security
      governance function.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_07
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-5 Cybersecurity in Change Management"
    title: "Change Management Security Requirements -- Implementation"
    description: >-
      Cybersecurity requirements for change management within the CSP shall
      be applied.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-07-change-mgmt-impl.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-5-P-2"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.32
    remediation: >-
      Enforce the documented change management cybersecurity requirements in
      the change advisory board process. Gate production deployments on
      completion of security review checklists.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_08
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-5 Cybersecurity in Change Management"
    title: "Change Management Security Requirements -- Technical Controls"
    description: >-
      Cybersecurity change management shall cover, at a minimum: processes and
      procedures to implement planned changes in production systems securely,
      with priority given to resolving cybersecurity observations; and a process
      for implementing cybersecurity exceptional changes, such as those required
      during incident restoration.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-08-change-mgmt-controls.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-5-P-3"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.32
    remediation: >-
      Define a separate emergency change procedure that includes a
      post-incident security review gate. Ensure all production change tickets
      include a cybersecurity impact field and that security observations are
      tracked to closure.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_09
    pillar: "Domain 1 -- Cloud Cybersecurity Governance, 1-5 Cybersecurity in Change Management"
    title: "Change Management Security Requirements -- Periodic Review"
    description: >-
      Cybersecurity requirements for change management within the CSP shall
      be applied and reviewed periodically.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-09-change-mgmt-review.md"
    references:
      - "NCA CCC-2:2024 CSP control 1-5-P-4"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.32
    remediation: >-
      Schedule an annual review of change management cybersecurity requirements.
      Incorporate lessons learned from security incidents and audit findings
      into the change management policy at each review cycle.
    tags:
      - domain.governance
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_10
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-1 Asset Management"
    title: "Asset Inventory and Ownership for Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-1, the CSP shall maintain an inventory of
      all information and technology assets using suitable techniques such as a
      Configuration Management Database (CMDB), and shall identify asset owners
      and involve them in the asset management lifecycle.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-10-asset-inventory.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-1-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-1
      - ISO_27001_A.5.9
    remediation: >-
      Deploy or validate a CMDB covering all Cloud Technology Stack components.
      Assign named asset owners for every asset category. Integrate asset
      discovery with vulnerability and patch management tooling.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_11
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-2 Identity and Access Management"
    title: "Identity and Access Management for Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-2-3, the CSP shall implement comprehensive
      identity and access management including: management of generic account
      credentials; secure session management with session authenticity, lockout
      thresholds, and timeout termination; multi-factor authentication for
      privileged users and all personnel with Cloud Technology Stack access;
      formal unauthorised access detection and prevention; secure password
      hashing algorithms; third-party personnel account lifecycle management;
      access controls on management systems and administrative consoles; masking
      of authentication inputs on screen; obtaining CST approval before
      accessing CST-related assets; capability to immediately interrupt remote
      access sessions; provision of multi-factor authentication services to
      CSTs; and restricted access to storage systems and storage area
      networks (SAN).
    severity_default: critical
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "NCA CCC-2:2024 CSP control 2-2-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-2-3
      - ISO_27001_A.5.15
      - ISO_27001_A.5.16
      - ISO_27001_A.5.17
      - ISO_27001_A.8.5
    remediation: >-
      Audit all administrative and privileged accounts for MFA coverage.
      Implement just-in-time access for Cloud Technology Stack administration.
      Document the CST-approval workflow for access to CST assets. Enable
      session recording for privileged remote sessions.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_12
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-3 Information System and Information Processing Facilities Protection"
    title: "Information Systems Configuration and Tenant Isolation"
    description: >-
      In addition to ECC control 2-3-3, the CSP shall: apply configurations in
      accordance with cybersecurity standards; ensure separation and isolation
      of data, environments, and information systems across CSTs to prevent data
      commingling; adhere to the minimum functionality principle in technical
      configurations; handle input validation, exceptions, and failures securely;
      fully isolate security functions from other functions within the Cloud
      Technology Stack; notify CSTs of usable cybersecurity configuration
      requirements; detect and prevent unauthorised software changes; completely
      isolate and protect multiple guest environments from one another; isolate
      community cloud services provided to government and CNI entities from other
      commercial cloud services; and deploy modern endpoint detection and
      response (EDR) technologies.
    severity_default: critical
    evidence_basis:
      - context_input: "evidence/csp-12-tenant-isolation.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-3-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-3-3
      - ISO_27001_A.8.22
      - ISO_27001_A.8.9
    remediation: >-
      Review hypervisor and container platform isolation configurations against
      CIS Benchmarks or equivalent. Deploy EDR on all Cloud Technology Stack
      hosts. Implement configuration drift detection and alert on any
      unauthorised software installation or configuration change.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_13
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-4 Networks Security Management"
    title: "Network Security for the Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-5-3, the CSP shall: monitor traffic across
      external and internal networks to detect anomalies; isolate and protect
      the Cloud Technology Stack network from other internal and external
      networks; protect against denial-of-service and distributed
      denial-of-service attacks; protect data transmitted through the network
      using cryptographic primitives, including for management and administrative
      access; enforce access controls between network segments; and isolate the
      cloud service delivery network, cloud management network, and CSP
      enterprise network from one another.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-13-network-security.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-4-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-5-3
      - ISO_27001_A.8.20
      - ISO_27001_A.8.21
    remediation: >-
      Document the network segmentation architecture showing cloud service
      delivery, management, and enterprise network boundaries. Deploy DDoS
      mitigation. Enable flow-level traffic monitoring across all inter-segment
      links and integrate with SIEM for anomaly alerting.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_14
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-5 Mobile Devices Security"
    title: "Mobile Device Security and Inventory"
    description: >-
      In addition to ECC control 2-6-3, the CSP shall: maintain an inventory
      of all end-user and mobile devices; implement centralised mobile device
      security management; enforce screen locking on end-user devices; and apply
      data sanitation and secure disposal procedures for end-user devices,
      particularly those with exposure to the Cloud Technology Stack.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-14-mobile-device-security.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-5-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-6-3
      - ISO_27001_A.7.14
      - ISO_27001_A.6.7
    remediation: >-
      Deploy a mobile device management (MDM) platform covering all corporate
      mobile devices. Enforce screen lock and remote wipe capability. Apply
      certified data sanitation to devices with Cloud Technology Stack access
      prior to decommission or reassignment.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_15
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-6 Data and Information Protection"
    title: "CST Data Protection and Secure Disposal"
    description: >-
      In addition to ECC control 2-7-3, the CSP shall: prohibit the use of
      Cloud Technology Stack data in non-production environments without strict
      controls such as data masking or data scrambling; provide CSTs with secure
      data storage processes, procedures, and technologies compliant with legal
      and regulatory requirements; dispose of CST data securely on contract
      termination or expiry; maintain confidentiality of CST data and information
      in accordance with legal and regulatory requirements; and provide CSTs with
      secure means to export and transfer data and virtual infrastructure.
    severity_default: critical
    evidence_basis:
      - context_input: "evidence/csp-15-cst-data-protection.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-6-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-7-3
      - ISO_27001_A.5.33
      - ISO_27001_A.5.12
    remediation: >-
      Enforce data masking controls as a gate in the environment provisioning
      pipeline for non-production copies of production data. Provide CSTs with
      a documented certified-deletion procedure and a self-service data export
      mechanism. Audit data disposal completeness on contract termination.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_16
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-7 Cryptography"
    title: "Cryptographic Standards for Cloud Services"
    description: >-
      In addition to ECC control 2-8-3, the CSP shall implement technical
      mechanisms and cryptographic primitives for strong encryption in
      accordance with the advanced level of the National Cryptographic
      Standards (NCS-1:2020), and shall maintain or use a trusted certification
      authority and certificate issuance capability in a secure manner.
    severity_default: critical
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "NCA CCC-2:2024 CSP control 2-7-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-8-3
      - ISO_27001_A.8.24
    remediation: >-
      Apply NCS-1:2020 advanced-level cryptographic algorithms across all Cloud
      Technology Stack encryption contexts. Operate or contract a PKI that meets
      NCA requirements for certificate issuance and revocation. Publish a
      certificate transparency log for all externally facing services.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_17
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-8 Backup and Recovery Management"
    title: "Secure Management of Backups for Cloud Services"
    description: >-
      In addition to ECC control 2-9-3, the CSP shall secure the access,
      storage, and transfer of CST data backups and their storage media,
      protecting them against damage, amendment, or unauthorised access; and
      shall equally secure Cloud Technology Stack backups and their media.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-17-backup-recovery.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-8-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-9-3
      - ISO_27001_A.8.13
    remediation: >-
      Encrypt all CST and Cloud Technology Stack backups at rest and in transit.
      Restrict backup storage access to authorised operations personnel. Test
      backup restoration procedures at least annually. Segregate backup media
      from primary systems and document custodianship.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_18
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-9 Vulnerabilities Management"
    title: "Vulnerability Assessment and Remediation for Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-10-3, the CSP shall: assess and remediate
      vulnerabilities on external components of the Cloud Technology Stack at
      least once every month and on internal components at least once every
      three months; and notify CSTs of identified vulnerabilities that may
      affect them, including detailing the safeguards in place.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-18-vulnerability-management.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-9-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-10-3
      - ISO_27001_A.8.8
    remediation: >-
      Schedule monthly vulnerability scans of all external Cloud Technology
      Stack components and quarterly scans of internal components. Define
      remediation SLAs by severity (e.g., critical within 15 days). Implement
      a CST notification process for vulnerabilities affecting tenant workloads.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_19
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-10 Penetration Testing"
    title: "Penetration Testing of the Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-11-3, the CSP shall conduct penetration
      tests covering the full Cloud Technology Stack at least once every
      six months.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-19-penetration-testing.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-10-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-11-3
      - ISO_27001_A.8.8
    remediation: >-
      Engage an NCA-approved or accredited penetration testing provider for
      bi-annual tests of the Cloud Technology Stack. Maintain test reports and
      track findings to remediation. Brief CSTs on findings that affect
      shared infrastructure within the disclosure terms of the contract.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_20
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-11 Cybersecurity Event Logs and Monitoring Management"
    title: "Cybersecurity Event Logs and Monitoring for Cloud Technology Stack"
    description: >-
      In addition to ECC control 2-12-3, the CSP shall: activate and protect
      event logs and audit trails of the Cloud Technology Stack; collect and
      retain login attempt history; activate and protect tenant-level activity
      and operation logs to support forensic analysis; protect event logs
      against alteration, disclosure, destruction, and unauthorised access in
      accordance with regulatory requirements; continuously monitor cybersecurity
      events using SIEM covering the full Cloud Technology Stack; periodically
      review event logs and audit trails; automatically monitor and log remote
      access session events; and handle user-related data in audit trails
      securely in accordance with relevant legislation.
    severity_default: high
    evidence_basis:
      - signal_prefix: OBS
    references:
      - "NCA CCC-2:2024 CSP control 2-11-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-12-3
      - ISO_27001_A.8.15
      - ISO_27001_A.8.16
    remediation: >-
      Confirm SIEM coverage extends to all Cloud Technology Stack layers.
      Enable immutable log storage for all audit trails. Define log retention
      periods consistent with NCA regulatory requirements. Conduct quarterly
      log review exercises and document findings.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_21
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-12 Cybersecurity Incident and Threat Management"
    title: "Cybersecurity Incident and Threat Management for Cloud Services"
    description: >-
      In addition to ECC control 2-13-3, the CSP shall: subscribe to authorised
      and specialised cybersecurity threat intelligence entities and groups;
      train employees and third-party personnel for incident response in line
      with their roles; periodically test incident response capability; conduct
      root cause analysis of incidents and develop remediation plans; support
      CSTs in legal proceedings and forensic investigations while protecting
      chain of custody for assets under CSP management; report in real time to
      CSTs any incident that may affect them; support CSTs in handling security
      incidents per agreed terms; and measure and monitor cybersecurity incident
      metrics and compliance with contractual and legislative requirements.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-21-incident-management.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-12-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-13-3
      - ISO_27001_A.5.25
      - ISO_27001_A.5.26
      - ISO_27001_A.5.28
    remediation: >-
      Subscribe to NCA-approved threat intelligence feeds. Conduct at least
      annual incident response exercises including CST notification scenarios.
      Define and publish SLA-bound CST incident notification timelines within
      service agreements. Maintain forensic evidence preservation procedures.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_22
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-13 Physical Security"
    title: "Physical Security of Cloud Infrastructure"
    description: >-
      In addition to ECC control 2-14-3, the CSP shall: continually monitor
      physical access to its sites and buildings; prevent unauthorised physical
      access to devices in the Cloud Technology Stack; and dispose of cloud
      infrastructure hardware, particularly storage equipment, in accordance
      with relevant legislation and industry best practices.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-22-physical-security.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-13-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-14-3
      - ISO_27001_A.7.4
      - ISO_27001_A.7.14
    remediation: >-
      Implement 24x7 CCTV and badge access monitoring for all data centre
      facilities. Apply layered physical access controls (perimeter, floor,
      cage, rack) with audit logging. Use certified data destruction services
      for all decommissioned storage hardware.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_23
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-14 Web Application Security"
    title: "Web Application Security for CSP External Services"
    description: >-
      In addition to ECC control 2-15-3, the CSP shall protect information
      involved in application service transactions against risks including
      incomplete transmission, mis-routing, unauthorised message alteration,
      and unauthorised disclosure.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-23-web-app-security.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-14-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-15-3
      - ISO_27001_A.8.26
    remediation: >-
      Deploy a web application firewall (WAF) for all externally facing CSP
      application endpoints. Enforce TLS for all application transactions.
      Include application security requirements in the SDLC and conduct OWASP
      Top-10 assessments before production deployment.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_24
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-15 Key Management"
    title: "Key Management Policy -- Identification and Documentation"
    description: >-
      Cybersecurity requirements for the key management process within the CSP
      shall be identified, documented, and approved.
    severity_default: high
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "NCA CCC-2:2024 CSP control 2-15-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-8-3-2
      - ISO_27001_A.8.24
    remediation: >-
      Produce a formal key management policy for the Cloud Technology Stack
      covering key generation, distribution, storage, rotation, revocation,
      and destruction. Obtain security governance sign-off and version the
      document under change control.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_25
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-15 Key Management"
    title: "Key Management Policy -- Implementation"
    description: >-
      Cybersecurity requirements for key management within the CSP shall be
      applied.
    severity_default: high
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "NCA CCC-2:2024 CSP control 2-15-P-2"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-8-3-2
      - ISO_27001_A.8.24
    remediation: >-
      Deploy hardware security modules (HSMs) or equivalent cloud key management
      services for the Cloud Technology Stack. Enforce key lifecycle controls
      (rotation schedules, key ceremony procedures) as specified in the key
      management policy.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_26
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-15 Key Management"
    title: "Key Management -- Technical Requirements"
    description: >-
      In addition to ECC Subcontrol 2-8-3-2, the CSP shall: ensure well-defined
      ownership for all cryptographic keys; implement a secure cryptographic key
      retrieval mechanism in case of key loss -- for example, key backup with
      trusted key storage strictly external to the cloud; and activate and
      monitor all audit trails of cryptographic key operations.
    severity_default: high
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "NCA CCC-2:2024 CSP control 2-15-P-3"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-8-3-2
      - ISO_27001_A.8.24
    remediation: >-
      Assign named owners to all cryptographic key material. Implement key
      escrow or off-cloud backup to a physically separate trusted key store.
      Enable cryptographic audit trails and integrate them with the SIEM.
      Document and test the key recovery procedure annually.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_27
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-15 Key Management"
    title: "Key Management Policy -- Periodic Review"
    description: >-
      Cybersecurity requirements for key management within the CSP shall be
      applied and reviewed periodically.
    severity_default: medium
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "NCA CCC-2:2024 CSP control 2-15-P-4"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_2-8-3-2
      - ISO_27001_A.8.24
    remediation: >-
      Schedule an annual review of key management policy and controls.
      Incorporate updates from NCS-1:2020 revisions and findings from key
      management audits. Record the review outcome and track actions to closure.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_28
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-16 System Development Security"
    title: "System Development Security Policy -- Identification and Documentation"
    description: >-
      Cybersecurity requirements for system development within the CSP shall
      be identified, documented, and approved.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-28-sysdev-policy.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-16-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.25
    remediation: >-
      Document secure development lifecycle (SDLC) requirements covering the
      Cloud Technology Stack, including design review gates, threat modelling,
      code review, and security testing requirements. Obtain sign-off from
      security governance.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_29
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-16 System Development Security"
    title: "System Development Security Policy -- Implementation"
    description: >-
      Cybersecurity requirements for system development within the CSP shall
      be applied.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-29-sysdev-impl.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-16-P-2"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.25
    remediation: >-
      Enforce SDLC security gates in the CI/CD pipeline for Cloud Technology
      Stack components. Require SAST and dependency scanning results before
      merging to production branches. Track security defect backlog alongside
      functional defects.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_30
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-16 System Development Security"
    title: "System Development Security -- Technical Controls"
    description: >-
      Cybersecurity requirements for system development across the Cloud
      Technology Stack shall include, at a minimum: consideration of
      cybersecurity requirements of the Cloud Technology Stack and relevant
      systems in the design and implementation of cloud computing services;
      and protection of development environments, testing environments
      (including data used in testing), and integration platforms.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-30-sysdev-controls.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-16-P-3"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.25
      - ISO_27001_A.8.30
      - ISO_27001_A.8.31
    remediation: >-
      Include threat modelling and security design review as mandatory phases
      in the Cloud Technology Stack SDLC. Isolate development and test
      environments from production. Apply data masking controls before using
      any production data in non-production environments.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_31
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-16 System Development Security"
    title: "System Development Security -- Periodic Review"
    description: >-
      Cybersecurity requirements for system development within the CSP shall
      be applied and reviewed periodically.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-31-sysdev-review.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-16-P-4"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.8.25
    remediation: >-
      Schedule annual reviews of the SDLC security requirements. Incorporate
      findings from penetration tests and security audits into the next review
      cycle. Update threat models when the Cloud Technology Stack architecture
      changes significantly.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_32
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-17 Storage Media Security"
    title: "Storage Media Security Policy -- Identification and Documentation"
    description: >-
      Cybersecurity requirements for the usage of information and data storage
      media within the CSP shall be identified, documented, and approved.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-32-media-policy.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-17-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.7.10
      - ISO_27001_A.7.14
    remediation: >-
      Document storage media security requirements covering classification
      labelling, access controls, transport, sanitation, and disposal.
      Obtain sign-off from security governance and include the policy in the
      new employee onboarding programme.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_33
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-17 Storage Media Security"
    title: "Storage Media Security Policy -- Implementation"
    description: >-
      Cybersecurity requirements for the usage of information and data storage
      media within the CSP shall be applied.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-33-media-impl.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-17-P-2"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.7.10
      - ISO_27001_A.7.14
    remediation: >-
      Enforce the storage media policy through technical controls: media
      classification labels, access control lists on storage repositories,
      and mandatory use of encrypted transport for removable media. Track
      all removable media movements via an asset register.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_34
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-17 Storage Media Security"
    title: "Storage Media Security -- Technical Controls"
    description: >-
      Cybersecurity requirements for storage media usage shall include, at a
      minimum: sanitisation of media prior to disposal or reuse; secure disposal
      means; maintenance of confidentiality and integrity of data on removable
      media; human-readable classification labelling on all media; controlled
      and physically secure storage of removable media; and restriction and
      control of portable media usage inside the Cloud Technology Stack.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-34-media-controls.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-17-P-3"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.7.10
      - ISO_27001_A.7.14
      - ISO_27001_A.5.12
    remediation: >-
      Implement NIST 800-88 or equivalent sanitisation standards for all
      decommissioned media. Block unauthorised removable media via endpoint
      DLP controls within the Cloud Technology Stack perimeter. Apply
      classification labels to all removable media before use.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_35
    pillar: "Domain 2 -- Cloud Cybersecurity Defense, 2-17 Storage Media Security"
    title: "Storage Media Security -- Periodic Review"
    description: >-
      Cybersecurity requirements for the usage of information and data storage
      media within the CSP shall be applied and reviewed periodically.
    severity_default: medium
    evidence_basis:
      - context_input: "evidence/csp-35-media-review.md"
    references:
      - "NCA CCC-2:2024 CSP control 2-17-P-4"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - ISO_27001_A.7.10
    remediation: >-
      Schedule an annual review of storage media security requirements and
      controls. Update procedures in response to changes in data classification
      guidance, hardware decommission volumes, or findings from physical security
      audits.
    tags:
      - domain.defense
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_36
    pillar: "Domain 3 -- Cloud Cybersecurity Resilience, 3-1 Cybersecurity Resilience Aspects of Business Continuity Management (BCM)"
    title: "Cloud Business Continuity and Cybersecurity Resilience"
    description: >-
      In addition to ECC control 3-1-3, the CSP shall: develop and implement
      disaster recovery and business continuity procedures in a secure manner;
      and develop and implement procedures to ensure the resilience and
      continuity of cybersecurity systems dedicated to the protection of the
      Cloud Technology Stack.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-36-bcm-resilience.md"
    references:
      - "NCA CCC-2:2024 CSP control 3-1-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_3-1-3
      - ISO_27001_A.5.29
      - ISO_27001_A.5.30
    remediation: >-
      Develop and test a cloud-specific BCM and DR plan covering the Cloud
      Technology Stack, including failover of security monitoring and SIEM
      infrastructure. Define recovery time objectives (RTOs) and recovery point
      objectives (RPOs) for cybersecurity systems. Conduct annual BCM exercises.
    tags:
      - domain.resilience
      - role.cloud-provider
      - applies-to.ksa-regulated

  - id: NCA_CCC_CSP_37
    pillar: "Domain 4 -- Third-Party Cloud Cybersecurity, 4-1 Supply Chain and Third-Party Cybersecurity"
    title: "Supply Chain and Third-Party Cybersecurity"
    description: >-
      In addition to ECC controls 4-1-2 and 4-1-3, the CSP shall: ensure
      compliance with NCA requests to remove third-party software or services
      from the marketplace provided to CSTs where those services pose a
      cybersecurity threat to national entities; require security documentation
      for all equipment or services from suppliers and third-party providers;
      ensure third-party providers comply with applicable legal and regulatory
      requirements; and integrate risk management and security governance for
      third-party providers into the general cybersecurity risk management and
      governance framework.
    severity_default: high
    evidence_basis:
      - context_input: "evidence/csp-37-supply-chain.md"
    references:
      - "NCA CCC-2:2024 CSP control 4-1-P-1"
      - "https://cdn.nca.gov.sa/api/files/public/upload/6d5408a3-d8e6-4e96-963b-2c7198e5b7c2_CCC-2-2024-EN-.pdf"
    overrides: []
    maps_to:
      - NCA_ECC_4-1-2
      - NCA_ECC_4-1-3
      - ISO_27001_A.5.19
      - ISO_27001_A.5.20
      - ISO_27001_A.5.21
    remediation: >-
      Maintain a third-party software bill of materials (SBOM) for the Cloud
      Technology Stack. Establish a process to act on NCA removal requests
      within defined SLAs. Require SOC 2 or equivalent audit reports from
      critical suppliers. Integrate third-party risk into the annual
      cybersecurity risk review.
    tags:
      - domain.third-party
      - role.cloud-provider
      - applies-to.ksa-regulated
