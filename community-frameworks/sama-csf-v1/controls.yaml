# SWAO community framework -- SAMA Cyber Security Framework v1.0
# Schema: RegimeCatalogueSchema v0.11 (design 029 §4.5; design 018 §2.1).
#
# Source: Saudi Arabian Monetary Authority (SAMA) CSF v1.0, Document
# No. 381000091275, first published May 2017; current as of 2026.
# PDF: https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx
#
# Modelling approach: 30 domain-area controls across 5 domains. One control
# per significant subdomain or control cluster. Descriptions paraphrase
# SAMA CSF requirements at Level 3 (Defined) -- the regulatory minimum.
# Research provenance: docs/custom-frameworks/_research/saudi-arabia-regulatory-frameworks.md

regime_meta:
  id: SAMA_CSF
  name: "Saudi Arabian Monetary Authority -- Cyber Security Framework v1.0"
  version: "CSF v1.0 -- issued by SAMA, first published 2017; current as of 2026"
  authority: "Saudi Arabian Monetary Authority (SAMA)"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
  catalogue_version: "1.0.0"
  signal_prefix: SAMA_CSF
  last_reviewed: "2026-07-18"
  applicability_hints:
    - ksa_financial_sector
    - ksa_regulated_entity
    - banking
    - insurance
    - finance_company
  # maturity_model flag signals that this framework uses maturity scoring
  # (Level 0-5 per domain) alongside binary SWAO verdicts. Regulatory minimum
  # is Level 3 (Defined); any domain below Level 3 surfaces as BLOCKED.
  maturity_model: true

controls:
  # ======================================================================
  # Domain 1 -- Leadership and Governance (SAMA_CSF_GOV)
  # 28 controls in the full framework; modelled here as 6 domain-area controls.
  # Key topics: strategy, CISO function, policy framework, personnel security,
  # physical security, awareness and training.
  # ======================================================================
  - id: SAMA_CSF_GOV_01
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Strategy and Governance Framework"
    description: >-
      A formal cybersecurity strategy must be documented, approved by senior
      management, and aligned with the organisation's business strategy and
      risk appetite. The strategy must define cybersecurity objectives, resource
      requirements, and a multi-year roadmap. At Level 3 (Defined), the strategy
      is reviewed at least annually, updated following material changes to the
      business or threat landscape, and communicated to all relevant stakeholders.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_01-strategy-governance-framework.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Strategy subdomain"
    overrides: []
    maps_to:
      - COBIT_5_EDM_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.1
      - ISO_27001_A.5.2
      - NIST_CSF_GV_01
    remediation: >-
      Develop and formally approve a cybersecurity strategy document. Establish
      a governance committee with board-level sponsorship. Schedule annual
      strategy reviews. Align with SAMA CSF Level 3 requirements by documenting
      the strategy tailoring process against the organisation-wide standard.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_GOV_02
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Management Structure and Ownership"
    description: >-
      A distinct CISO function (or equivalent) must be established with clearly
      defined authority, reporting line to senior management, and sufficient
      resources to execute the cybersecurity programme. Governance committees
      with defined mandates, membership, and meeting frequency must be in place.
      Escalation paths for cybersecurity decisions and incident reporting to the
      board must be formally documented and tested at Level 3 (Defined).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_02-management-structure-ownership.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Management structure subdomain"
    overrides: []
    maps_to:
      - COBIT_5_EDM_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.2
      - ISO_27001_A.5.3
      - NIST_CSF_GV_02
    remediation: >-
      Formally appoint a CISO or equivalent with documented terms of reference.
      Establish a Cybersecurity Steering Committee with board representation.
      Define and publish escalation procedures. Maintain an organisation chart
      showing cybersecurity reporting lines up to board level.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_GOV_03
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Policies and Procedures"
    description: >-
      A comprehensive cybersecurity policy framework must be documented, formally
      approved, published, and communicated to all relevant personnel. The policy
      suite must cover all SAMA CSF domains and subdomains, including acceptable
      use, access control, incident response, and third-party governance. At Level
      3 (Defined), policies are reviewed at least annually and updated following
      significant incidents, regulatory changes, or material changes to the
      organisation's environment. Exceptions must be formally tracked and approved.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_03-policies-procedures.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Policy framework subdomain"
    overrides: []
    maps_to:
      - COBIT_5_APO_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.1
      - NIST_CSF_GV_01
    remediation: >-
      Produce a master policy register covering all SAMA CSF topic areas. Assign
      policy owners and set review schedules. Publish policies on an internal
      portal accessible to all staff. Establish a formal exception and waiver
      process with CISO sign-off.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_GOV_04
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Roles and Responsibilities"
    description: >-
      Cybersecurity roles and responsibilities must be clearly defined and assigned
      across the organisation, including for contractors and third parties with
      access to systems or data. The entity must maintain an up-to-date RACI matrix
      covering all cybersecurity domains. Personnel security controls -- including
      background checks for roles with access to sensitive systems, security
      clauses in employment contracts, and offboarding procedures -- must be
      implemented and documented at Level 3 (Defined).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_04-roles-responsibilities.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Roles and responsibilities subdomain"
    overrides: []
    maps_to:
      - COBIT_5_APO_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.2
      - ISO_27001_A.6.1
      - NIST_CSF_GV_02
    remediation: >-
      Publish a RACI matrix for all cybersecurity activities. Include cybersecurity
      responsibilities in job descriptions and employment contracts. Implement a
      formal joiner-mover-leaver process covering system access and security
      obligations. Document and test offboarding procedures.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_GOV_05
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Risk Appetite and Tolerance"
    description: >-
      The board and senior management must formally define and approve the
      organisation's cybersecurity risk appetite and tolerance thresholds. Risk
      appetite statements must be specific enough to guide operational decisions
      on accepting, mitigating, transferring, or avoiding cyber risks. At Level 3
      (Defined), the risk appetite is documented in a board-approved statement,
      communicated to all relevant stakeholders, and reviewed at least annually
      or following significant incidents.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_05-risk-appetite-tolerance.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Risk appetite subdomain"
    overrides: []
    maps_to:
      - COBIT_5_EDM_03
      - NCA_ECC_GOV
      - ISO_27001_A.5.4
      - NIST_CSF_GV_06
    remediation: >-
      Draft a board-approved risk appetite statement with quantified thresholds
      (e.g., maximum acceptable downtime, maximum acceptable data exposure). Link
      risk appetite to the risk management process so operational decisions can
      reference it. Schedule an annual board review of the statement.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_GOV_06
    pillar: "Domain 1 -- Leadership and Governance"
    title: "Cyber Security Compliance and Internal Audit"
    description: >-
      A formal compliance monitoring programme must be established covering all
      cybersecurity obligations including SAMA requirements, National Cybersecurity
      Authority (NCA) directives, and internal policies. An independent internal
      audit function must assess cybersecurity control maturity at least annually
      and report findings to senior management and the audit committee. At Level 3
      (Defined), audit methodologies are standardised, findings are tracked to
      closure, and repeated findings trigger root-cause analysis and escalation.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_GOV_06-compliance-internal-audit.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 1, Leadership and Governance -- Compliance and audit subdomain"
    overrides: []
    maps_to:
      - COBIT_5_MEA_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.35
      - ISO_27001_A.5.36
      - NIST_CSF_GV_04
    remediation: >-
      Build a compliance register mapping each SAMA CSF control to internal
      policies and responsible owners. Establish an annual internal audit plan
      for cybersecurity. Implement a finding-tracking system with defined SLAs
      for remediation. Report maturity scores by domain to the audit committee.
    tags:
      - "domain.governance"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  # ======================================================================
  # Domain 2 -- Risk Management and Compliance (SAMA_CSF_RISK)
  # 32 controls in the full framework; modelled here as 4 domain-area controls.
  # Key topics: risk assessment, compliance monitoring, audit management,
  # regulatory reporting, third-party risk, cyber risk to senior management.
  # ======================================================================
  - id: SAMA_CSF_RISK_01
    pillar: "Domain 2 -- Risk Management and Compliance"
    title: "Cyber Risk Management Process"
    description: >-
      A formal cyber risk management process must be fully implemented, covering
      systematic risk identification, assessment (likelihood and impact), treatment
      selection (accept, mitigate, transfer, avoid), monitoring, and reporting.
      Risk assessments must be conducted at least annually and following significant
      changes to the environment, threat landscape, or business operations. At Level
      3 (Defined), the process follows a documented organisation-wide methodology
      and risk results feed directly into investment and remediation decisions.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RISK_01-risk-management-process.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 2, Risk Management and Compliance -- Cyber risk management subdomain"
    overrides: []
    maps_to:
      - COBIT_5_APO_12
      - NCA_ECC_GOV
      - ISO_27001_A.6.1
      - ISO_27001_A.8.2
      - NIST_CSF_ID_RA
    remediation: >-
      Implement an ISO 31000-aligned cyber risk management process. Maintain a
      risk register with all identified cyber risks, treatment plans, owners, and
      review dates. Conduct a full risk assessment annually and following material
      changes. Integrate risk register outputs into the cybersecurity roadmap and
      budget planning cycle.
    tags:
      - "domain.risk-management"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RISK_02
    pillar: "Domain 2 -- Risk Management and Compliance"
    title: "Third-Party Cyber Risk Assessment"
    description: >-
      All third parties with access to or processing of the entity's information,
      systems, or infrastructure must undergo a cybersecurity risk assessment
      before engagement and at periodic intervals during the relationship. Assessment
      results must inform contractual cybersecurity requirements and ongoing
      monitoring obligations. At Level 3 (Defined), a standardised assessment
      methodology is applied consistently, results are documented, and residual
      risk is formally accepted or escalated to senior management.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RISK_02-third-party-risk-assessment.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 2, Risk Management and Compliance -- Third-party risk subdomain"
    overrides: []
    maps_to:
      - COBIT_5_APO_10
      - NCA_ECC_GOV_05
      - ISO_27001_A.5.19
      - ISO_27001_A.5.21
      - NIST_CSF_GV_06
    remediation: >-
      Develop a third-party risk assessment questionnaire covering cybersecurity
      controls, certifications, and incident response capability. Require assessments
      before contract award for all Tier 1 and Tier 2 suppliers. Schedule annual
      reassessments. Include cybersecurity obligations and right-to-audit clauses
      in all supplier contracts.
    tags:
      - "domain.risk-management"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RISK_03
    pillar: "Domain 2 -- Risk Management and Compliance"
    title: "Regulatory Compliance Monitoring"
    description: >-
      The entity must maintain a structured inventory of applicable cybersecurity
      regulatory requirements, including SAMA directives, NCA requirements, and
      relevant sector-specific guidelines. Compliance against each requirement must
      be systematically tracked, with gaps identified, assigned to owners, and
      subject to defined remediation timelines. At Level 3 (Defined), the compliance
      monitoring process is documented and performed against a consistent methodology;
      compliance status and material gaps are reported to senior management on a
      regular basis.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RISK_03-regulatory-compliance-monitoring.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 2, Risk Management and Compliance -- Compliance monitoring subdomain"
    overrides: []
    maps_to:
      - COBIT_5_MEA_03
      - NCA_ECC_GOV
      - ISO_27001_A.5.35
      - ISO_27001_A.5.36
      - NIST_CSF_GV_04
    remediation: >-
      Maintain a regulatory horizon-scanning process to identify new or amended
      obligations. Map each SAMA directive and NCA requirement to internal controls
      and owners. Produce a compliance dashboard with RAG status by domain. Report
      compliance gaps and remediation progress to the audit committee quarterly.
    tags:
      - "domain.risk-management"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RISK_04
    pillar: "Domain 2 -- Risk Management and Compliance"
    title: "Cyber Risk Reporting to Senior Management"
    description: >-
      Cybersecurity risk status must be reported to senior management and the
      board on a regular basis (at minimum quarterly). Reports must include key
      risk indicators (KRIs), maturity levels by domain, incident trends, the status
      of open remediation programmes, and any emerging threats material to the
      entity. At Level 3 (Defined), report formats are standardised, production is
      reliable, and reporting timelines are consistently met. The board formally
      acknowledges receipt and approves material risk decisions.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RISK_04-cyber-risk-reporting.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 2, Risk Management and Compliance -- Risk reporting subdomain"
    overrides: []
    maps_to:
      - COBIT_5_MEA_01
      - NCA_ECC_GOV
      - ISO_27001_A.5.4
      - ISO_27001_A.6.1
      - NIST_CSF_GV_04
    remediation: >-
      Develop a standard cyber risk dashboard template covering KRIs, domain
      maturity scores, incident counts, and remediation status. Schedule quarterly
      reporting to the audit committee and annual reporting to the full board.
      Document board acknowledgement and any risk acceptance decisions in meeting
      minutes.
    tags:
      - "domain.risk-management"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  # ======================================================================
  # Domain 3 -- Cybersecurity Operations (SAMA_CSF_OPS)
  # 46 controls in the full framework; modelled here as 12 domain-area controls.
  # Key topics: asset management, IAM, network security, application security,
  # cryptography, vulnerability management, SIEM, incident response, physical
  # security, change management, endpoint security, awareness.
  # ======================================================================
  - id: SAMA_CSF_OPS_01
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Asset Management and Classification"
    description: >-
      A complete, accurate, and up-to-date inventory of all information assets --
      hardware, software, data, and network -- must be maintained. Assets must be
      classified according to their criticality and sensitivity to the organisation's
      operations. Asset lifecycles must be managed from procurement through secure
      decommission and disposal, including certificates of destruction for media
      containing regulated financial data. At Level 3 (Defined), the asset inventory
      process follows a documented organisation-wide standard with regular automated
      reconciliation.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_01-asset-management-classification.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Asset management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.5.9
      - ISO_27001_A.5.10
      - NIST_CSF_ID_AM
    remediation: >-
      Deploy an automated asset discovery and inventory tool (CMDB or equivalent).
      Define and apply an asset classification taxonomy with at least three tiers
      (critical, important, standard). Establish a quarterly reconciliation process.
      Implement secure disposal procedures with documented certificates of destruction
      for media containing regulated data.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_02
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Identity and Access Management"
    description: >-
      Access to information systems and data must be governed through a formal IAM
      programme covering user provisioning, de-provisioning, privilege management,
      and periodic access reviews (at least annually). Privileged accounts must be
      subject to enhanced controls including multi-factor authentication, just-in-time
      access, and session recording. Access rights must follow the principle of least
      privilege and segregation of duties. At Level 3 (Defined), the IAM process is
      standardised across the organisation and access reviews are completed on a
      consistent schedule with documented outcomes.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: IAM }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Identity and access management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF_02
      - ISO_27001_A.5.15
      - ISO_27001_A.5.16
      - SOC_2_CC6.1
      - PCI_DSS_7.1
    remediation: >-
      Implement an IAM platform with automated provisioning and de-provisioning
      workflows. Enforce MFA for all privileged accounts and remote access. Conduct
      formal access reviews at least quarterly for privileged accounts and annually
      for all other accounts. Deploy Privileged Access Management (PAM) tooling with
      session recording for administrator accounts.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_03
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Data Classification and Protection"
    description: >-
      Information assets must be classified using a multi-tier data taxonomy before
      storage or processing. For Saudi financial entities, the classification scheme
      aligns with NCA guidelines: Public (unrestricted), Internal (for internal use
      only), and Restricted (sensitive business or customer data), with a
      Critical/Confidential tier for financial customer records and personal data
      subject to SAMA data governance requirements. Handling, storage, transmission,
      and disposal controls must be defined and consistently applied according to
      each classification tier. Data flows involving regulated data must be
      documented and kept current.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_03-data-classification-protection.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Data classification subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.5.12
      - ISO_27001_A.5.13
      - NIST_CSF_PR_DS
    remediation: >-
      Define a data classification policy aligned with the four NCA tiers (Public,
      Internal, Restricted, Critical/Confidential). Label all regulated data at
      creation. Implement DLP controls to detect and prevent unauthorised transmission
      of Restricted and Critical data. Produce and maintain a data flow map for all
      customer and financial data. Apply controls appropriate to each tier.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_04
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Network Security Architecture"
    description: >-
      A layered network security architecture must be designed and implemented,
      incorporating perimeter controls (firewalls, DMZs), network segmentation
      (separating production, management, and user zones), and intrusion
      detection/prevention systems. Secure configuration baselines must be applied
      to all network devices and reviewed at least annually. Remote access must use
      encrypted channels with multi-factor authentication. Network access for
      third parties must be controlled, time-limited, and monitored. At Level 3
      (Defined), the network security architecture follows a documented standard and
      is reviewed following significant changes.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_04-network-security-architecture.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Network security subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.8.20
      - ISO_27001_A.8.21
      - NIST_CSF_PR_IR
      - PCI_DSS_1.1
    remediation: >-
      Produce a network architecture diagram and review it against SAMA CSF
      requirements. Implement network segmentation between production, test, and
      management networks. Deploy IDS/IPS on all external-facing segments. Enforce
      MFA for all VPN and remote-access solutions. Apply CIS Benchmarks to all
      network device configurations.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_05
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Cryptography and Key Management"
    description: >-
      Cryptographic controls must protect data at rest and in transit in accordance
      with a documented cryptography policy. The entity must implement a key
      management programme covering the full key lifecycle: generation (using
      hardware security modules where appropriate), secure storage, distribution,
      rotation, revocation, and destruction. Industry-standard algorithms must be
      used (AES-256 for symmetric, RSA-2048/4096 or ECC P-256 or stronger for
      asymmetric); deprecated ciphers and protocols (MD5, SHA-1, TLS 1.0/1.1,
      DES, 3DES) must be prohibited. At Level 3 (Defined), cryptography standards
      are documented and consistently applied across all systems.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Cryptography subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF_08
      - ISO_27001_A.8.24
      - PCI_DSS_3.4
      - NIST_CSF_PR_DS_02
    remediation: >-
      Publish a cryptography standard mandating approved algorithms and minimum
      key lengths. Deploy HSMs for key generation and storage of critical keys.
      Enforce TLS 1.2 or higher across all interfaces. Establish a key rotation
      schedule (at minimum annual for long-lived keys). Scan all systems for use
      of deprecated ciphers and remediate findings.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_06
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Vulnerability Management and Patch Management"
    description: >-
      A formal vulnerability management programme must be maintained, covering
      regular vulnerability scanning of all in-scope systems (at least monthly for
      critical assets), risk-based prioritisation using a scoring methodology (such
      as CVSS), defined remediation SLAs by severity, and tracking of remediation
      progress to closure. Penetration testing must be conducted at least annually
      and following significant changes to critical systems. At Level 3 (Defined),
      the patch management process is standardised across the organisation and
      compliance against SLAs is measured and reported.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_06-vulnerability-patch-management.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Vulnerability management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.8.8
      - NIST_CSF_ID_RA
      - PCI_DSS_6.3
    remediation: >-
      Deploy an authenticated vulnerability scanner against all in-scope systems.
      Define patch SLAs: critical within 24 hours, high within 7 days, medium within
      30 days. Track remediation through a ticketing system with escalation for
      breached SLAs. Commission an annual penetration test by a qualified third party
      and remediate critical findings before the next assessment.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_07
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Cybersecurity Event Monitoring and SIEM"
    description: >-
      A Security Information and Event Management (SIEM) capability must be
      implemented to collect, correlate, and analyse security events from all
      critical systems. Event monitoring must operate continuously (24/7); alert
      use cases, detection rules, and thresholds must be documented, maintained,
      and reviewed at least annually. Logs must be retained for a defined period
      consistent with regulatory and forensic requirements (minimum 12 months
      hot storage recommended). At Level 3 (Defined), SIEM coverage, alert response
      processes, and escalation paths are standardised across the organisation.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Event monitoring subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF_12
      - ISO_27001_A.8.15
      - ISO_27001_A.8.16
      - NIST_CSF_DE_AE
      - SOC_2_CC7.2
    remediation: >-
      Integrate all critical systems into the SIEM (including core banking, IAM,
      network devices, and cloud workloads). Define a minimum set of SIEM use cases
      aligned to the SAMA CSF threat landscape (e.g., privilege escalation, lateral
      movement, data exfiltration). Establish 24/7 SOC coverage or a managed SOC
      arrangement. Test alerting paths quarterly.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_08
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Cyber Incident Management and Response"
    description: >-
      A formal cyber incident management and response capability must be established,
      including defined incident classification tiers, escalation procedures, response
      playbooks for priority scenario types, and designated response team roles. Cyber
      incidents affecting SAMA-regulated operations must be reported to SAMA within
      the required regulatory timeframes. Post-incident reviews must identify root
      causes, assess response effectiveness, and produce improvement actions tracked
      to closure. At Level 3 (Defined), incident management follows a documented
      standardised process that is tested at least annually through tabletop exercises
      or simulations.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_08-incident-management.md" }
      - { signal_prefix: OBS }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Incident management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.5.24
      - ISO_27001_A.5.26
      - NIST_CSF_RS
      - SOC_2_CC7.3
    remediation: >-
      Document an incident response plan with at minimum five scenario playbooks
      (ransomware, data breach, insider threat, DDoS, supply chain compromise).
      Define SAMA regulatory notification thresholds and the internal escalation
      path to the CISO and board. Conduct a tabletop exercise annually and a full
      simulation at least every two years. Track all post-incident actions to closure.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_09
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Physical and Environmental Security"
    description: >-
      Data centres and facilities housing critical information assets must be
      protected by physical access controls (card access, biometrics, mantrap
      vestibules), environmental monitoring (temperature, humidity, power continuity),
      and surveillance systems. Access to sensitive areas must be restricted to
      authorised personnel, logged electronically, and reviewed periodically.
      Visitors must be accompanied by an authorised escort and their access
      logged. Physical security controls must be tested and reviewed at least
      annually. At Level 3 (Defined), physical security standards are documented
      and consistently applied across all locations.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_09-physical-environmental-security.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Physical security subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.7.1
      - ISO_27001_A.7.2
      - NIST_CSF_PR_AA
    remediation: >-
      Implement tiered physical access zones with electronic access logs for all
      data centre areas. Deploy CCTV with minimum 90-day retention. Establish a
      visitor management procedure. Review access logs monthly and revoke access
      for departed personnel within one business day. Conduct an annual physical
      security assessment by an independent party.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_10
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Secure Application Development and Change Management"
    description: >-
      Secure Software Development Lifecycle (SSDLC) practices must be applied to
      all in-house and bespoke third-party developed applications, including security
      requirements analysis, threat modelling, secure coding standards, and security
      testing (SAST, DAST, and penetration testing before production deployment).
      Changes to production systems must follow a formal change management process
      with documented risk assessment, testing, approval, and rollback procedures.
      Emergency changes must be subject to retrospective review. At Level 3 (Defined),
      SSDLC standards and change management procedures are documented and consistently
      applied.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_10-application-security-change-management.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Application security subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.8.25
      - ISO_27001_A.8.32
      - NIST_CSF_PR_PS
      - PCI_DSS_6.2
    remediation: >-
      Publish an SSDLC policy mandating threat modelling at design phase, SAST
      integration in CI/CD pipelines, and mandatory penetration testing before
      each major release. Implement a Change Advisory Board (CAB) process with
      defined risk tiers and approval tracks. Document and test rollback procedures
      for all critical system changes.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_11
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Email and Endpoint Security"
    description: >-
      All endpoints (workstations, laptops, and mobile devices) must be protected
      by endpoint security controls including anti-malware, host-based firewalls,
      full-disk encryption, automated patch deployment, and mobile device management
      (MDM) for corporate and BYOD devices accessing corporate systems. Email
      security controls must include anti-spam, anti-phishing (SPF, DKIM, DMARC),
      URL rewriting, and attachment sandboxing. At Level 3 (Defined), endpoint and
      email security standards are documented, consistently applied across the
      organisation, and compliance is measured and reported.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_11-email-endpoint-security.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Endpoint and communication security subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_DEF
      - ISO_27001_A.8.7
      - ISO_27001_A.8.19
      - NIST_CSF_PR_PS
    remediation: >-
      Deploy an EDR solution on all managed endpoints and enforce full-disk
      encryption. Implement MDM with the ability to remote-wipe lost or stolen
      devices. Configure DMARC with a policy of at least p=quarantine on all
      email domains. Enable anti-phishing URL rewriting and attachment sandboxing
      on the email gateway. Track endpoint compliance percentage via the MDM console.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_OPS_12
    pillar: "Domain 3 -- Cybersecurity Operations"
    title: "Cybersecurity Awareness and Training Programme"
    description: >-
      A formal cybersecurity awareness and training programme must be implemented
      covering all employees and relevant third parties with access to the entity's
      systems. Training must be role-specific, delivered at onboarding and at least
      annually thereafter, and cover phishing, social engineering, password hygiene,
      data handling responsibilities, and relevant regulatory obligations under
      SAMA requirements. At Level 3 (Defined), the programme follows a documented
      curriculum, completion rates are tracked, and programme effectiveness is
      measured (e.g., via simulated phishing campaigns) and reported to management.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_OPS_12-awareness-training-programme.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 3, Cybersecurity Operations -- Awareness and training subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_GOV
      - ISO_27001_A.6.3
      - NIST_CSF_PR_AT
      - SOC_2_CC2.2
    remediation: >-
      Implement an LMS-based cybersecurity training platform with role-based
      curricula. Mandate completion at onboarding and annually. Run monthly
      simulated phishing campaigns and track click-through rates over time.
      Report training completion rates and phishing results to the CISO quarterly.
      Target a phishing susceptibility rate below 5% at Level 3.
    tags:
      - "domain.operations"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  # ======================================================================
  # Domain 4 -- Third-Party Cybersecurity (SAMA_CSF_3P)
  # 20 controls in the full framework; modelled here as 4 domain-area controls.
  # Key topics: outsourcing governance, cloud computing (section 3.4.3),
  # supply chain security, vendor due diligence.
  # ======================================================================
  - id: SAMA_CSF_3P_01
    pillar: "Domain 4 -- Third-Party Cybersecurity"
    title: "Third-Party and Outsourcing Cyber Security Governance"
    description: >-
      A formal third-party and outsourcing cybersecurity governance programme must
      be in place. All outsourcing arrangements involving access to or processing
      of the entity's information assets must be subject to a pre-engagement
      cybersecurity due diligence assessment, contractual cybersecurity requirements
      (including right-to-audit, incident notification SLAs, and data handling
      obligations), and ongoing performance monitoring. SAMA outsourcing governance
      requirements -- including prior notification to SAMA for material outsourcing
      arrangements -- must be observed. At Level 3 (Defined), the third-party
      governance process is standardised and applied consistently.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_3P_01-third-party-outsourcing-governance.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 4, Third-Party Cybersecurity -- Outsourcing governance subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_TPC
      - ISO_27001_A.5.19
      - ISO_27001_A.5.20
      - NIST_CSF_GV_06
      - COBIT_5_APO_10
    remediation: >-
      Establish a third-party cybersecurity register classifying all suppliers by
      risk tier. Require Tier 1 (critical) suppliers to provide evidence of ISO 27001
      certification or equivalent annually. Include mandatory cybersecurity clauses
      in all contracts -- right-to-audit, incident notification within 24 hours, and
      data handling obligations. Notify SAMA before entering into any material
      outsourcing arrangement as required by SAMA guidelines.
    tags:
      - "domain.third-party"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_3P_02
    pillar: "Domain 4 -- Third-Party Cybersecurity"
    title: "Cloud Computing Adoption Policy and Due Diligence"
    description: >-
      The entity must establish a cloud computing policy defining approved cloud
      models (public, private, hybrid), the data classification tiers permitted
      in each model, and the mandatory adoption process. Any use of external (public
      or hybrid) cloud services -- including SaaS, IaaS, and PaaS -- requires a
      risk assessment, due diligence of the Cloud Service Provider's security posture
      and CST licensing class, and explicit SAMA approval before adoption. SAMA
      approval must be obtained in advance of migrating any regulated data to cloud
      services. This requirement applies to public and hybrid cloud; private internal
      cloud is out of scope for section 3.4.3.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_3P_02-cloud-adoption-policy-due-diligence.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 4, Third-Party Cybersecurity -- Cloud computing adoption (section 3.4.3)"
    overrides: []
    maps_to:
      - NCA_ECC_TPC
      - NCA_CCC_CST
      - ISO_27001_A.5.19
      - ISO_27001_A.5.23
      - NIST_CSF_PR_AA
    remediation: >-
      Draft a cloud adoption policy and submit it to SAMA for acknowledgement.
      Define a cloud intake process requiring SAMA approval before any external
      cloud service is commissioned for regulated workloads. Include CSP due
      diligence criteria: certification status (ISO 27001, SOC 2), CST licensing
      class, KSA data residency capability, and audit rights. Maintain a register
      of all approved cloud services with their approval status and review dates.
    tags:
      - "domain.third-party"
      - "applies-to.ksa-financial"
      - "applies-to.cloud-services"
      - "framework.maturity-model"

  - id: SAMA_CSF_3P_03
    pillar: "Domain 4 -- Third-Party Cybersecurity"
    title: "Cloud Data Residency and SAMA Notification Requirements"
    description: >-
      Data residency for regulated financial data must be carefully managed in
      cloud environments. SAMA strongly prefers KSA data localisation for regulated
      data; storage of regulated financial data outside the Kingdom of Saudi Arabia
      requires separate, explicit SAMA approval. The entity must maintain an
      up-to-date inventory of where regulated data resides within cloud environments,
      implement logical segregation to isolate the entity's data within the CSP
      environment at all times, and ensure the CSP contractually supports SAMA's
      right to audit and examine. CSP contracts must include prohibition on secondary
      use of the entity's data, contractual data return SLAs, and guaranteed
      irreversible deletion on termination.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_3P_03-cloud-data-residency-notification.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 4, Third-Party Cybersecurity -- Cloud data location and controls (section 3.4.3)"
    overrides: []
    maps_to:
      - NCA_ECC_TPC
      - NCA_CCC_CST
      - ISO_27001_A.5.23
      - PCI_DSS_12.8
      - NIST_CSF_PR_DS
    remediation: >-
      Map all regulated data flows to their cloud storage regions. For data stored
      outside KSA, obtain and document SAMA approval. Implement logical network
      segregation and access controls within the cloud tenancy to isolate regulated
      data. Verify CSP contracts include: prohibition on secondary use, minimum 30-day
      data export window on termination, and irreversible deletion certificates.
      Test the data return SLA annually.
    tags:
      - "domain.third-party"
      - "applies-to.ksa-financial"
      - "applies-to.cloud-services"
      - "framework.maturity-model"

  - id: SAMA_CSF_3P_04
    pillar: "Domain 4 -- Third-Party Cybersecurity"
    title: "Supply Chain and Technology Provider Security"
    description: >-
      Technology providers and supply chain partners must be subject to cybersecurity
      due diligence covering software integrity, vulnerability disclosure practices,
      and incident notification obligations. Hardware and software components from
      high-risk or unverified origins must be assessed and approved before deployment
      in production environments. The entity must maintain visibility of its critical
      technology dependencies and the cybersecurity posture of key suppliers. At
      Level 3 (Defined), supply chain security requirements are documented, applied
      consistently, and reviewed at least annually.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_3P_04-supply-chain-provider-security.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 4, Third-Party Cybersecurity -- Supply chain security subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_TPC
      - ISO_27001_A.5.21
      - ISO_27001_A.5.22
      - NIST_CSF_ID_SC
      - COBIT_5_APO_10
    remediation: >-
      Produce a critical technology dependency map identifying single points of
      failure in the supply chain. Require software vendors to provide a Software
      Bill of Materials (SBOM) for critical applications. Implement a process to
      assess hardware components from high-risk origins before procurement. Include
      vulnerability disclosure and notification obligations in technology provider
      contracts.
    tags:
      - "domain.third-party"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  # ======================================================================
  # Domain 5 -- Cyber Resilience (SAMA_CSF_RES)
  # 14 controls in the full framework; modelled here as 4 domain-area controls.
  # Key topics: BCM and cyber integration, DR planning and testing, crisis
  # management and communication, incident recovery and lessons learned.
  # ======================================================================
  - id: SAMA_CSF_RES_01
    pillar: "Domain 5 -- Cyber Resilience"
    title: "Business Continuity Management and Cyber Integration"
    description: >-
      A Business Continuity Management (BCM) programme must be implemented that
      explicitly integrates cyber risks and cyber incident scenarios alongside
      operational and physical disruption scenarios. BCM plans must define Recovery
      Time Objectives (RTOs) and Recovery Point Objectives (RPOs) for all critical
      systems and services. Business Impact Analysis (BIA) must be updated at least
      annually. BCM plans must cover cloud services and third-party dependencies.
      At Level 3 (Defined), BCM follows a documented organisation-wide standard
      and plans are tested at defined intervals through tabletop exercises,
      simulations, or full failover tests.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RES_01-business-continuity-management.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 5, Cyber Resilience -- Business continuity management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_RES_01
      - ISO_27001_A.5.29
      - ISO_27001_A.5.30
      - NIST_CSF_PR_IP
      - COBIT_5_DSS_04
    remediation: >-
      Update the BIA to include cyber incident scenarios (ransomware, prolonged
      outage, data breach) and derive RTOs/RPOs for each critical service. Verify
      that BCM plans cover cloud service failures and third-party outages. Test
      BCM plans annually through at least a structured tabletop exercise. Ensure
      BCM plans for cloud services align with the cloud provider's DR capabilities
      per SAMA section 3.4.3 requirements.
    tags:
      - "domain.resilience"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RES_02
    pillar: "Domain 5 -- Cyber Resilience"
    title: "Disaster Recovery Planning and Testing"
    description: >-
      A Disaster Recovery (DR) plan must be developed, documented, and maintained
      for all critical systems and data. DR plans must define recovery procedures,
      responsible roles, RTOs and RPOs aligned with the BCM programme, and
      technical runbooks for each critical system. DR data replication and backup
      integrity must be verified regularly. DR testing must be conducted at least
      annually using realistic scenarios; test results and identified gaps must
      be documented and remediated within defined timelines. At Level 3 (Defined),
      DR follows a standardised methodology and test results are reported to senior
      management.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RES_02-disaster-recovery-planning.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 5, Cyber Resilience -- Disaster recovery subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_RES_01
      - ISO_27001_A.8.13
      - ISO_27001_A.5.29
      - NIST_CSF_RC_RP
      - COBIT_5_DSS_04
    remediation: >-
      Produce DR runbooks for each critical system covering step-by-step recovery
      procedures, required tooling, and responsible roles. Test backup integrity
      monthly through restoration validation. Conduct a full DR test annually,
      targeting actual RTOs/RPOs. Document gaps and track remediation to closure.
      Report DR test results and any RTO/RPO breaches to the board.
    tags:
      - "domain.resilience"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RES_03
    pillar: "Domain 5 -- Cyber Resilience"
    title: "Crisis Management and Communication"
    description: >-
      A crisis management plan must govern the response to major cyber incidents,
      including escalation to the CISO, senior management, and the board; coordination
      with SAMA and other regulators; and external communications to media, customers,
      and counterparties. Crisis communication procedures must define who is authorised
      to communicate externally, what information may be disclosed, and the approval
      process for public statements. At Level 3 (Defined), the crisis management plan
      is documented, tested at least annually through tabletop exercises or simulations,
      and roles are assigned to named individuals with deputies.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RES_03-crisis-management-communication.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 5, Cyber Resilience -- Crisis management subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_RES_01
      - ISO_27001_A.5.29
      - ISO_27001_A.5.24
      - NIST_CSF_RS_CO
      - COBIT_5_DSS_04
    remediation: >-
      Develop a crisis management playbook with a contact tree for the CISO, board,
      SAMA regulatory liaison, legal counsel, and external PR. Define pre-approved
      communication templates for common scenarios (data breach, ransomware, service
      outage). Test the plan annually through a crisis simulation. Verify that the
      SAMA regulatory notification process is clearly documented and tested.
    tags:
      - "domain.resilience"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"

  - id: SAMA_CSF_RES_04
    pillar: "Domain 5 -- Cyber Resilience"
    title: "Cyber Incident Recovery and Lessons Learned"
    description: >-
      Following a significant cyber incident, the entity must execute a structured
      recovery process that restores systems and services in accordance with defined
      RTOs and RPOs. Post-incident reviews must identify root causes (using structured
      techniques such as five-whys or fishbone analysis), assess the effectiveness of
      the incident response, and produce prioritised improvement actions. Lessons
      learned must be fed back into security controls, incident playbooks, BCM plans,
      and cybersecurity awareness training. At Level 3 (Defined), the post-incident
      review process is standardised and improvement actions are tracked to closure
      with defined deadlines.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/SAMA_CSF_RES_04-incident-recovery-lessons-learned.md" }
    references:
      - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
      - "SAMA CSF v1.0 Domain 5, Cyber Resilience -- Incident recovery and improvement subdomain"
    overrides: []
    maps_to:
      - NCA_ECC_RES_01
      - ISO_27001_A.5.27
      - ISO_27001_A.5.24
      - NIST_CSF_RC_IM
      - COBIT_5_BAI_06
    remediation: >-
      Implement a mandatory post-incident review process triggered for all P1 and P2
      incidents within 5 business days of closure. Use a standard template covering
      timeline, root cause, contributing factors, response effectiveness, and action
      items. Track improvement actions in the risk register. Report incident trends
      and lessons learned to the CISO quarterly and to the board annually.
    tags:
      - "domain.resilience"
      - "applies-to.ksa-financial"
      - "framework.maturity-model"
