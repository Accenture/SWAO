# SWAO community framework controls -- NCA_ECC
# Hand-authored from the NCA ECC-2:2024 PDF (TLP:White, Document Classification: Public).
# Source artefact: docs/custom-frameworks/nca-ecc-2-2024/research-notes.md
# Issue: #1133
#
# 28 controls, one per subdomain across four domains:
#   Domain 1 -- Cybersecurity Governance (10 subdomains)
#   Domain 2 -- Cybersecurity Defense    (15 subdomains)
#   Domain 3 -- Cybersecurity Resilience  (1 subdomain)
#   Domain 4 -- Third-Party and Cloud Computing Cybersecurity (2 subdomains)
#
# Automated signal prefixes:
#   IAM   -> NCA_ECC_DEF_02 (Identity and Access Management)
#   CRYPTO -> NCA_ECC_DEF_08 (Cryptography)
#   INFRA  -> NCA_ECC_DEF_09 (Backup and Recovery Management)
#   OBS    -> NCA_ECC_DEF_12 (Cybersecurity Event Logs and Monitoring Management)
# All other controls use context_input evidence files.

regime_meta:
  id: NCA_ECC
  name: "Essential Cybersecurity Controls (ECC-2:2024)"
  version: "ECC-2:2024 -- issued 2024"
  scope: community
  authority: "National Cybersecurity Authority (NCA), Kingdom of Saudi Arabia"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
  applicability_hints:
    - ksa_regulated_entity
    - cloud_workload
    - government_systems
    - critical_infrastructure
    - financial_services
  signal_prefix: NCA_ECC
  last_reviewed: "2026-07-18"
  catalogue_version: "1.0.0"

controls:
  # ======================================================================
  # Domain 1 -- Cybersecurity Governance (10 controls)
  # ======================================================================
  - id: NCA_ECC_GOV_01
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Strategy"
    description: >-
      The entity shall identify, document, and approve a cybersecurity strategy
      supported by the Authorized Official. Strategy goals shall align with relevant
      legislative and regulatory requirements. The entity shall execute an action plan
      to apply the strategy, and review the strategy at planned intervals or when
      relevant legislative and regulatory requirements change.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/gov-01-cybersecurity-strategy.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-1"
    overrides: []
    maps_to: [ISO_27001_A.5.1, NIST_CSF_GV.OC-01]
    remediation: >-
      Draft and obtain Authorized Official approval for a written cybersecurity strategy
      document; establish an action plan with assigned owners and timescales; schedule
      annual review and trigger review on relevant regulatory change.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_02
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Management"
    description: >-
      A cybersecurity department shall be established within the entity, independent
      from the Information Technology and Communications Department (per High Order
      No. 37140). All cybersecurity positions shall be filled with full-time qualified
      Saudi cybersecurity professionals. A cybersecurity supervisory committee shall
      be established pursuant to the Authorized Official, with membership,
      responsibilities, and governance framework identified, documented, and approved.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-02-cybersecurity-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-2"
    overrides: []
    maps_to: [ISO_27001_A.5.2, ISO_27001_A.5.37, NIST_CSF_GV.RR-01]
    remediation: >-
      Establish a formally chartered cybersecurity department reporting independently
      of IT; fill all cybersecurity roles with full-time qualified Saudi professionals;
      constitute the supervisory committee with a written terms of reference approved
      by the Authorized Official.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_03
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Policies and Procedures"
    description: >-
      The cybersecurity department shall identify, document, and have approved by the
      Authorized Official all cybersecurity policies and procedures, including
      cybersecurity controls and requirements, and communicate them to relevant
      personnel. Policies and procedures shall be supported by technical security
      standards for systems such as firewalls, databases, and operating systems, and
      reviewed at planned intervals or when relevant requirements change.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-03-cybersecurity-policies-and-procedures.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-3"
    overrides: []
    maps_to: [ISO_27001_A.5.1, ISO_27001_A.5.36, NIST_CSF_GV.PO-01]
    remediation: >-
      Compile a policy library covering all ECC-2:2024 domains; obtain Authorized
      Official approval; distribute via formal communication; pair each policy with a
      supporting technical security standard; schedule annual review.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_04
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Roles and Responsibilities"
    description: >-
      The Authorized Official shall identify, document, and approve the governance
      organisational structure, cybersecurity roles, and responsibilities within the
      entity, and assign the responsible persons. Necessary support shall be provided
      for implementation. Cybersecurity roles and responsibilities shall be reviewed
      and updated at planned intervals or when relevant requirements change.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-04-cybersecurity-roles-and-responsibilities.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-4"
    overrides: []
    maps_to: [ISO_27001_A.5.2, NIST_CSF_GV.RR-02]
    remediation: >-
      Publish an approved RACI matrix for all cybersecurity controls; assign named
      owners to each role; review on any relevant organisational or regulatory change;
      ensure no conflict-of-interest in the assignment structure.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_05
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Risk Management"
    description: >-
      The cybersecurity department shall identify, document, and approve a
      cybersecurity risk management methodology and procedures, based on
      considerations of confidentiality, integrity, and availability of information
      and technology assets. Risk assessment shall be conducted at the early stage of
      technology projects, before major infrastructure changes, during planning for
      third-party services, and before releasing new technology services and products.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-05-cybersecurity-risk-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-5"
    overrides: []
    maps_to: [ISO_27001_A.5.7, NIST_CSF_GV.RM-01, NIST_CSF_ID.RA-01]
    remediation: >-
      Adopt a documented risk management methodology (e.g. ISO 31000 or NCA-recommended
      approach); conduct formal risk assessments at each of the four trigger events;
      maintain a risk register with ownership, residual risk scoring, and treatment plans.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_06
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity in Information and Technology Project Management"
    description: >-
      Cybersecurity requirements shall be included in the entity's project management
      methodology and in information and technology asset change management. Minimum
      requirements for projects include vulnerability assessment and remediation, and
      review of secure configuration before launch. Minimum requirements for software
      and application development include secure coding standards, use of trusted
      licensed sources for development tools and libraries, compliance testing, secure
      application integration, and secure configuration review before launch.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-06-cybersecurity-in-it-project-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-6"
    overrides: []
    maps_to: [ISO_27001_A.5.8, ISO_27001_A.8.25, NIST_CSF_PR.PS-01]
    remediation: >-
      Embed cybersecurity checkpoints in the project management lifecycle gate process;
      mandate vulnerability assessment and hardening review in every project sign-off
      checklist; enforce a secure-coding standard in all development projects.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_07
    pillar: "Cybersecurity Governance"
    title: "Compliance with Cybersecurity Standards, Laws and Regulations"
    description: >-
      If there are nationally approved international agreements or commitments that
      include cybersecurity requirements, the entity shall identify and comply with
      those requirements.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/gov-07-compliance-with-cybersecurity-standards.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-7"
    overrides: []
    maps_to: [ISO_27001_A.5.31, ISO_27001_A.5.36, NIST_CSF_GV.OC-03]
    remediation: >-
      Maintain a register of nationally approved international agreements and
      commitments with cybersecurity implications; map each obligation to internal
      controls; review the register at planned intervals.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_08
    pillar: "Cybersecurity Governance"
    title: "Periodical Cybersecurity Review and Audit"
    description: >-
      The cybersecurity department shall periodically review the implementation of
      cybersecurity controls. An independent review and audit shall be conducted by
      parties other than the cybersecurity department, applying Generally Accepted
      Auditing Standards (GAAS) and relevant legislative and regulatory requirements.
      Results shall be documented and presented to the cybersecurity supervisory
      committee and the Authorized Official, including audit scope, observations,
      recommendations, corrective actions, and remediation plans.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-08-periodical-cybersecurity-review-and-audit.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-8"
    overrides: []
    maps_to: [ISO_27001_A.5.35, NIST_CSF_GV.OV-01]
    remediation: >-
      Schedule annual internal reviews of all ECC-2:2024 controls by the cybersecurity
      department; commission at least one independent audit per review cycle by a
      qualified third party; track all findings in a remediation register with owners
      and target dates; present results to the supervisory committee.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_09
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity in Human Resources"
    description: >-
      Cybersecurity requirements for personnel (employees and contractors) shall be
      identified, documented, and approved for periods prior to, during, and upon end
      or termination of employment. Pre-employment requirements include non-disclosure
      clauses in contracts and screening or vetting for cybersecurity and privileged
      positions. Access rights and powers shall be revoked immediately upon end or
      termination of employment. Cybersecurity requirements for human resources shall
      be periodically reviewed.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/gov-09-cybersecurity-in-human-resources.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-9"
    overrides: []
    maps_to: [ISO_27001_A.6.1, ISO_27001_A.6.5, NIST_CSF_PR.AT-02]
    remediation: >-
      Embed non-disclosure and cybersecurity responsibility clauses in all employment
      contracts; implement a vetting process for privileged and cybersecurity roles;
      enforce immediate access revocation upon departure; run onboarding and in-service
      cybersecurity awareness for all personnel.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_GOV_10
    pillar: "Cybersecurity Governance"
    title: "Cybersecurity Awareness and Training Program"
    description: >-
      A cybersecurity awareness program, delivered through multiple channels, shall be
      periodically developed and approved by the entity. The program shall cover secure
      handling of email services (particularly phishing), mobile devices and storage
      media, internet browsing, and social media. Specialised skills and training shall
      be provided to cybersecurity department personnel, software and application
      development staff, and executive and supervisory positions.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/gov-10-cybersecurity-awareness-and-training.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 1-10"
    overrides: []
    maps_to: [ISO_27001_A.6.3, NIST_CSF_PR.AT-01]
    remediation: >-
      Develop an annual awareness programme covering the four mandated topics; deliver
      via multiple channels; maintain attendance records; provide role-specific training
      for cybersecurity staff, developers, and executives; review effectiveness annually.
    tags:
      - "domain.governance"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  # ======================================================================
  # Domain 2 -- Cybersecurity Defense (15 controls)
  # ======================================================================
  - id: NCA_ECC_DEF_01
    pillar: "Cybersecurity Defense"
    title: "Asset Management"
    description: >-
      Cybersecurity requirements for managing the entity's information and technology
      assets shall be identified, documented, and approved. An acceptable use policy
      for information and technology assets shall be identified, documented, approved,
      and communicated. Information and technology assets shall be classified, labelled,
      and handled in accordance with relevant legislative and regulatory requirements.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-01-asset-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-1"
    overrides: []
    maps_to: [ISO_27001_A.5.9, ISO_27001_A.5.10, ISO_27001_A.5.12, ISO_27001_A.5.13, NIST_CSF_ID.AM-01]
    remediation: >-
      Maintain a current asset inventory covering all information and technology assets;
      publish and communicate an acceptable use policy; apply classification and labelling
      in accordance with the entity's data classification scheme; review the inventory
      and policy periodically.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_DEF_02
    pillar: "Cybersecurity Defense"
    title: "Identity and Access Management"
    description: >-
      Cybersecurity requirements for identity and access management shall be identified,
      documented, and approved. Requirements shall include single-factor authentication
      (username and password), multi-factor authentication for remote access and
      privileged accounts with authentication factors and techniques defined by impact
      assessment of authentication failure, user authorisation based on need-to-know,
      least privilege, and segregation of duties principles, privileged access
      management, and periodic review of identities and access rights.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: IAM }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-2"
    overrides: []
    maps_to: [ISO_27001_A.5.15, ISO_27001_A.5.16, ISO_27001_A.5.17, ISO_27001_A.5.18, NIST_CSF_PR.AA-01]
    remediation: >-
      Deploy MFA for all remote access and privileged accounts; enforce least-privilege
      and segregation-of-duties in access provisioning; implement a privileged access
      management (PAM) solution; conduct quarterly reviews of all identities and access
      rights; remove or disable orphaned accounts promptly.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.automated"

  - id: NCA_ECC_DEF_03
    pillar: "Cybersecurity Defense"
    title: "Information System and Processing Facilities Protection"
    description: >-
      Cybersecurity requirements for protection of information systems and processing
      facilities shall be identified, documented, and approved. Requirements shall
      include protection against viruses, suspicious programs, and malware on
      workstations and servers using modern and advanced protection technologies,
      strict restriction on use of external storage media, patch management for
      systems, applications, and devices, and centralised clock synchronisation with
      an accurate and trusted source such as the Saudi Standards, Metrology and
      Quality Organization (SASO).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-03-information-systems-protection.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-3"
    overrides: []
    maps_to: [ISO_27001_A.8.7, ISO_27001_A.8.8, ISO_27001_A.8.9, NIST_CSF_PR.PS-01]
    remediation: >-
      Deploy endpoint protection (anti-malware, EDR) on all workstations and servers;
      enforce USB and external media restrictions via technical policy; maintain a patch
      management process with defined SLAs by severity; configure centralised NTP
      synchronisation to a SASO-approved source.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_04
    pillar: "Cybersecurity Defense"
    title: "Email Protection"
    description: >-
      Cybersecurity requirements for protection of the entity's email service shall be
      identified, documented, and approved. Requirements shall include filtering of
      phishing and spam email using advanced email protection techniques, multi-factor
      authentication for remote and webmail access with authentication factors defined
      by impact assessment, email archiving and backup, protection against Advanced
      Persistent Threats (APT), and validation of the entity's email domains using
      Sender Policy Framework (SPF), DomainKeys Identified Mail (DKIM), and Domain
      Message Authentication Reporting and Conformance (DMARC).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-04-email-protection.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-4"
    overrides: []
    maps_to: [ISO_27001_A.5.14, ISO_27001_A.8.23, NIST_CSF_PR.PS-02]
    remediation: >-
      Enable advanced email filtering with phishing and spam detection; enforce MFA on
      all webmail and remote email access; configure SPF, DKIM, and DMARC records;
      enable email archiving with a defined retention period; deploy APT-capable
      sandboxing for inbound email attachments.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_05
    pillar: "Cybersecurity Defense"
    title: "Networks Security Management"
    description: >-
      Cybersecurity requirements for the entity's network security management shall be
      identified, documented, and approved. Requirements shall include logical or
      physical isolation and segmentation of network segments using firewall and
      defense-in-depth, isolation of production networks from testing and development
      environments, secure internet browsing with restrictions on suspicious and
      file-sharing websites, wireless network security using secure authentication and
      encryption, restricting and managing network services, protocols, and ports,
      Intrusion Prevention Systems (IPS), DNS security, APT protection, and DDoS
      attack mitigation.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-05-networks-security-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-5"
    overrides: []
    maps_to: [ISO_27001_A.8.20, ISO_27001_A.8.21, ISO_27001_A.8.22, NIST_CSF_PR.IR-01]
    remediation: >-
      Implement network segmentation with firewall-enforced zones; isolate
      production from non-production; deploy IPS and DNS filtering; configure web
      proxy with URL categorisation; enable DDoS mitigation; ensure wireless networks
      use WPA3 or equivalent and are isolated from internal networks by default.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_06
    pillar: "Cybersecurity Defense"
    title: "Mobile Devices Security"
    description: >-
      Cybersecurity requirements for mobile devices and BYOD security when connected
      to the entity's network shall be identified, documented, and approved. Requirements
      shall include separation and encryption of entity data stored on mobile devices
      and BYODs, controlled and restricted use based on the entity's business
      requirements, and deletion of entity data from mobile devices and BYODs in cases
      of device loss or upon end or termination of employment.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/def-06-mobile-devices-security.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-6"
    overrides: []
    maps_to: [ISO_27001_A.8.1, NIST_CSF_PR.AA-05]
    remediation: >-
      Enrol all entity-managed and BYOD mobile devices in an MDM solution; enforce
      encryption of entity data containers; configure remote wipe capability; publish
      and communicate the BYOD acceptable use policy; test remote wipe on departure.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_07
    pillar: "Cybersecurity Defense"
    title: "Data and Information Protection"
    description: >-
      Cybersecurity requirements for protecting and handling the entity's data and
      information shall be identified, documented, and approved in accordance with
      relevant legislative and regulatory requirements. Requirements shall be
      implemented based on the data classification level to ensure confidentiality,
      integrity, accuracy, and availability of the entity's data and information.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-07-data-and-information-protection.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-7"
    overrides: []
    maps_to: [ISO_27001_A.5.12, ISO_27001_A.8.10, ISO_27001_A.8.11, NIST_CSF_PR.DS-01]
    cross_mapping:
      - target_framework: GDPR
        target_control: GDPR_Art_5_1_f
        relationship: related
    remediation: >-
      Define and publish a data classification scheme; apply classification labels at
      point of creation; enforce access controls, handling procedures, and encryption
      requirements per classification tier; review compliance with classification
      requirements through periodic audits.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_DEF_08
    pillar: "Cybersecurity Defense"
    title: "Cryptography"
    description: >-
      Cybersecurity requirements for cryptography within the entity shall be identified,
      documented, and approved. Requirements shall include at least those specified in
      the NCA National Cryptographic Standards, with the appropriate cryptographic
      standard level determined by the nature and sensitivity of data, systems, and
      networks, and by risk assessment. Specific requirements include approved
      cryptographic systems and solutions, secure management of cryptographic keys
      throughout their lifecycles, and encryption of data in-transit and at-rest based
      on their classification level and relevant legislative requirements.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-8"
      - "NCA National Cryptographic Standards"
    overrides: []
    maps_to: [ISO_27001_A.8.24, NIST_CSF_PR.DS-01, NIST_CSF_PR.DS-02]
    cross_mapping:
      - target_framework: GDPR
        target_control: GDPR_Art_32_a
        relationship: related
    remediation: >-
      Adopt NCA National Cryptographic Standards as the baseline; enforce TLS 1.2 or
      higher for data in transit; encrypt data at rest classified at or above the
      entity's defined sensitivity threshold; implement a key management procedure
      covering generation, storage, rotation, and destruction of cryptographic keys.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.automated"

  - id: NCA_ECC_DEF_09
    pillar: "Cybersecurity Defense"
    title: "Backup and Recovery Management"
    description: >-
      Cybersecurity requirements for backup and recovery management within the entity
      shall be identified, documented, and approved. Requirements shall include backup
      scope covering critical technology and information assets, capability to perform
      quick recovery of data and systems after cybersecurity incidents, and periodic
      testing of the effectiveness of backup and recovery procedures.
    severity_default: high
    evidence_basis:
      - { signal_prefix: INFRA }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-9"
    overrides: []
    maps_to: [ISO_27001_A.8.13, NIST_CSF_PR.DS-04]
    remediation: >-
      Define backup scope based on the asset inventory, covering all critical assets;
      configure automated backups to an off-site or air-gapped location; define and
      test recovery time objectives (RTO) and recovery point objectives (RPO);
      conduct at least one full restoration test per year; document test results.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.automated"

  - id: NCA_ECC_DEF_10
    pillar: "Cybersecurity Defense"
    title: "Vulnerabilities Management"
    description: >-
      Cybersecurity requirements for technical vulnerabilities management within the
      entity shall be identified, documented, and approved. Requirements shall include
      periodic vulnerability assessment and detection, vulnerability classification by
      severity, remediation based on severity classification and associated cyber risks,
      patch management with integrity verification in a non-production environment
      before deployment, and subscription to trusted resources for new and current
      vulnerability information.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-10-vulnerability-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-10"
    overrides: []
    maps_to: [ISO_27001_A.8.8, ISO_27001_A.8.19, NIST_CSF_ID.RA-01]
    remediation: >-
      Run authenticated vulnerability scans against all in-scope systems on a defined
      schedule; classify findings by CVSS severity; enforce remediation SLAs by
      severity band; test all patches in a non-production environment before production
      deployment; subscribe to NCA and vendor vulnerability feeds.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_11
    pillar: "Cybersecurity Defense"
    title: "Penetration Testing"
    description: >-
      Cybersecurity requirements for penetration testing within the entity shall be
      identified, documented, and approved. The scope of penetration testing shall
      include all externally provided services (via the Internet) and their technical
      components, including infrastructure, websites, web applications, smartphone and
      tablet applications, email, and remote access. Penetration tests shall be
      conducted periodically.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-11-penetration-testing.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-11"
    overrides: []
    maps_to: [ISO_27001_A.5.35, ISO_27001_A.8.8, NIST_CSF_ID.RA-05]
    remediation: >-
      Conduct at least one full-scope penetration test per year covering all
      externally facing services; use a qualified third-party testing provider; track
      all findings in the vulnerability register; re-test critical findings after
      remediation; maintain test reports for audit evidence.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_12
    pillar: "Cybersecurity Defense"
    title: "Cybersecurity Event Logs and Monitoring Management"
    description: >-
      Cybersecurity requirements for event logs and monitoring management within the
      entity shall be identified, documented, and approved. Requirements shall include
      activation of cybersecurity event logs for critical information assets,
      activation of event logs for critical and privileged accounts and remote access
      events, implementation of Security Information and Event Management (SIEM)
      techniques for log collection, continuous monitoring of cybersecurity event logs,
      and retention of event logs for at least 12 months.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-12"
    overrides: []
    maps_to: [ISO_27001_A.8.15, ISO_27001_A.8.16, NIST_CSF_DE.CM-01]
    remediation: >-
      Enable logging on all critical assets, privileged accounts, and remote access
      gateways; centralise log collection into a SIEM; configure continuous monitoring
      with defined alert thresholds; verify log retention is set to at least 12 months;
      test log completeness quarterly.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.automated"

  - id: NCA_ECC_DEF_13
    pillar: "Cybersecurity Defense"
    title: "Cybersecurity Incident and Threat Management"
    description: >-
      Requirements for cybersecurity incident and threat management within the entity
      shall be identified, documented, and approved (per High Order No. 37140, dated
      14/08/1438H.). Requirements shall include incident response plans and escalation
      procedures, incident classification, mandatory reporting of cybersecurity
      incidents to the NCA, sharing of incident notifications, threat intelligence,
      penetration indicators, and incident reports with the NCA, and collecting and
      handling threat intelligence feeds.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/def-13-cybersecurity-incident-and-threat-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-13"
    overrides: []
    maps_to: [ISO_27001_A.5.24, ISO_27001_A.5.26, ISO_27001_A.5.27, NIST_CSF_RS.MA-01]
    remediation: >-
      Document and test an incident response plan with defined roles and escalation
      paths; establish a classification scheme for cybersecurity incidents; register
      with the NCA incident reporting portal; set up a process for sharing threat
      intelligence and incident notifications with the NCA; subscribe to threat
      intelligence feeds from trusted sources.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_DEF_14
    pillar: "Cybersecurity Defense"
    title: "Physical Security"
    description: >-
      Cybersecurity requirements for protection of information and technology assets
      against unauthorised physical access, loss, theft, and damage shall be identified,
      documented, and approved. Requirements shall include authorised access to critical
      areas such as data centres and disaster recovery centres, access and monitoring
      logs including CCTV, protection of access and monitoring log information, secure
      destruction and re-use of physical assets holding classified information including
      paper documents and storage media, and security of devices inside and outside the
      entity's facilities.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-14-physical-security.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-14"
    overrides: []
    maps_to: [ISO_27001_A.7.1, ISO_27001_A.7.2, ISO_27001_A.7.4, NIST_CSF_PR.AA-03]
    remediation: >-
      Implement physical access control (badge or biometric) to all critical areas;
      enable CCTV with recording retained per defined retention period; protect CCTV
      and access logs from tampering; enforce secure media destruction procedures using
      an approved shredding or degaussing method; track all devices leaving facilities.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  - id: NCA_ECC_DEF_15
    pillar: "Cybersecurity Defense"
    title: "Web Application Security"
    description: >-
      Cybersecurity requirements for protection of external web applications of the
      entity shall be identified, documented, and approved. Requirements shall include
      use of a web application firewall, adoption of the multi-tier architecture
      principle, use of secure protocols such as HTTPS, a clear secure usage policy
      for users, and user authentication with authentication factors and techniques
      defined based on an impact assessment of authentication failure and bypass for
      user access.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/def-15-web-application-security.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 2-15"
    overrides: []
    maps_to: [ISO_27001_A.8.26, ISO_27001_A.8.28, NIST_CSF_PR.PS-02]
    remediation: >-
      Deploy a WAF in front of all external web applications; enforce HTTPS-only with
      HSTS; adopt a three-tier architecture; conduct authentication impact assessments
      to determine MFA requirements; publish a user-facing secure usage policy for
      each web application.
    tags:
      - "domain.defense"
      - "applies-to.ksa-entity"
      - "mechanism.technical"
      - "evidence.manual"

  # ======================================================================
  # Domain 3 -- Cybersecurity Resilience (1 control)
  # ======================================================================
  - id: NCA_ECC_RES_01
    pillar: "Cybersecurity Resilience"
    title: "Cybersecurity Resilience Aspects of Business Continuity Management (BCM)"
    description: >-
      Cybersecurity requirements for business continuity management within the entity
      shall be identified, documented, and approved. Requirements shall include ensuring
      the continuity of cybersecurity systems and procedures, developing plans for
      response to cybersecurity incidents that may affect the entity's business
      continuity, and developing disaster recovery plans. Requirements shall be
      implemented and reviewed periodically.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/res-01-business-continuity-management.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 3-1"
    overrides: []
    maps_to: [ISO_27001_A.5.29, ISO_27001_A.5.30, NIST_CSF_RC.RP-01]
    remediation: >-
      Integrate cybersecurity continuity requirements into the entity's BCP; develop
      and maintain a documented disaster recovery plan covering critical IT systems;
      test the plan at defined intervals; ensure cybersecurity operations (SIEM,
      access control) continue or recover within defined RTO/RPO targets.
    tags:
      - "domain.resilience"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  # ======================================================================
  # Domain 4 -- Third-Party and Cloud Computing Cybersecurity (2 controls)
  # ======================================================================
  - id: NCA_ECC_TPC_01
    pillar: "Third-Party and Cloud Computing Cybersecurity"
    title: "Third-Party Cybersecurity"
    description: >-
      Cybersecurity requirements for the entity's contracts and agreements with third
      parties shall be identified, documented, and approved. Requirements for all
      contracts that may affect the entity's data or services shall include
      non-disclosure clauses and secure removal of entity data upon end of service,
      communication procedures for cybersecurity incidents, and obligating the third
      party to apply the entity's cybersecurity requirements and relevant legislative
      requirements. For cybersecurity managed service centres providing monitoring or
      operations via remote access, the centre shall be fully located within the
      Kingdom of Saudi Arabia.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/tpc-01-third-party-cybersecurity.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 4-1"
    overrides: []
    maps_to: [ISO_27001_A.5.19, ISO_27001_A.5.20, ISO_27001_A.5.22, NIST_CSF_GV.SC-07]
    remediation: >-
      Embed mandatory ECC-2:2024 cybersecurity clauses in all third-party contracts
      and SLAs; include non-disclosure, data removal, and incident notification
      obligations; conduct a cybersecurity risk assessment before engaging any
      third-party IT or cybersecurity service; verify that remote-access managed
      service centres are located within Saudi Arabia before contract signature.
    tags:
      - "domain.third-party-cloud"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"

  - id: NCA_ECC_TPC_02
    pillar: "Third-Party and Cloud Computing Cybersecurity"
    title: "Cloud Computing and Hosting Cybersecurity"
    description: >-
      Cybersecurity requirements for use of cloud computing and hosting services shall
      be identified, documented, and approved, in addition to the applicable controls
      from Domains 1, 2, and 3 and Subdomain 4-1. Requirements shall include protection
      of entity data by cloud and hosting providers in accordance with its classification
      level, return of entity data in a usable format upon service completion, and
      separation of the entity's environment (including virtual servers) from
      environments of other entities within the cloud computing service provider.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/tpc-02-cloud-computing-and-hosting-cybersecurity.md" }
    references:
      - "https://nca.gov.sa/en/Pages/ECC.aspx"
      - "ECC-2:2024 Subdomain 4-2"
    overrides: []
    maps_to: [ISO_27001_A.5.23, NIST_CSF_GV.SC-09]
    cross_mapping:
      - target_framework: BSI_C5
        target_control: BSI_C5_OIS-01
        relationship: related
    remediation: >-
      For each cloud engagement, verify the provider's data classification handling and
      data portability commitments in the contract; confirm multi-tenancy isolation
      (logical or physical) meets the entity's risk tolerance; apply all relevant
      ECC-2:2024 Domains 1-3 controls to cloud-hosted assets; obtain data return
      confirmation before contract termination.
    tags:
      - "domain.third-party-cloud"
      - "applies-to.ksa-entity"
      - "mechanism.organisational"
      - "evidence.manual"
