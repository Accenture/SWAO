controls:
  # ------------------------------------------------------------------------
  # Pillar: Administrative Safeguards (45 CFR 164.308) -- 23 IS
  # ------------------------------------------------------------------------
  - id: HIPAA-ADM-01
    pillar: "Administrative Safeguards"
    title: "Risk Analysis (Required) -- 164.308(a)(1)(ii)(A)"
    description: >-
      Conduct an accurate and thorough assessment of the potential risks
      and vulnerabilities to the confidentiality, integrity, and
      availability of electronic protected health information (ePHI) held
      by the covered entity or business associate. The assessment must be
      documented, scoped to all ePHI, and refreshed periodically per
      NIST SP 800-66r2 §5.1.1.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/adm-01-risk-analysis.md" }
    references: ["NIST.SP.800-66r2.pdf"]
    overrides: []
    maps_to: [ISO_27001_Clause_6.1, ISO_27001_A.5.7, SOC_2_CC3.2]
    remediation: "Run a documented risk assessment against every system that creates, receives, maintains or transmits ePHI; record threats, likelihood, impact, and treatment."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-02
    pillar: "Administrative Safeguards"
    title: "Risk Management (Required) -- 164.308(a)(1)(ii)(B)"
    description: >-
      Implement security measures sufficient to reduce risks and
      vulnerabilities identified in HIPAA-ADM-01 to a reasonable and
      appropriate level. Risk treatments and residual risks are tracked
      through to closure.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-02-risk-management.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_Clause_6.1.3, ISO_27001_Clause_8.3, SOC_2_CC3.4]
    remediation: "Maintain a risk treatment plan linking each identified risk to a control or accepted residual; review at least annually."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-03
    pillar: "Administrative Safeguards"
    title: "Sanction Policy (Required) -- 164.308(a)(1)(ii)(C)"
    description: >-
      Apply appropriate sanctions against workforce members who fail to
      comply with the security policies and procedures of the covered
      entity or business associate.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/adm-03-sanction-policy.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.6.4]
    remediation: "Document a written sanction policy; record application of sanctions in a tracker the HR and security teams jointly maintain."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.workforce-security"
  - id: HIPAA-ADM-04
    pillar: "Administrative Safeguards"
    title: "Information System Activity Review (Required) -- 164.308(a)(1)(ii)(D)"
    description: >-
      Implement procedures to regularly review records of information
      system activity, such as audit logs, access reports, and security
      incident tracking reports.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.15, SOC_2_CC7.2]
    remediation: "Centralise audit logs into a SIEM; define a review cadence per system criticality (daily for high-risk, weekly otherwise); record reviews in a log."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-05
    pillar: "Administrative Safeguards"
    title: "Assigned Security Responsibility -- 164.308(a)(2)"
    description: >-
      Identify the security official who is responsible for the development
      and implementation of the policies and procedures required for the
      Security Rule. Single point of accountability is mandated.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-05-assigned-responsibility.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.2, SOC_2_CC1.3]
    remediation: "Name the Security Official in writing (charter or policy); communicate the appointment to all workforce members; identify a documented deputy."

    tags:
      - "applies-to.phi"
      - "requirement.standard-level"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-06
    pillar: "Administrative Safeguards"
    title: "Authorisation and/or Supervision (Addressable) -- 164.308(a)(3)(ii)(A)"
    description: >-
      Implement procedures for the authorisation and/or supervision of
      workforce members who work with ePHI or in locations where it might
      be accessed.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/adm-06-authorisation-supervision.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.18]
    remediation: "Document workforce role definitions linked to ePHI-access privileges; require supervisory sign-off on standing access."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.workforce-security"
  - id: HIPAA-ADM-07
    pillar: "Administrative Safeguards"
    title: "Workforce Clearance Procedure (Addressable) -- 164.308(a)(3)(ii)(B)"
    description: >-
      Implement procedures to determine that the access of a workforce
      member to ePHI is appropriate.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/adm-07-workforce-clearance-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.6.1]
    remediation: "Document a background-check and access-review process; tie access grants to a cleared status; review periodically."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.workforce-security"
  - id: HIPAA-ADM-08
    pillar: "Administrative Safeguards"
    title: "Termination Procedures (Addressable) -- 164.308(a)(3)(ii)(C)"
    description: >-
      Implement procedures for terminating access to ePHI when the
      employment of, or other arrangement with, a workforce member ends.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-08-termination-procedures.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.6.5, SOC_2_CC6.3]
    remediation: "Wire the HR offboarding workflow to the IAM system; revoke all access within a defined SLA (target same-day); log evidence per termination."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-09
    pillar: "Administrative Safeguards"
    title: "Isolating Healthcare Clearinghouse Functions (Required) -- 164.308(a)(4)(ii)(A)"
    description: >-
      If a healthcare clearinghouse is part of a larger organisation,
      implement policies and procedures that protect ePHI of the
      clearinghouse from unauthorised access by the larger organisation.
      Applicable only where a clearinghouse is in scope.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/adm-09-clearinghouse-isolation.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Document the network and access-control isolation between the clearinghouse function and the parent organisation; assert N/A if no clearinghouse is in scope."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-10
    pillar: "Administrative Safeguards"
    title: "Access Authorisation (Addressable) -- 164.308(a)(4)(ii)(B)"
    description: >-
      Implement policies and procedures for granting access to ePHI, for
      example through access to a workstation, transaction, programme,
      process, or other mechanism.
    severity_default: high
    evidence_basis:
      - { signal_prefix: IAM }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.15, ISO_27001_A.5.18, SOC_2_CC6.1, SOC_2_CC6.2]
    remediation: "Manage access grants through a documented request / approval / provisioning workflow integrated with the IAM platform."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.workforce-security"
  - id: HIPAA-ADM-11
    pillar: "Administrative Safeguards"
    title: "Access Establishment and Modification (Addressable) -- 164.308(a)(4)(ii)(C)"
    description: >-
      Implement policies and procedures that, based upon the entity's
      access authorisation policies, establish, document, review, and
      modify a user's right of access to a workstation, transaction,
      programme, or process.
    severity_default: high
    evidence_basis:
      - { signal_prefix: IAM }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.18, SOC_2_CC6.3]
    remediation: "Run periodic access reviews per system criticality (quarterly for high-risk); record review evidence and any changes back to IAM."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-12
    pillar: "Administrative Safeguards"
    title: "Security Reminders (Addressable) -- 164.308(a)(5)(ii)(A)"
    description: >-
      Implement periodic security updates communicated to all workforce
      members.
    severity_default: low
    evidence_basis:
      - { manual_questionnaire: "evidence/adm-12-security-reminders-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.6.3]
    remediation: "Schedule a recurring (quarterly minimum) security-reminder communication; record distribution and acknowledgement."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-13
    pillar: "Administrative Safeguards"
    title: "Protection from Malicious Software (Addressable) -- 164.308(a)(5)(ii)(B)"
    description: >-
      Implement procedures for guarding against, detecting, and reporting
      malicious software across workstations, servers, and mobile devices
      that handle ePHI.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-13-malicious-software.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.7, SOC_2_CC6.8]
    remediation: "Deploy EDR / antimalware on every ePHI-handling endpoint; define a detection-to-response SLA; route alerts to the incident-response queue."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-14
    pillar: "Administrative Safeguards"
    title: "Log-in Monitoring (Addressable) -- 164.308(a)(5)(ii)(C)"
    description: >-
      Implement procedures for monitoring log-in attempts and reporting
      discrepancies.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.15, SOC_2_CC7.2]
    remediation: "Forward authentication logs to the SIEM; alert on brute-force, impossible-travel, and lockout-threshold breach patterns."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-15
    pillar: "Administrative Safeguards"
    title: "Password Management (Addressable) -- 164.308(a)(5)(ii)(D)"
    description: >-
      Implement procedures for creating, changing, and safeguarding
      passwords. Where MFA is in use the password-management procedure
      remains required for the password factor.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: IAM }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.17, SOC_2_CC6.1]
    remediation: "Enforce password policy via the IDP (length, complexity, rotation, breach-list block); store secrets in a managed credential vault; deploy MFA on all ePHI access paths."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-16
    pillar: "Administrative Safeguards"
    title: "Response and Reporting (Required) -- 164.308(a)(6)(ii)"
    description: >-
      Identify and respond to suspected or known security incidents;
      mitigate, to the extent practicable, harmful effects of security
      incidents that are known; document security incidents and their
      outcomes.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-16-incident-response.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.24, ISO_27001_A.5.26, SOC_2_CC7.3, SOC_2_CC7.4]
    remediation: "Operate a documented incident-response plan: detection, triage, containment, eradication, recovery, post-incident review; integrate with the SIEM."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-17
    pillar: "Administrative Safeguards"
    title: "Data Backup Plan (Required) -- 164.308(a)(7)(ii)(A)"
    description: >-
      Establish and implement procedures to create and maintain retrievable
      exact copies of ePHI.
    severity_default: high
    evidence_basis:
      - { signal_prefix: DR }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.13, SOC_2_A1.3]
    remediation: "Define backup frequency and retention per system criticality; test restore at least annually; record evidence in the backup-test log."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.contingency-planning"
  - id: HIPAA-ADM-18
    pillar: "Administrative Safeguards"
    title: "Disaster Recovery Plan (Required) -- 164.308(a)(7)(ii)(B)"
    description: >-
      Establish and implement procedures to restore any loss of
      ePHI-handling systems and data.
    severity_default: high
    evidence_basis:
      - { signal_prefix: DR }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.29, ISO_27001_A.5.30, SOC_2_A1.3, DORA_Art_11]
    remediation: "Document RTO and RPO targets per system; build the runbooks; perform DR exercises at least annually."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.contingency-planning"
  - id: HIPAA-ADM-19
    pillar: "Administrative Safeguards"
    title: "Emergency Mode Operation Plan (Required) -- 164.308(a)(7)(ii)(C)"
    description: >-
      Establish and implement procedures to enable continuation of critical
      business processes for protection of the security of ePHI while
      operating in emergency mode.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-19-emergency-mode.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.29, DORA_Art_11]
    remediation: "Define what emergency mode means per system (degraded access, alternate paths); document the security controls that remain operational during the mode."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.contingency-planning"
  - id: HIPAA-ADM-20
    pillar: "Administrative Safeguards"
    title: "Testing and Revision Procedures (Addressable) -- 164.308(a)(7)(ii)(D)"
    description: >-
      Implement procedures for periodic testing and revision of contingency
      plans.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/adm-20-contingency-testing-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.30]
    remediation: "Test the data backup, disaster recovery, and emergency-mode plans on a defined cadence; revise based on test results."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-21
    pillar: "Administrative Safeguards"
    title: "Applications and Data Criticality Analysis (Addressable) -- 164.308(a)(7)(ii)(E)"
    description: >-
      Assess the relative criticality of specific applications and data in
      support of other contingency plan components.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/adm-21-criticality-analysis.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_A1.1]
    remediation: "Maintain a criticality / BIA register for ePHI-handling systems; feed it into RTO/RPO setting and DR test scoping."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-22
    pillar: "Administrative Safeguards"
    title: "Evaluation -- 164.308(a)(8)"
    description: >-
      Perform a periodic technical and non-technical evaluation, based
      initially upon the standards implemented under this rule and
      subsequently in response to environmental or operational changes
      affecting the security of ePHI.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/adm-22-evaluation-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_Clause_9.2, SOC_2_CC4.1, SOC_2_CC4.2]
    remediation: "Run an annual HIPAA Security Rule evaluation (internal or third-party); track findings to closure; record evaluation evidence in the audit register."

    tags:
      - "applies-to.phi"
      - "requirement.standard-level"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-ADM-23
    pillar: "Administrative Safeguards"
    title: "Business Associate Contracts (Required) -- 164.308(b)(3)"
    description: >-
      Document satisfactory assurances required by 164.308(b)(1) through a
      written contract or other arrangement with the business associate
      that meets the applicable requirements of 164.314(a).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/adm-23-ba-contracts.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.19, ISO_27001_A.5.20, SOC_2_CC9.2, DORA_Art_28]
    remediation: "Maintain a business-associate register; require executed BAA before any ePHI is shared; review on contract renewal and on material change."

  # ------------------------------------------------------------------------
  # Pillar: Physical Safeguards (45 CFR 164.310) -- 10 IS
  # ------------------------------------------------------------------------
    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-308"
      - "family.security-management"
  - id: HIPAA-PHY-01
    pillar: "Physical Safeguards"
    title: "Contingency Operations (Addressable) -- 164.310(a)(2)(i)"
    description: >-
      Establish (and implement as needed) procedures that allow facility
      access in support of restoration of lost data under the disaster
      recovery plan and emergency mode operations plan in the event of an
      emergency.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/phy-01-contingency-operations.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.5, ISO_27001_A.7.11]
    remediation: "Document the after-hours / emergency facility access procedure; identify named individuals authorised to grant emergency access."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-02
    pillar: "Physical Safeguards"
    title: "Facility Security Plan (Addressable) -- 164.310(a)(2)(ii)"
    description: >-
      Implement policies and procedures to safeguard the facility and the
      equipment therein from unauthorised physical access, tampering, and
      theft.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/phy-02-facility-security-plan.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.1, ISO_27001_A.7.2, ISO_27001_A.7.4]
    remediation: "Document the facility security plan: perimeter, entry controls, surveillance, response procedures; review every two years minimum."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-03
    pillar: "Physical Safeguards"
    title: "Access Control and Validation Procedures (Addressable) -- 164.310(a)(2)(iii)"
    description: >-
      Implement procedures to control and validate a person's access to
      facilities based on their role or function, including visitor control,
      and control of access to software programs for testing and revision.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/phy-03-access-validation.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.2, ISO_27001_A.7.3, SOC_2_CC6.4]
    remediation: "Require badge-based access (or equivalent); maintain a visitor log; restrict access to ePHI-handling rooms by role; review badge grants quarterly."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-04
    pillar: "Physical Safeguards"
    title: "Maintenance Records (Addressable) -- 164.310(a)(2)(iv)"
    description: >-
      Implement policies and procedures to document repairs and
      modifications to the physical components of a facility that are
      related to security.
    severity_default: low
    evidence_basis:
      - { manual_questionnaire: "evidence/phy-04-maintenance-records-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.13]
    remediation: "Keep a maintenance log for facility security components (locks, cameras, alarm panels, badge readers); review the log at facility audits."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-05
    pillar: "Physical Safeguards"
    title: "Workstation Use -- 164.310(b)"
    description: >-
      Implement policies and procedures that specify the proper functions
      to be performed, the manner in which those functions are to be
      performed, and the physical attributes of the surroundings of a
      specific workstation or class of workstation that can access ePHI.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/phy-05-workstation-use-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.6, ISO_27001_A.8.1]
    remediation: "Document acceptable-use rules per workstation class; restrict ePHI display in public-facing positions; train workforce."

    tags:
      - "applies-to.phi"
      - "requirement.standard-level"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-06
    pillar: "Physical Safeguards"
    title: "Workstation Security -- 164.310(c)"
    description: >-
      Implement physical safeguards for all workstations that access ePHI,
      to restrict access to authorised users.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/phy-06-workstation-security.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.7, ISO_27001_A.7.8, ISO_27001_A.8.1]
    remediation: "Lock workstations during inactivity; cable-lock or otherwise physically secure workstations in non-controlled areas; encrypt storage."

    tags:
      - "applies-to.phi"
      - "requirement.standard-level"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-07
    pillar: "Physical Safeguards"
    title: "Disposal (Required) -- 164.310(d)(2)(i)"
    description: >-
      Implement policies and procedures to address the final disposition of
      ePHI and/or the hardware or electronic media on which it is stored.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/phy-07-disposal.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.14, ISO_27001_A.8.10]
    remediation: "Use a documented secure-disposal process (cryptographic erasure or physical destruction); retain disposal certificates for the regulatory retention period."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-08
    pillar: "Physical Safeguards"
    title: "Media Re-use (Required) -- 164.310(d)(2)(ii)"
    description: >-
      Implement procedures for removal of ePHI from electronic media before
      the media is made available for re-use.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/phy-08-media-reuse.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.14, ISO_27001_A.8.10]
    remediation: "Sanitise media per NIST SP 800-88r1 before re-use; document sanitisation method per media class."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-09
    pillar: "Physical Safeguards"
    title: "Device and Media Accountability (Addressable) -- 164.310(d)(2)(iii)"
    description: >-
      Maintain a record of the movements of hardware and electronic media
      and any person responsible for that movement.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/phy-09-media-accountability-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.7.10, ISO_27001_A.5.9]
    remediation: "Tag every ePHI-handling device in the asset register; record movements (issue, return, loss) in a tracker the IT and security teams jointly own."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-PHY-10
    pillar: "Physical Safeguards"
    title: "Data Backup and Storage (Addressable) -- 164.310(d)(2)(iv)"
    description: >-
      Create a retrievable exact copy of ePHI, when needed, before movement
      of equipment.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: DR }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.13, SOC_2_A1.3]
    remediation: "Trigger an out-of-band backup before any device move that risks data loss; verify restorability before move."

  # ------------------------------------------------------------------------
  # Pillar: Technical Safeguards (45 CFR 164.312) -- 9 IS
  # ------------------------------------------------------------------------
    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-310"
      - "family.physical-access"
  - id: HIPAA-TEC-01
    pillar: "Technical Safeguards"
    title: "Unique User Identification (Required) -- 164.312(a)(2)(i)"
    description: >-
      Assign a unique name and/or number for identifying and tracking user
      identity. Shared accounts for ePHI access are prohibited.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: IAM }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.16, SOC_2_CC6.1]
    remediation: "Provision a unique principal per workforce member through the IDP; prohibit shared / service accounts for interactive ePHI access; audit for orphaned and stale identities."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-312"
      - "family.workforce-security"
  - id: HIPAA-TEC-02
    pillar: "Technical Safeguards"
    title: "Emergency Access Procedure (Required) -- 164.312(a)(2)(ii)"
    description: >-
      Establish (and implement as needed) procedures for obtaining
      necessary ePHI during an emergency.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/tec-02-emergency-access.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.15, SOC_2_CC6.6]
    remediation: "Document a break-glass procedure with named approvers; emit a high-priority alert on every break-glass invocation; review usage monthly."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-312"
      - "family.workforce-security"
  - id: HIPAA-TEC-03
    pillar: "Technical Safeguards"
    title: "Automatic Logoff (Addressable) -- 164.312(a)(2)(iii)"
    description: >-
      Implement electronic procedures that terminate an electronic session
      after a predetermined time of inactivity.
    severity_default: medium
    evidence_basis:
      - { local_signal_regex: "{src,config,k8s}/**/*.{ts,js,py,yaml,yml,tf}::(?i)(session[._-]?timeout|idle[._-]?timeout|max[._-]?inactive|expir(y|ation))" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.5, SOC_2_CC6.1]
    remediation: "Set session-idle timeout on every ePHI-handling application and infrastructure surface (target 15 min for clinical; 30 min for admin); enforce via session-management config."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-312"
      - "family.audit-logging"
  - id: HIPAA-TEC-04
    pillar: "Technical Safeguards"
    title: "Encryption and Decryption at Rest (Addressable) -- 164.312(a)(2)(iv)"
    description: >-
      Implement a mechanism to encrypt and decrypt ePHI at rest. NIST
      recommends FIPS 140-validated cryptographic modules per
      NIST SP 800-66r2 §5.3.1.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.24, SOC_2_CC6.7, GDPR_Art_32]
    remediation: "Encrypt all ePHI at rest with FIPS 140-validated cryptography; use KMS-managed keys with documented rotation."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-312"
      - "family.cryptography"
  - id: HIPAA-TEC-05
    pillar: "Technical Safeguards"
    title: "Audit Controls (Required) -- 164.312(b)"
    description: >-
      Implement hardware, software, and/or procedural mechanisms that
      record and examine activity in information systems that contain or
      use ePHI.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.15, SOC_2_CC7.2]
    remediation: "Emit immutable audit logs covering authentication, ePHI access, ePHI modification, and administrative actions; retain per the retention policy; review per HIPAA-ADM-04."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-312"
      - "family.audit-logging"
  - id: HIPAA-TEC-06
    pillar: "Technical Safeguards"
    title: "Integrity Mechanism for ePHI (Addressable) -- 164.312(c)(2)"
    description: >-
      Implement electronic mechanisms to corroborate that ePHI has not been
      altered or destroyed in an unauthorised manner.
    severity_default: high
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.24, SOC_2_PI1.1]
    remediation: "Use cryptographic checksums (digital signatures, HMAC, append-only audit ledger) for ePHI records; alert on integrity failures."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-312"
      - "family.cryptography"
  - id: HIPAA-TEC-07
    pillar: "Technical Safeguards"
    title: "Person or Entity Authentication (Required) -- 164.312(d)"
    description: >-
      Implement procedures to verify that a person or entity seeking access
      to ePHI is the one claimed.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: IAM }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.17, ISO_27001_A.8.5, SOC_2_CC6.1, GDPR_Art_32]
    remediation: "Require MFA for all ePHI access (workforce and B2B integrations); use a managed IDP; review authenticator strength against the IAL/AAL profile."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-312"
      - "family.workforce-security"
  - id: HIPAA-TEC-08
    pillar: "Technical Safeguards"
    title: "Integrity Controls in Transit (Addressable) -- 164.312(e)(2)(i)"
    description: >-
      Implement security measures to ensure that electronically transmitted
      ePHI is not improperly modified without detection until disposed of.
    severity_default: high
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.24, SOC_2_CC6.7]
    remediation: "Use TLS 1.2+ with mutual auth where feasible for ePHI transmission; reject downgrade attempts; monitor for cipher-suite drift."

    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-312"
      - "family.cryptography"
  - id: HIPAA-TEC-09
    pillar: "Technical Safeguards"
    title: "Encryption in Transit (Addressable) -- 164.312(e)(2)(ii)"
    description: >-
      Implement a mechanism to encrypt ePHI whenever deemed appropriate.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.24, SOC_2_CC6.7, GDPR_Art_32]
    remediation: "Encrypt every ePHI-transmission path (workforce browsers, partner integrations, internal service-to-service); deny cleartext fallback."

  # ------------------------------------------------------------------------
  # Pillar: Organisational Requirements (45 CFR 164.314) -- 3 IS
  # ------------------------------------------------------------------------
    tags:
      - "applies-to.phi"
      - "requirement.addressable"
      - "section.cfr-164-312"
      - "family.cryptography"
  - id: HIPAA-ORG-01
    pillar: "Organisational Requirements"
    title: "Business Associate Contracts (Required) -- 164.314(a)(2)(i)"
    description: >-
      The contract between a covered entity and a business associate must
      establish the permitted and required uses and disclosures of ePHI;
      provide that the business associate will safeguard ePHI; require
      breach reporting; and require termination of the contract for
      material breach.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/org-01-ba-contracts.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.19, ISO_27001_A.5.20, SOC_2_CC9.2, DORA_Art_28]
    remediation: "Use a standard BAA template legal has reviewed; require it before any ePHI is shared; track BAA execution per business associate."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-314"
      - "family.business-associate"
  - id: HIPAA-ORG-02
    pillar: "Organisational Requirements"
    title: "Other Arrangements (Required) -- 164.314(a)(2)(ii)"
    description: >-
      When the covered entity and the business associate are both
      government entities, the contractual requirement may be satisfied by
      an alternative legal mechanism (MOU, legislation, etc.) that meets
      the same objectives.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/org-02-other-arrangements.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Where a BAA is replaced by an MOU or statute, document the substitution rationale and the legal mechanism's clauses that map onto the BAA requirements."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-314"
      - "family.business-associate"
  - id: HIPAA-ORG-03
    pillar: "Organisational Requirements"
    title: "Group Health Plans (Required) -- 164.314(b)(2)"
    description: >-
      For group health plans, the plan documents must incorporate
      provisions that the plan sponsor will reasonably and appropriately
      safeguard ePHI. Applicable only where a group health plan is in
      scope.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/org-03-group-health-plans.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "If the engagement covers a group health plan, ensure the plan documents incorporate the required safeguarding language; assert N/A otherwise."

  # ------------------------------------------------------------------------
  # Pillar: Policies and Procedures and Documentation (45 CFR 164.316) -- 4 IS
  # ------------------------------------------------------------------------
    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-314"
      - "family.business-associate"
  - id: HIPAA-PND-01
    pillar: "Policies and Procedures and Documentation"
    title: "Policies and Procedures -- 164.316(a)"
    description: >-
      Implement reasonable and appropriate policies and procedures to
      comply with the standards, implementation specifications, and other
      requirements of the Security Rule.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/pnd-01-policies-procedures.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.1, SOC_2_CC1.1]
    remediation: "Maintain a policy register linked to each HIPAA Standard / IS; review at least annually; require workforce acknowledgement."

    tags:
      - "applies-to.phi"
      - "requirement.standard-level"
      - "section.cfr-164-316"
      - "family.documentation"
  - id: HIPAA-PND-02
    pillar: "Policies and Procedures and Documentation"
    title: "Documentation Time Limit (Required) -- 164.316(b)(2)(i)"
    description: >-
      Retain the documentation required by 164.316(b)(1) for 6 years from
      the date of its creation or the date when it last was in effect,
      whichever is later.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/pnd-02-documentation-retention-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.33]
    remediation: "Configure the document-management system with the 6-year retention rule for HIPAA documentation; audit retention enforcement annually."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-316"
      - "family.documentation"
  - id: HIPAA-PND-03
    pillar: "Policies and Procedures and Documentation"
    title: "Documentation Availability (Required) -- 164.316(b)(2)(ii)"
    description: >-
      Make documentation available to those persons responsible for
      implementing the procedures to which the documentation pertains.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/pnd-03-documentation-availability-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.33]
    remediation: "Publish HIPAA policies and procedures on the workforce intranet with role-based read access; track access on a per-role basis."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-316"
      - "family.documentation"
  - id: HIPAA-PND-04
    pillar: "Policies and Procedures and Documentation"
    title: "Documentation Updates (Required) -- 164.316(b)(2)(iii)"
    description: >-
      Review documentation periodically, and update as needed, in response
      to environmental or operational changes affecting the security of
      the ePHI.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/pnd-04-documentation-updates-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.33]
    remediation: "Set a per-policy review cadence (annually minimum); record the review date and reviewer in each document's front-matter."

    tags:
      - "applies-to.phi"
      - "requirement.required"
      - "section.cfr-164-316"
      - "family.documentation"