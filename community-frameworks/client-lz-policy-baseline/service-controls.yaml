# Service-to-control mapping (Design 120 section 8.2; Design 123 section 8.2, #3863).
# Framework: Client LZ Policy Baseline. Keyed by SWAO capability tags (LZ catalogue `fulfills`).
# Rows follow the capabilities named in policy-baseline.yaml (capabilities, applies_to,
# allow_capabilities) and the services each policy bears on. confidence: curated, because
# the client sets the baseline (Design 123 section 8.2, Design 120 Q-23); a client that edits
# policy-baseline.yaml adjusts these rows with it. Capability tags without a row stay grey.
schema_version: "0.1"
framework: CLIENT_LZ_POLICY_BASELINE
