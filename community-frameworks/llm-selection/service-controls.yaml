# Service-to-control mapping (Design 120 §8.2, #3578).
# Framework: LLM Selection Framework for Sovereign Deployment. Keyed by SWAO capability tags (LZ catalogue `fulfills`).
# Drafted by keyword classification of control titles (scripts/draft-service-controls.py)
# plus a model review recorded in scripts/service-controls-overrides.yaml; not human-reviewed
# (confidence: derived, Q-23). A human reviewer sets confidence: curated.
# Capability tags without a row stay grey.
schema_version: "0.1"
framework: LLM_SELECTION
mappings:
  - capability: managed_llm
    controls: [MT-01, MT-02, SB-02, SB-04, DSR-02]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
  - capability: ml_inference
    controls: [MT-03, PR-02, SB-04, SB-05]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
  - capability: ml_training
    controls: [SB-01, MT-04]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
  - capability: ml_nlp
    controls: [CLF-01, CLF-02, PR-02]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
  - capability: ml_speech
    controls: [CLF-01]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
  - capability: ml_translation
    controls: [CLF-01, CLF-02]
    relevance: configure
    confidence: derived
    source: "keyword draft (scripts/draft-service-controls.py) plus model review against controls.yaml, 2026-11-02, not human-reviewed"
