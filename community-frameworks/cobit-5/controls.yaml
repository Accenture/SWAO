# Hand-maintained catalogue (#3292, 2026-10-17). No input.csv ships with this
# folder: edit this file and framework-meta.yaml directly, then run the
# health check. Control descriptions and remediation text are original SWAO
# wording. Process IDs (EDM01 to MEA03) and process names are the COBIT 5
# identifiers; the reference publication is cited in framework-meta.yaml.
# Schema: RegimeCatalogueSchema v0.11 (design 029 §4.5; design 018 §2.1).

regime_meta:
  id: COBIT_5
  name: "COBIT 5: A Business Framework for the Governance and Management of Enterprise IT"
  version: "2012 (ISBN 978-1-60420-237-3)"
  authority: "ISACA (Information Systems Audit and Control Association)"
  contributor:
    name: "Accenture SWAO team (community packaging)"
    email: "https://github.com/Accenture/SWAO/discussions"
    url: "https://accenture.example/swao/community-frameworks/cobit-5"
  catalogue_version: "0.2.0"
  signal_prefix: COBIT
  last_reviewed: "2026-10-17"
  applicability_hints:
    - it_governance
    - enterprise_it_management
    - audit_assurance
    - risk_management
    - service_management
    - regulatory_alignment
  redistribution_note: >-
    Original SWAO wording. Control descriptions, assessor guidance and
    remediation text in this catalogue were written by the SWAO Development
    Team and are not copied or adapted from ISACA material. Process IDs and
    process names are the COBIT 5 identifiers, used as factual references.
    Reference publication: ISACA, COBIT 5: A Business Framework for the
    Governance and Management of Enterprise IT (2012, ISBN
    978-1-60420-237-3). COBIT is a registered trademark of ISACA. No ISACA
    publication is bundled with this catalogue.

controls:
  # ------------------------------------------------------------------------
  # Pillar: Evaluate, Direct and Monitor (governance)
  # ------------------------------------------------------------------------
  - id: EDM01
    pillar: "Evaluate Direct and Monitor"
    title: "Ensure Governance Framework Setting and Maintenance"
    description: >-
      The organisation decides how IT is governed: who sits on the governing
      bodies, which decisions they own, and which principles and policies bind
      the rest of the IT function. The arrangement is written down, approved
      at board level and kept current. Assessors look for an approved
      governance charter, a decision-rights matrix, a policy register with a
      clear hierarchy, and minutes showing that the governing body reviews the
      arrangement.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/edm-01-governance-framework.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.1, SOC_2_CC1.1]
    remediation: "Stand up an IT governance charter approved by the board; identify the decision-rights matrix (RACI) and review at least annually."

  - id: EDM02
    pillar: "Evaluate Direct and Monitor"
    title: "Ensure Benefits Delivery"
    description: >-
      Leadership checks that money spent on IT returns the value promised when
      it was approved. Each significant initiative states its expected
      benefit, and the board follows up after delivery. Assessors look for
      approved business cases with measurable benefits, a benefits register or
      value dashboard, and post-implementation reviews that compare planned
      and achieved results.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/edm-02-benefits-delivery.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Maintain a value-management dashboard tracking realised vs planned benefits per investment; review with the steering committee quarterly."

  - id: EDM03
    pillar: "Evaluate Direct and Monitor"
    title: "Ensure Risk Optimisation"
    description: >-
      The board sets how much IT-related risk the organisation is willing to
      carry and makes sure that limit is respected. Risk limits are explicit
      and connected to day-to-day risk handling. Assessors look for a risk
      appetite statement with IT-specific thresholds, board endorsement of it,
      and evidence that material IT risks are reported against those
      thresholds.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/edm-03-risk-optimisation.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC3.2]
    remediation: "Define an enterprise risk appetite statement that includes IT-specific tolerances; integrate IT risk into the enterprise risk register."

  - id: EDM04
    pillar: "Evaluate Direct and Monitor"
    title: "Ensure Resource Optimisation"
    description: >-
      Leadership makes sure the organisation has enough of the right IT
      capacity (people, platforms, applications and data) and that it is spent
      where it matters most. Assessors look for a resource or sourcing
      strategy, periodic reviews of demand against capacity, and decisions
      that move staff or budget when priorities shift.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/edm-04-resource-optimisation.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Review resource utilisation against demand on a defined cadence (quarterly minimum); adjust the resource plan via the steering committee."

  - id: EDM05
    pillar: "Evaluate Direct and Monitor"
    title: "Ensure Stakeholder Transparency"
    description: >-
      The governing body tells the people who rely on IT, such as executives,
      regulators, customers and auditors, how IT is performing, whether it
      meets its obligations and what risks it carries. Reporting is regular,
      accurate and fit for each audience. Assessors look for a defined
      reporting schedule, audience-specific reports or scorecards, and records
      of how feedback was handled.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/edm-05-stakeholder-transparency.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC2.3]
    remediation: "Publish a stakeholder-facing IT governance scorecard; tailor the level of disclosure to the audience (board, regulator, customer)."

  # ------------------------------------------------------------------------
  # Pillar: Align, Plan and Organise
  # ------------------------------------------------------------------------
  - id: APO01
    pillar: "Align Plan and Organise"
    title: "Manage the IT Management Framework"
    description: >-
      The IT function has a clear operating model that puts the governance
      decisions into practice: organisational units, roles, processes,
      reporting lines and supporting policies. Assessors look for an IT
      organisation chart, role descriptions with accountabilities, a
      documented process model, and evidence that these are reviewed when the
      organisation changes.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-01-it-management-framework.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.2]
    remediation: "Document the IT operating model (functions, RACI, escalation paths); align with EDM01 outputs."

  - id: APO02
    pillar: "Align Plan and Organise"
    title: "Manage Strategy"
    description: >-
      IT has a written strategy that supports where the business is heading.
      It describes the present state, the desired future state and the steps
      between them, and it is shared with those who must act on it. Assessors
      look for a current IT strategy document linked to business objectives, a
      roadmap with owners and dates, and a record of the last refresh.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-02-strategy.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC1.1]
    remediation: "Refresh the IT strategy at least annually; carry through to the portfolio and architecture roadmaps."

  - id: APO03
    pillar: "Align Plan and Organise"
    title: "Manage Enterprise Architecture"
    description: >-
      The organisation keeps a picture of its current and intended business,
      data, application and technology landscape and uses it to steer solution
      choices. Principles and standards guide design decisions. Assessors look
      for baseline and target architecture models, a list of architecture
      principles, a standards catalogue, and records of architecture reviews
      on recent projects.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-03-enterprise-architecture.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Maintain a TOGAF-style architecture repository; review every solution proposal against the principles register."

  - id: APO04
    pillar: "Align Plan and Organise"
    title: "Manage Innovation"
    description: >-
      The organisation keeps watch on new technology and ways of working and
      tests promising ideas in a controlled way before wider adoption.
      Assessors look for a horizon-scanning routine, a funding route for
      experiments, pilot plans with stop or continue criteria, and follow-up
      on what pilots delivered.
    severity_default: low
    evidence_basis:
      - { manual_questionnaire: "evidence/apo-04-innovation-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Run a regular horizon-scanning exercise; carry a small innovation budget separate from BAU IT spend."

  - id: APO05
    pillar: "Align Plan and Organise"
    title: "Manage Portfolio"
    description: >-
      All IT investments are viewed together so that the organisation funds
      the right mix and stops work that no longer pays off. Each item moves
      through defined stages with a decision at each step. Assessors look for
      a single portfolio register, prioritisation criteria, stage-gate
      decisions, and evidence that underperforming items are reshaped or
      retired.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-05-portfolio.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC1.3]
    remediation: "Maintain a single portfolio of IT investments; gate at standard stages (idea, business case, build, run, retire)."

  - id: APO06
    pillar: "Align Plan and Organise"
    title: "Manage Budget and Costs"
    description: >-
      IT spending is planned, approved, tracked and explained. Costs can be
      traced to services or consumers so that decisions about spend are well
      informed. Assessors look for an approved IT budget, regular actual-
      against-plan reporting with variance explanations, and a cost allocation
      or showback model.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-06-budget-costs.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Set up cost categories aligned with the portfolio; track actual vs budget monthly with variance analysis."

  - id: APO07
    pillar: "Align Plan and Organise"
    title: "Manage Human Resources"
    description: >-
      The IT function has people with the skills it needs now and later.
      Hiring, training, performance reviews and succession are planned rather
      than improvised, and key knowledge does not rest with a single person.
      Assessors look for a skills inventory for critical roles, workforce
      plans, training records, and succession arrangements for key positions.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/apo-07-human-resources-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Maintain a skills matrix per critical role; review against demand and turnover every six months."

  - id: APO08
    pillar: "Align Plan and Organise"
    title: "Manage Relationships"
    description: >-
      IT and the business units it serves work as partners, with named
      contacts, shared plans and an honest view of how the relationship is
      going. Assessors look for assigned relationship owners, joint planning
      or review meetings, and satisfaction or feedback measures that lead to
      action.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/apo-08-relationships.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Assign a business relationship manager per business unit; hold a quarterly joint planning session."

  - id: APO09
    pillar: "Align Plan and Organise"
    title: "Manage Service Agreements"
    description: >-
      The services IT provides are described, and the expected service levels
      are agreed with the people who use them. Actual delivery is measured
      against those agreements and reviewed. Assessors look for a service
      catalogue, approved service level agreements, regular service level
      reports, and records of review meetings with service consumers.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/apo-09-service-agreements.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_A1.1, DORA_Art_30]
    remediation: "Publish a service catalogue with SLA targets; report against SLAs monthly to the service-receiving business unit."

  - id: APO10
    pillar: "Align Plan and Organise"
    title: "Manage Suppliers"
    description: >-
      External providers of IT products and services are chosen, contracted,
      monitored and exited in a controlled way, with attention to the risk
      each one introduces, including dependence on a small number of
      providers. Assessors look for a supplier register with criticality
      ratings, contracts with service levels and audit and exit terms,
      performance reviews, and a view of concentration risk.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/apo-10-suppliers.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.19, ISO_27001_A.5.21, SOC_2_CC9.2]
    remediation: "Maintain a supplier register with criticality, contract terms, performance and exit plan; review against the third-party risk policy."

  - id: APO11
    pillar: "Align Plan and Organise"
    title: "Manage Quality"
    description: >-
      Quality expectations for IT solutions and services are set up front and
      checked throughout delivery, and lessons are fed back to improve later
      work. Assessors look for defined quality criteria or definitions of
      done, review and test gates in the delivery pipeline, defect tracking,
      and quality trend reporting.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: QA }
    references: []
    overrides: []
    maps_to: [SOC_2_CC8.1]
    remediation: "Define quality gates per delivery phase; require evidence of test pass before promotion; track escaped-defect trends."

  - id: APO12
    pillar: "Align Plan and Organise"
    title: "Manage Risk"
    description: >-
      IT-related risks are found, analysed, handled and watched on a
      continuing basis, and the results flow back to the governing body that
      sets the risk limits (see EDM03). Assessors look for an IT risk register
      with owners and ratings, a repeatable assessment method, treatment plans
      tracked to closure, and periodic risk reports.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/apo-12-risk.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC3.1, DORA_Art_6]
    remediation: "Run an enterprise IT risk assessment at least annually; track treatment actions to closure; carry residual risk through to EDM03."

  - id: APO13
    pillar: "Align Plan and Organise"
    title: "Manage Security"
    description: >-
      Information security is run as a managed system rather than a set of
      isolated measures: policy, roles, risk-based controls and continual
      improvement work together to protect information and systems. Assessors
      look for an approved security policy, a defined scope for the security
      management system, a risk-based control set, and code and configuration
      evidence that identity, encryption, logging and network controls are in
      place.
    severity_default: critical
    evidence_basis:
      # Multi-entry evidence_basis (design 029 §13.2 clarification 3 + §13.6
      # item 2). IAM is the primary evidence area; the others are secondary.
      - { signal_prefix: IAM }
      - { signal_prefix: CRYPTO }
      - { signal_prefix: OBS }
      - { signal_prefix: EGR }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.1, ISO_27001_A.5.15, ISO_27001_A.8.24, SOC_2_CC6.1, SOC_2_CC6.6]
    remediation: "Operate an ISMS aligned with ISO 27001 covering policy, organisation, asset management, access control, cryptography, operations and incident response."

  # ------------------------------------------------------------------------
  # Pillar: Build, Acquire and Implement
  # ------------------------------------------------------------------------
  - id: BAI01
    pillar: "Build Acquire and Implement"
    title: "Manage Programmes and Projects"
    description: >-
      Change initiatives run with a clear scope, plan, budget, owner and
      decision points, and are closed with a check of whether the intended
      outcome was reached. Assessors look for project charters, a recognised
      delivery method, status and risk reporting, stage-gate approvals and
      closure reports.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/bai-01-programmes-projects.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Adopt a single delivery method (PRINCE2 / PMI) per programme; report against the standard gates."

  - id: BAI02
    pillar: "Build Acquire and Implement"
    title: "Manage Requirements Definition"
    description: >-
      Before a solution is built or bought, the organisation records what it
      must do, how well it must perform and which rules it must follow, and
      keeps those needs traceable as work progresses. Assessors look for an
      agreed requirements set covering functional, non-functional and
      compliance needs, traceability to design and tests, and a controlled
      route for changing requirements.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/bai-02-requirements-definition.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC8.1]
    remediation: "Maintain a requirements register linked to design artefacts and test cases; baseline before build; control changes through a steering group."

  - id: BAI03
    pillar: "Build Acquire and Implement"
    title: "Manage Solutions Identification and Build"
    description: >-
      Solutions are designed and built, or configured from purchased products,
      in line with agreed requirements and architecture, using a repeatable
      and controlled way of producing releases. Assessors look for version-
      controlled source, automated build and deployment pipelines, peer review
      before merge, and automated tests that run as part of the build.
    severity_default: medium
    evidence_basis:
      - { local_signal_regex: ".github/workflows/**/*.{yml,yaml}::(?i)(build|deploy|release)" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Standardise the CI/CD pipeline per solution stack; require code review and automated tests before merge."

  - id: BAI04
    pillar: "Build Acquire and Implement"
    title: "Manage Availability and Capacity"
    description: >-
      The organisation plans for the performance and capacity its services
      need, watches actual usage and acts before limits are reached. Assessors
      look for capacity and availability targets per service, monitoring and
      alerting on utilisation trends, and records of capacity reviews and the
      actions that followed.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [SOC_2_A1.2]
    remediation: "Establish capacity baselines per service; alert on trends approaching the SLA boundary; review every quarter."

  - id: BAI05
    pillar: "Build Acquire and Implement"
    title: "Manage Organisational Change Enablement"
    description: >-
      Technology change comes with attention to the people affected:
      stakeholders are engaged, users are prepared and trained, and adoption
      is checked so that the new way of working takes hold. Assessors look for
      change impact assessments, communication and training plans, and
      adoption or usage measures after go-live.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/bai-05-organisational-change.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Bundle a change-enablement workstream into every transformation programme; track adoption KPIs alongside delivery KPIs."

  - id: BAI06
    pillar: "Build Acquire and Implement"
    title: "Manage Changes"
    description: >-
      Changes to live systems are recorded, assessed for impact and risk,
      approved by the right people, scheduled and checked afterwards. Urgent
      changes have a fast but still controlled route. Assessors look for a
      change record for each production change, approval evidence, rollback
      plans, an emergency change procedure, and post-implementation reviews.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/bai-06-changes.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.32, SOC_2_CC8.1]
    remediation: "Operate a CAB (or change-approval workflow) covering risk assessment, rollback plan and post-implementation review for every production change."

  - id: BAI07
    pillar: "Build Acquire and Implement"
    title: "Manage Change Acceptance and Transitioning"
    description: >-
      New or changed solutions are tested, accepted by the business and handed
      over to operations in an orderly way, with support arrangements ready
      from the first day. Assessors look for acceptance test results and sign-
      off, go-live readiness criteria, operational handover documentation, and
      a defined early-life support period.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/bai-07-change-acceptance.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC8.1]
    remediation: "Require service-acceptance criteria (runbooks, on-call rota, monitoring) to be signed off before go-live; record the early-life warranty exit."

  - id: BAI08
    pillar: "Build Acquire and Implement"
    title: "Manage Knowledge"
    description: >-
      Know-how about systems, services and processes is written down, kept
      current and easy to find, so that the organisation does not depend on
      the memory of individuals. Assessors look for a maintained knowledge
      base or runbook library, owners and review dates for key articles, and
      evidence that critical knowledge is held by more than one person.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/bai-08-knowledge.md" }
    references: []
    overrides: []
    maps_to: []
    remediation: "Maintain a service knowledge management system (SKMS) per critical service; review the index quarterly for stale or missing entries."

  - id: BAI09
    pillar: "Build Acquire and Implement"
    title: "Manage Assets"
    description: >-
      Hardware, software licences and related contracts are tracked from
      purchase to disposal, so that the organisation knows what it owns, where
      it is and what it costs. Assessors look for an asset register reconciled
      with finance and the configuration database, licence compliance checks,
      and records of secure disposal.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: INV }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.9, SOC_2_CC6.2]
    remediation: "Maintain an authoritative asset register reconciled with the CMDB and finance; review for stale entries every six months."

  - id: BAI10
    pillar: "Build Acquire and Implement"
    title: "Manage Configuration"
    description: >-
      The components that make up each service, and the way they depend on
      each other, are recorded and kept accurate, so that changes and
      incidents are handled with a reliable picture. Assessors look for a
      configuration database or infrastructure-as-code repository, defined
      baselines, updates tied to change records, and periodic reconciliation
      of recorded against actual state.
    severity_default: medium
    evidence_basis:
      - { local_signal_regex: "{infra,terraform,k8s}/**/*.{tf,yaml,yml}::(?i)(resource|kind|module)" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.8.9]
    remediation: "Manage infrastructure as code (Terraform / Kubernetes manifests) under version control; reconcile the CMDB with the IaC source at least monthly."

  # ------------------------------------------------------------------------
  # Pillar: Deliver, Service and Support
  # ------------------------------------------------------------------------
  - id: DSS01
    pillar: "Deliver Service and Support"
    title: "Manage Operations"
    description: >-
      Routine IT operations, such as job scheduling, backups, monitoring and
      facility controls, run reliably to documented procedures, and
      operational events are noticed and handled. Assessors look for
      operational runbooks, schedules and on-call rotas, central event and log
      monitoring, and records showing that operational checks are carried out.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [SOC_2_CC7.2]
    remediation: "Maintain operational runbooks and on-call schedules per service; centralise log and event monitoring (SIEM / observability platform)."

  - id: DSS02
    pillar: "Deliver Service and Support"
    title: "Manage Service Requests and Incidents"
    description: >-
      User requests are fulfilled and service disruptions are restored
      quickly, and each one is recorded, prioritised and tracked to
      completion. Assessors look for a ticketing system, priority definitions
      with response and resolution targets, escalation rules, and service
      level reports on request and incident handling.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/dss-02-service-requests-incidents.md" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC7.3, ISO_27001_A.5.24]
    remediation: "Operate a service-desk / ticketing tool with defined response and resolution targets per priority class; report on SLA attainment monthly."

  - id: DSS03
    pillar: "Deliver Service and Support"
    title: "Manage Problems"
    description: >-
      Recurring or significant incidents are investigated for their underlying
      cause, and lasting fixes are put in place so they do not happen again.
      Assessors look for problem records linked to incidents, root-cause
      analyses, a known-error list, and tracking of permanent fixes through to
      release.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/dss-03-problems.md" }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.25, SOC_2_CC7.4]
    remediation: "Hold a fortnightly problem review covering top incident clusters; track structural fixes through to release."

  - id: DSS04
    pillar: "Deliver Service and Support"
    title: "Manage Continuity"
    description: >-
      The organisation can keep critical services running, or bring them back
      within agreed times, after a serious disruption. Plans exist, are tested
      and are updated after tests and real events. Assessors look for a
      business impact analysis, recovery time and recovery point targets,
      continuity and recovery plans, test reports, and evidence of backup and
      failover arrangements.
    severity_default: high
    evidence_basis:
      - { signal_prefix: DR }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.29, ISO_27001_A.5.30, SOC_2_A1.3]
    remediation: "Test the DR plan against the stated RTO / RPO at least annually for every critical service; record gaps and treat to closure."

  - id: DSS05
    pillar: "Deliver Service and Support"
    title: "Manage Security Services"
    description: >-
      The everyday security measures that protect users, devices, networks and
      data are operated and kept effective: access management, malware
      defence, network protection, vulnerability handling and security
      monitoring. Assessors look for joiner, mover and leaver records,
      endpoint and network protection status, patch and vulnerability reports,
      security monitoring and response records, and code and configuration
      signals on identity, encryption, egress and logging.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: IAM }
      - { signal_prefix: EGR }
      - { signal_prefix: OBS }
      - { signal_prefix: CRYPTO }
    references: []
    overrides: []
    maps_to: [ISO_27001_A.5.15, ISO_27001_A.8.7, ISO_27001_A.8.16, ISO_27001_A.8.20, SOC_2_CC6.1, SOC_2_CC6.6, SOC_2_CC6.8, SOC_2_CC7.1]
    remediation: "Operate the security-operations function: identity & access lifecycle, endpoint and network protection, vulnerability and patch management, monitoring and response."

  - id: DSS06
    pillar: "Deliver Service and Support"
    title: "Manage Business Process Controls"
    description: >-
      Controls built into business processes that run on IT, such as approval
      limits, segregation of duties and checks on data completeness and
      accuracy, are designed, operated and verified. Assessors look for a
      control inventory per key process with named owners, authorisations
      enforced by the system, reconciliation evidence, and independent test
      results.
    severity_default: medium
    evidence_basis:
      - { manual_questionnaire: "evidence/dss-06-business-process-controls-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC5.1]
    remediation: "Document each critical business-process control owner, frequency and evidence; have internal audit re-perform a sample annually."

  # ------------------------------------------------------------------------
  # Pillar: Monitor, Evaluate and Assess
  # ------------------------------------------------------------------------
  - id: MEA01
    pillar: "Monitor Evaluate and Assess"
    title: "Monitor Evaluate and Assess Performance and Conformance"
    description: >-
      IT performance and adherence to internal rules are measured against
      agreed targets, the results are reported, and shortfalls lead to
      corrective action. Assessors look for defined performance indicators
      with targets, regular performance reports, review meetings, and tracked
      corrective actions.
    severity_default: medium
    evidence_basis:
      - { signal_prefix: OBS }
    references: []
    overrides: []
    maps_to: [SOC_2_CC4.1]
    remediation: "Publish a balanced-scorecard IT performance report on a defined cadence (monthly minimum); review with the steering committee."

  - id: MEA02
    pillar: "Monitor Evaluate and Assess"
    title: "Monitor Evaluate and Assess the System of Internal Control"
    description: >-
      The organisation checks whether its IT controls are well designed and
      actually working, through management self-assessment and independent
      review, and fixes the weaknesses it finds. Assessors look for a control
      register, a control testing plan, design and operating effectiveness
      results, and a deficiency log with owners and due dates.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/mea-02-internal-control-questionnaire.yaml" }
    references: []
    overrides: []
    maps_to: [SOC_2_CC4.1, SOC_2_CC4.2]
    remediation: "Maintain an internal-controls register (COSO-style) with owner, frequency and last-test result; close exceptions through a tracker."

  - id: MEA03
    pillar: "Monitor Evaluate and Assess"
    title: "Monitor Evaluate and Assess Compliance With External Requirements"
    description: >-
      The organisation knows which laws, regulations and contractual
      obligations apply to its use of IT, checks whether it meets them and
      corrects any shortfall. Assessors look for an obligations or compliance
      register mapped to internal controls, periodic compliance assessments,
      reports to an oversight body, and remediation tracking for findings.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/mea-03-external-compliance.md" }
    references: []
    overrides: []
    maps_to: [GDPR_Art_30, ISO_27001_A.5.31, ISO_27001_A.5.32, ISO_27001_A.5.34, SOC_2_CC2.2]
    remediation: "Maintain a compliance register linking external requirements to internal controls; report compliance status to the audit committee quarterly."
