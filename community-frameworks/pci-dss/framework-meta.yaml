# SWAO community framework metadata (design 029 §2.3 + §11)
# Sprint-039 #0358 Phase 1 migration from the standard-scope PoC stub at
# `swao/controls/standard/pci-dss-controls.yaml`. Thin packaging --
# control set preserved verbatim from the stub (same 5 controls); only
# the wrapper graduates to design-029 community shape. Catalogue depth
# can grow in a future sprint without another wrapper migration.

framework:
  id: PCI_DSS
  name: "Payment Card Industry Data Security Standard v4.0"
  version: "4.0"
  authority: "PCI Security Standards Council"
  contributor:
    name: "Accenture SWAO team (community packaging)"
    url: "https://accenture.example/swao/community-frameworks/pci-dss"
  applicability_hints:
    - payments
    - cardholder_data
    - ecommerce
  assessment_type_scope: [app, aud]
  description: >-
    PCI DSS v4.0 (effective 2024-03-31, full enforcement 2025-03-31) is the global standard for protecting cardholder data. Applies to all entities that store, process, or transmit cardholder data or sensitive authentication data.
  references:
    - "https://www.pcisecuritystandards.org/document_library/"
  catalogue_version: "0.1.0"
  last_reviewed: "2026-05-24"
