# SWAO Community Framework -- ISO/IEC 27001:2022 Annex A
#
# Schema: RegimeCatalogueSchema v0.11 (design 029 §4.5; design 018 §2.1).
#
# Source of truth: ISO/IEC 27001:2022 and ISO/IEC 27002:2022 (implementation
# guidance). ISO standards are copyright protected; control descriptions in
# this catalogue paraphrase the requirement intent for SWAO machine ingestion.
# Reviewers verify accuracy against the cited Annex A reference.
#
# 93 controls across 4 themes (2022 restructure):
#   Theme 1 -- Organisational (A.5): 37 controls
#   Theme 2 -- People (A.6):         8 controls
#   Theme 3 -- Physical (A.7):       14 controls  [csp_inherited: true]
#   Theme 4 -- Technological (A.8):  34 controls
#
# 11 controls new in ISO 27001:2022 revision are labelled introduced: "ISO27001:2022"
# Physical A.7.x controls carry csp_inherited: true because they cover datacenter
# physical security that is managed entirely by the cloud provider; assessors accept
# the CSP's SOC 2 / ISO 27001 certificate as attestation evidence.

regime_meta:
  id: ISO_27001
  name: "Information Security Management"
  version: "2022"
  scope: community
  authority: "International Organization for Standardization"
  contributor:
    name: "SWAO Development Team (Accenture)"
    url: "https://accenture.example/swao/community-frameworks/iso-27001"
  catalogue_version: "1.0.0"
  signal_prefix: ISO27K
  last_reviewed: "2026-09-21"
  applicability_hints: [enterprise, ism, broad_coverage]
  redistribution_note: >-
    ISO/IEC 27001:2022 and ISO/IEC 27002:2022 are copyright ISO. Control
    titles and descriptions in this catalogue paraphrase the requirement
    intent and do not reproduce verbatim standard text. The authoritative
    text is available from ISO (iso.org) and national standards bodies.
    No warranty is provided; consult qualified professionals for
    interpretation of how a requirement applies to a specific workload.

controls:

  # ==============================================================
  # Theme 1 -- Organisational controls (A.5)
  # ==============================================================

  - id: ISO_27001_A.5.1
    pillar: "Organisational controls (A.5)"
    title: "Policies for information security"
    description: >-
      The organisation shall define an information security policy and
      topic-specific policies, have them approved by management, publish
      and communicate them to relevant personnel, and review them at
      planned intervals and after significant changes.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.1"
      - "ISO/IEC 27002:2022 §5.1"
    maps_to: [BSI_ISMS1_A3]

  - id: ISO_27001_A.5.2
    pillar: "Organisational controls (A.5)"
    title: "Information security roles and responsibilities"
    description: >-
      Information security roles and responsibilities shall be defined and
      allocated according to the organisation's information security
      policy. Individuals assigned responsibilities must have appropriate
      competence to carry out the required tasks.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.2"
      - "ISO/IEC 27002:2022 §5.2"
    maps_to: [BSI_ISMS1_A4]

  - id: ISO_27001_A.5.3
    pillar: "Organisational controls (A.5)"
    title: "Segregation of duties"
    description: >-
      Conflicting duties and conflicting areas of responsibility shall be
      segregated to reduce the risk of unauthorised or unintentional
      modification or misuse of the organisation's assets.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.3"
      - "ISO/IEC 27002:2022 §5.3"

  - id: ISO_27001_A.5.4
    pillar: "Organisational controls (A.5)"
    title: "Management responsibilities"
    description: >-
      Management shall require all personnel to apply information security
      in accordance with the established policy, topic-specific policies,
      and procedures of the organisation.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.4"
      - "ISO/IEC 27002:2022 §5.4"
    maps_to: [BSI_ISMS1_A1]

  - id: ISO_27001_A.5.5
    pillar: "Organisational controls (A.5)"
    title: "Contact with authorities"
    description: >-
      The organisation shall establish and maintain contact with relevant
      authorities (regulatory, law enforcement, supervisory bodies) so
      that information security incidents can be reported and appropriate
      escalation channels are known.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.5"
      - "ISO/IEC 27002:2022 §5.5"

  - id: ISO_27001_A.5.6
    pillar: "Organisational controls (A.5)"
    title: "Contact with special interest groups"
    description: >-
      The organisation shall establish and maintain contact with special
      interest groups, specialist security forums, and professional
      associations to keep abreast of evolving threats, vulnerabilities,
      and best practices.
    severity_default: low
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.6"
      - "ISO/IEC 27002:2022 §5.6"

  - id: ISO_27001_A.5.7
    pillar: "Organisational controls (A.5)"
    title: "Threat intelligence"
    description: >-
      The organisation shall collect and analyse information about
      information security threats so that threat intelligence can be
      used to prepare countermeasures and reduce the impact of security
      incidents.
    introduced: "ISO27001:2022"
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.5.7"
      - "ISO/IEC 27002:2022 §5.7"

  - id: ISO_27001_A.5.8
    pillar: "Organisational controls (A.5)"
    title: "Information security in project management"
    description: >-
      Information security shall be integrated into project management
      throughout the project lifecycle so that security risks are
      identified and addressed as part of project delivery.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.8"
      - "ISO/IEC 27002:2022 §5.8"

  - id: ISO_27001_A.5.9
    pillar: "Organisational controls (A.5)"
    title: "Inventory of information and other associated assets"
    description: >-
      An inventory of information and other associated assets, including
      owners, shall be developed and maintained. Ownership ensures
      accountability for information assets throughout their lifecycle.
    severity_default: medium
    evidence_basis:
      - context_input: cmdb_export
    references:
      - "ISO/IEC 27001:2022 Annex A.5.9"
      - "ISO/IEC 27002:2022 §5.9"

  - id: ISO_27001_A.5.10
    pillar: "Organisational controls (A.5)"
    title: "Acceptable use of information and other associated assets"
    description: >-
      Rules for the acceptable use and procedures for handling information
      and other associated assets shall be identified, documented, and
      implemented. All users shall adhere to these rules.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.10"
      - "ISO/IEC 27002:2022 §5.10"

  - id: ISO_27001_A.5.11
    pillar: "Organisational controls (A.5)"
    title: "Return of assets"
    description: >-
      Personnel and other interested parties shall return all
      organisational assets in their possession upon change or
      termination of employment, contract, or agreement.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.11"
      - "ISO/IEC 27002:2022 §5.11"

  - id: ISO_27001_A.5.12
    pillar: "Organisational controls (A.5)"
    title: "Classification of information"
    description: >-
      Information shall be classified according to the information
      security needs of the organisation based on confidentiality,
      integrity, availability, and relevant interested party requirements.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.12"
      - "ISO/IEC 27002:2022 §5.12"

  - id: ISO_27001_A.5.13
    pillar: "Organisational controls (A.5)"
    title: "Labelling of information"
    description: >-
      An appropriate set of procedures for information labelling shall be
      developed and implemented in accordance with the information
      classification scheme adopted by the organisation.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.13"
      - "ISO/IEC 27002:2022 §5.13"

  - id: ISO_27001_A.5.14
    pillar: "Organisational controls (A.5)"
    title: "Information transfer"
    description: >-
      Information transfer rules, procedures, or agreements shall be in
      place for all types of transfer facilities within the organisation
      and between the organisation and other parties.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
      - signal_prefix: EGR
    references:
      - "ISO/IEC 27001:2022 Annex A.5.14"
      - "ISO/IEC 27002:2022 §5.14"

  - id: ISO_27001_A.5.15
    pillar: "Organisational controls (A.5)"
    title: "Access control"
    description: >-
      Rules to control physical and logical access to information and
      other associated assets shall be established and implemented based
      on business and information security requirements.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.5.15"
      - "ISO/IEC 27002:2022 §5.15"

  - id: ISO_27001_A.5.16
    pillar: "Organisational controls (A.5)"
    title: "Identity management"
    description: >-
      The full lifecycle of identities shall be managed. This includes
      unique identifiers for persons and systems, timely provisioning and
      de-provisioning, and regular review of access rights.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.5.16"
      - "ISO/IEC 27002:2022 §5.16"

  - id: ISO_27001_A.5.17
    pillar: "Organisational controls (A.5)"
    title: "Authentication information"
    description: >-
      Allocation and management of authentication information shall be
      controlled by a management process, including advising personnel on
      appropriate handling of authentication information such as
      passwords and secrets.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.5.17"
      - "ISO/IEC 27002:2022 §5.17"

  - id: ISO_27001_A.5.18
    pillar: "Organisational controls (A.5)"
    title: "Access rights"
    description: >-
      Access rights to information and other associated assets shall be
      provisioned, reviewed, modified, and removed in accordance with the
      access control policy and applicable topic-specific policies. Access
      rights reviews shall occur at defined intervals.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.5.18"
      - "ISO/IEC 27002:2022 §5.18"

  - id: ISO_27001_A.5.19
    pillar: "Organisational controls (A.5)"
    title: "Information security in supplier relationships"
    description: >-
      Processes and procedures shall be defined and implemented to manage
      the information security risks associated with the use of suppliers'
      products or services, covering the entire supply chain.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.19"
      - "ISO/IEC 27002:2022 §5.19"

  - id: ISO_27001_A.5.20
    pillar: "Organisational controls (A.5)"
    title: "Addressing information security within supplier agreements"
    description: >-
      Relevant information security requirements shall be established and
      agreed with each supplier based on the type of supplier relationship
      and the information or other assets to be accessed, processed, or
      managed.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.20"
      - "ISO/IEC 27002:2022 §5.20"

  - id: ISO_27001_A.5.21
    pillar: "Organisational controls (A.5)"
    title: "Managing information security in the ICT supply chain"
    description: >-
      Processes and procedures shall be defined and implemented to manage
      the information security risks associated with the ICT products and
      services supply chain. Suppliers must be required to propagate
      security practices throughout their own supply chain.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.21"
      - "ISO/IEC 27002:2022 §5.21"

  - id: ISO_27001_A.5.22
    pillar: "Organisational controls (A.5)"
    title: "Monitoring, review and change management of supplier services"
    description: >-
      The organisation shall regularly monitor, review, evaluate, and
      manage changes in supplier information security practices and
      service delivery in accordance with supplier agreements.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.22"
      - "ISO/IEC 27002:2022 §5.22"

  - id: ISO_27001_A.5.23
    pillar: "Organisational controls (A.5)"
    title: "Information security for use of cloud services"
    description: >-
      Processes for acquisition, use, management, and exit from cloud
      services shall be established in accordance with the organisation's
      information security requirements. Cloud service provider
      capabilities and contractual commitments must be assessed.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.23"
      - "ISO/IEC 27002:2022 §5.23"

  - id: ISO_27001_A.5.24
    pillar: "Organisational controls (A.5)"
    title: "Information security incident management planning and preparation"
    description: >-
      The organisation shall plan and prepare for managing information
      security incidents by defining, establishing, and communicating
      information security incident management processes, roles, and
      responsibilities.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.24"
      - "ISO/IEC 27002:2022 §5.24"

  - id: ISO_27001_A.5.25
    pillar: "Organisational controls (A.5)"
    title: "Assessment and decision on information security events"
    description: >-
      The organisation shall assess information security events and
      decide if they are to be categorised as information security
      incidents. Criteria and decision processes shall be documented
      and applied consistently.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.5.25"
      - "ISO/IEC 27002:2022 §5.25"

  - id: ISO_27001_A.5.26
    pillar: "Organisational controls (A.5)"
    title: "Response to information security incidents"
    description: >-
      Information security incidents shall be responded to in accordance
      with the documented procedures. Response shall include containment,
      eradication, recovery, and post-incident actions within defined
      timeframes.
    severity_default: critical
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.26"
      - "ISO/IEC 27002:2022 §5.26"

  - id: ISO_27001_A.5.27
    pillar: "Organisational controls (A.5)"
    title: "Learning from information security incidents"
    description: >-
      Knowledge gained from analysing and resolving information security
      incidents shall be used to reduce the likelihood or impact of
      future incidents. Post-incident reviews shall feed back into the
      security management programme.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.27"
      - "ISO/IEC 27002:2022 §5.27"

  - id: ISO_27001_A.5.28
    pillar: "Organisational controls (A.5)"
    title: "Collection of evidence"
    description: >-
      The organisation shall establish and implement procedures for the
      identification, collection, acquisition, and preservation of
      evidence related to information security events so that evidence
      can be used in disciplinary or legal proceedings.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.5.28"
      - "ISO/IEC 27002:2022 §5.28"

  - id: ISO_27001_A.5.29
    pillar: "Organisational controls (A.5)"
    title: "Information security during disruption"
    description: >-
      The organisation shall plan how to maintain information security at
      an appropriate level during disruption. Business continuity plans
      shall include information security controls to be maintained during
      crisis situations.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.29"
      - "ISO/IEC 27002:2022 §5.29"

  - id: ISO_27001_A.5.30
    pillar: "Organisational controls (A.5)"
    title: "ICT readiness for business continuity"
    description: >-
      ICT readiness shall be planned, implemented, maintained, and tested
      based on ICT continuity objectives and ICT continuity requirements
      derived from the business continuity objectives.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.30"
      - "ISO/IEC 27002:2022 §5.30"

  - id: ISO_27001_A.5.31
    pillar: "Organisational controls (A.5)"
    title: "Legal, statutory, regulatory and contractual requirements"
    description: >-
      Legal, statutory, regulatory, and contractual requirements relevant
      to information security and the organisation's approach to meeting
      these requirements shall be explicitly identified, documented, and
      kept up to date.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.31"
      - "ISO/IEC 27002:2022 §5.31"

  - id: ISO_27001_A.5.32
    pillar: "Organisational controls (A.5)"
    title: "Intellectual property rights"
    description: >-
      The organisation shall implement appropriate procedures to protect
      intellectual property rights, including software licences and any
      other related legal restrictions.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.32"
      - "ISO/IEC 27002:2022 §5.32"

  - id: ISO_27001_A.5.33
    pillar: "Organisational controls (A.5)"
    title: "Protection of records"
    description: >-
      Records shall be protected from loss, destruction, falsification,
      unauthorised access, and unauthorised release throughout their
      required retention period, in accordance with legal, statutory,
      regulatory, and contractual requirements.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.5.33"
      - "ISO/IEC 27002:2022 §5.33"

  - id: ISO_27001_A.5.34
    pillar: "Organisational controls (A.5)"
    title: "Privacy and protection of PII"
    description: >-
      The organisation shall identify and meet the requirements regarding
      the preservation of privacy and protection of personally
      identifiable information, as required by applicable legislation,
      regulations, and contractual clauses.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.5.34"
      - "ISO/IEC 27002:2022 §5.34"
    maps_to: [GDPR_Art_5, GDPR_Art_25, GDPR_Art_32]

  - id: ISO_27001_A.5.35
    pillar: "Organisational controls (A.5)"
    title: "Independent review of information security"
    description: >-
      The organisation's approach to managing information security and
      its implementation shall be reviewed independently at planned
      intervals or when significant changes occur, to ensure its
      continuing suitability, adequacy, and effectiveness.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.35"
      - "ISO/IEC 27002:2022 §5.35"

  - id: ISO_27001_A.5.36
    pillar: "Organisational controls (A.5)"
    title: "Compliance with policies, rules and standards for information security"
    description: >-
      Compliance with the organisation's information security policy,
      topic-specific policies, rules, and standards shall be regularly
      reviewed. Non-compliances shall be formally assessed and actioned.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.36"
      - "ISO/IEC 27002:2022 §5.36"

  - id: ISO_27001_A.5.37
    pillar: "Organisational controls (A.5)"
    title: "Documented operating procedures"
    description: >-
      Operating procedures for information processing facilities shall be
      documented and made available to personnel who need them. Changes
      to established operating procedures shall be authorised by
      management.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.5.37"
      - "ISO/IEC 27002:2022 §5.37"

  # ==============================================================
  # Theme 2 -- People controls (A.6)
  # ==============================================================

  - id: ISO_27001_A.6.1
    pillar: "People controls (A.6)"
    title: "Screening"
    description: >-
      Background verification checks on all candidates for employment
      shall be carried out prior to joining the organisation and on an
      ongoing basis, taking into account applicable laws, regulations,
      ethics, and the risk and business requirements of the role.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.1"
      - "ISO/IEC 27002:2022 §6.1"

  - id: ISO_27001_A.6.2
    pillar: "People controls (A.6)"
    title: "Terms and conditions of employment"
    description: >-
      Employment contracts shall state the personnel's and the
      organisation's responsibilities for information security. Personnel
      must acknowledge and agree to information security obligations as a
      condition of employment.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.2"
      - "ISO/IEC 27002:2022 §6.2"

  - id: ISO_27001_A.6.3
    pillar: "People controls (A.6)"
    title: "Information security awareness, education and training"
    description: >-
      Personnel and relevant interested parties shall receive appropriate
      information security awareness, education, and training, including
      regular updates of organisational policies and procedures relevant
      to their job function.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.3"
      - "ISO/IEC 27002:2022 §6.3"

  - id: ISO_27001_A.6.4
    pillar: "People controls (A.6)"
    title: "Disciplinary process"
    description: >-
      A disciplinary process shall be formalised and communicated to take
      action against personnel who have committed an information security
      breach. The process shall provide proportionate responses depending
      on the severity and frequency of breaches.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.4"
      - "ISO/IEC 27002:2022 §6.4"

  - id: ISO_27001_A.6.5
    pillar: "People controls (A.6)"
    title: "Responsibilities after termination or change of employment"
    description: >-
      Information security responsibilities and duties that remain valid
      after termination or change of employment shall be defined,
      communicated to personnel, and enforced. Access rights shall be
      removed or adjusted promptly.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.6.5"
      - "ISO/IEC 27002:2022 §6.5"

  - id: ISO_27001_A.6.6
    pillar: "People controls (A.6)"
    title: "Confidentiality or non-disclosure agreements"
    description: >-
      Non-disclosure or confidentiality agreements reflecting the
      organisation's needs for protection of information shall be
      identified, documented, regularly reviewed, and signed by personnel
      and other relevant interested parties.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.6"
      - "ISO/IEC 27002:2022 §6.6"

  - id: ISO_27001_A.6.7
    pillar: "People controls (A.6)"
    title: "Remote working"
    description: >-
      Security measures shall be implemented when personnel are working
      remotely to protect information accessed, processed, or stored
      outside the organisation's premises. Remote working policies and
      technical controls shall address connectivity, access, and endpoint
      security.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
      - signal_prefix: EGR
    references:
      - "ISO/IEC 27001:2022 Annex A.6.7"
      - "ISO/IEC 27002:2022 §6.7"

  - id: ISO_27001_A.6.8
    pillar: "People controls (A.6)"
    title: "Information security event reporting"
    description: >-
      The organisation shall provide a mechanism for personnel to report
      observed or suspected information security events through
      appropriate channels in a timely manner. All personnel shall be
      aware of their responsibility to report events.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.6.8"
      - "ISO/IEC 27002:2022 §6.8"

  # ==============================================================
  # Theme 3 -- Physical controls (A.7)
  # csp_inherited: true -- cloud physical security is managed entirely
  # by the CSP and is evidenced by the CSP's ISO 27001 certificate
  # or SOC 2 Type II report. Assessors accept the CSP attestation.
  # ==============================================================

  - id: ISO_27001_A.7.1
    pillar: "Physical controls (A.7)"
    title: "Physical security perimeters"
    description: >-
      Physical perimeters shall be defined and used to protect areas that
      contain information and other associated assets. Perimeters shall
      use appropriate barriers with controlled entry points.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.1"
      - "ISO/IEC 27002:2022 §7.1"

  - id: ISO_27001_A.7.2
    pillar: "Physical controls (A.7)"
    title: "Physical entry"
    description: >-
      Secure areas shall be protected by appropriate entry controls and
      access points to ensure that only authorised personnel are allowed
      access. Access shall be logged and reviewed regularly.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.2"
      - "ISO/IEC 27002:2022 §7.2"

  - id: ISO_27001_A.7.3
    pillar: "Physical controls (A.7)"
    title: "Securing offices, rooms and facilities"
    description: >-
      Physical security for offices, rooms, and facilities shall be
      designed and applied. Secure areas and their controls shall be
      subject to regular review to ensure they remain appropriate.
    csp_inherited: true
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.3"
      - "ISO/IEC 27002:2022 §7.3"

  - id: ISO_27001_A.7.4
    pillar: "Physical controls (A.7)"
    title: "Physical security monitoring"
    description: >-
      Premises shall be continuously monitored for unauthorised physical
      access. Monitoring systems, such as CCTV and alarms, shall be
      regularly tested and maintained to ensure effectiveness.
    introduced: "ISO27001:2022"
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.4"
      - "ISO/IEC 27002:2022 §7.4"

  - id: ISO_27001_A.7.5
    pillar: "Physical controls (A.7)"
    title: "Protecting against physical and environmental threats"
    description: >-
      Protection against physical and environmental threats, such as
      natural disasters, malicious attacks, or accidents, shall be
      designed and implemented. Threat assessments for physical locations
      shall inform the selection and placement of controls.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.5"
      - "ISO/IEC 27002:2022 §7.5"

  - id: ISO_27001_A.7.6
    pillar: "Physical controls (A.7)"
    title: "Working in secure areas"
    description: >-
      Security measures for working in secure areas shall be designed
      and applied. Personnel shall be briefed on rules and procedures
      for working in secure areas, and access shall be granted on a
      need basis.
    csp_inherited: true
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.6"
      - "ISO/IEC 27002:2022 §7.6"

  - id: ISO_27001_A.7.7
    pillar: "Physical controls (A.7)"
    title: "Clear desk and clear screen"
    description: >-
      Clear desk rules for papers and removable storage media and clear
      screen rules for information processing facilities shall be
      defined and appropriately enforced.
    csp_inherited: false
    severity_default: low
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.7.7"
      - "ISO/IEC 27002:2022 §7.7"

  - id: ISO_27001_A.7.8
    pillar: "Physical controls (A.7)"
    title: "Equipment siting and protection"
    description: >-
      Equipment shall be sited and protected to reduce the risks from
      physical and environmental threats and hazards, and from
      unauthorised access and interference. CSP datacenter siting
      decisions cover cloud-hosted equipment.
    csp_inherited: true
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.8"
      - "ISO/IEC 27002:2022 §7.8"

  - id: ISO_27001_A.7.9
    pillar: "Physical controls (A.7)"
    title: "Security of assets off-premises"
    description: >-
      Off-site assets shall be protected, taking into account the
      different risks of working outside the organisation's premises.
      Policies and procedures for asset use outside secure areas shall
      be documented and followed.
    csp_inherited: false
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.7.9"
      - "ISO/IEC 27002:2022 §7.9"

  - id: ISO_27001_A.7.10
    pillar: "Physical controls (A.7)"
    title: "Storage media"
    description: >-
      Storage media shall be managed through their lifecycle of
      acquisition, use, transportation, and disposal in accordance with
      the organisation's classification scheme and applicable regulatory
      requirements. Cloud storage lifecycle is managed by the CSP.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.10"
      - "ISO/IEC 27002:2022 §7.10"

  - id: ISO_27001_A.7.11
    pillar: "Physical controls (A.7)"
    title: "Supporting utilities"
    description: >-
      Information processing facilities shall be protected from power
      failures and other disruptions caused by failures in supporting
      utilities. CSPs provide redundant power and cooling in certified
      datacenters.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.11"
      - "ISO/IEC 27002:2022 §7.11"

  - id: ISO_27001_A.7.12
    pillar: "Physical controls (A.7)"
    title: "Cabling security"
    description: >-
      Cables carrying power or data shall be protected from
      interception, interference, or damage. CSPs manage datacenter
      cabling infrastructure; workload-side controls cover
      internal network cabling at client premises.
    csp_inherited: true
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.12"
      - "ISO/IEC 27002:2022 §7.12"

  - id: ISO_27001_A.7.13
    pillar: "Physical controls (A.7)"
    title: "Equipment maintenance"
    description: >-
      Equipment shall be correctly maintained to ensure availability and
      integrity of information. Cloud hardware maintenance is performed
      by the CSP. Operator-owned equipment (on-prem) requires a separate
      maintenance schedule.
    csp_inherited: true
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.13"
      - "ISO/IEC 27002:2022 §7.13"

  - id: ISO_27001_A.7.14
    pillar: "Physical controls (A.7)"
    title: "Secure disposal or re-use of equipment"
    description: >-
      Items of equipment containing storage media shall be verified to
      ensure that any sensitive data and licenced software has been
      removed or securely overwritten before disposal or re-use. CSPs
      provide certified media destruction for decommissioned hardware.
    csp_inherited: true
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.7.14"
      - "ISO/IEC 27002:2022 §7.14"

  # ==============================================================
  # Theme 4 -- Technological controls (A.8)
  # ==============================================================

  - id: ISO_27001_A.8.1
    pillar: "Technological controls (A.8)"
    title: "User end-point devices"
    description: >-
      Information stored on, processed by, or accessible via user
      end-point devices shall be protected. Policies covering
      end-point device management, configuration standards, and acceptable
      use shall be implemented and enforced.
    severity_default: high
    evidence_basis:
      - context_input: cmdb_export
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.1"
      - "ISO/IEC 27002:2022 §8.1"

  - id: ISO_27001_A.8.2
    pillar: "Technological controls (A.8)"
    title: "Privileged access rights"
    description: >-
      The allocation and use of privileged access rights shall be
      restricted and managed. Privileged access shall be granted on the
      principle of least privilege, time-limited where possible, and
      subject to regular review.
    severity_default: critical
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.2"
      - "ISO/IEC 27002:2022 §8.2"

  - id: ISO_27001_A.8.3
    pillar: "Technological controls (A.8)"
    title: "Information access restriction"
    description: >-
      Access to information and application system functions shall be
      restricted in accordance with the access control policy.
      Role-based access control shall enforce least-privilege access at
      the resource level.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.3"
      - "ISO/IEC 27002:2022 §8.3"

  - id: ISO_27001_A.8.4
    pillar: "Technological controls (A.8)"
    title: "Access to source code"
    description: >-
      Read and write access to source code, development tools, and
      software libraries shall be appropriately managed to prevent the
      introduction of unauthorised functionality and to avoid unintentional
      changes.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.4"
      - "ISO/IEC 27002:2022 §8.4"

  - id: ISO_27001_A.8.5
    pillar: "Technological controls (A.8)"
    title: "Secure authentication"
    description: >-
      Secure authentication technologies and procedures shall be
      implemented based on information access restrictions and the
      access control policy. Multi-factor authentication shall be
      enforced for privileged and remote access.
    severity_default: critical
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.5"
      - "ISO/IEC 27002:2022 §8.5"

  - id: ISO_27001_A.8.6
    pillar: "Technological controls (A.8)"
    title: "Capacity management"
    description: >-
      The use of resources shall be monitored and adjusted, and
      projections of future capacity requirements made to ensure the
      required system performance to meet the business objectives.
    severity_default: medium
    evidence_basis:
      - signal_prefix: OBS
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.8.6"
      - "ISO/IEC 27002:2022 §8.6"

  - id: ISO_27001_A.8.7
    pillar: "Technological controls (A.8)"
    title: "Protection against malware"
    description: >-
      Protection against malware shall be implemented and supported by
      appropriate user awareness. Anti-malware software shall be
      deployed and kept up to date, and scan results shall be logged
      and reviewed.
    severity_default: high
    evidence_basis:
      - context_input: cmdb_export
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.7"
      - "ISO/IEC 27002:2022 §8.7"

  - id: ISO_27001_A.8.8
    pillar: "Technological controls (A.8)"
    title: "Management of technical vulnerabilities"
    description: >-
      Information about technical vulnerabilities of information systems
      shall be obtained in a timely fashion. The organisation's exposure
      to such vulnerabilities shall be evaluated and appropriate measures
      taken to address the associated risk.
    severity_default: high
    evidence_basis:
      - context_input: cmdb_export
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.8"
      - "ISO/IEC 27002:2022 §8.8"

  - id: ISO_27001_A.8.9
    pillar: "Technological controls (A.8)"
    title: "Configuration management"
    description: >-
      Configurations, including security configurations, of hardware,
      software, services, and networks shall be established, documented,
      implemented, monitored, and reviewed. Deviations from configuration
      baselines shall be detected and remediated.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - signal_prefix: TF
      - context_input: cmdb_export
    references:
      - "ISO/IEC 27001:2022 Annex A.8.9"
      - "ISO/IEC 27002:2022 §8.9"

  - id: ISO_27001_A.8.10
    pillar: "Technological controls (A.8)"
    title: "Information deletion"
    description: >-
      Information stored in information systems, devices, or in any other
      storage media shall be deleted when no longer required. Secure
      deletion procedures shall be applied to prevent inadvertent
      disclosure or regulatory violation.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.8.10"
      - "ISO/IEC 27002:2022 §8.10"

  - id: ISO_27001_A.8.11
    pillar: "Technological controls (A.8)"
    title: "Data masking"
    description: >-
      Data masking shall be used in accordance with the organisation's
      topic-specific policy on access control and other related policies,
      and business requirements, taking applicable legislation into
      account.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.11"
      - "ISO/IEC 27002:2022 §8.11"
    maps_to: [GDPR_Art_25, GDPR_Art_32]

  - id: ISO_27001_A.8.12
    pillar: "Technological controls (A.8)"
    title: "Data leakage prevention"
    description: >-
      Data leakage prevention measures shall be applied to systems,
      networks, and any other devices that process, store, or transmit
      sensitive information to detect and prevent unauthorised disclosure
      or exfiltration.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - signal_prefix: EGR
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.12"
      - "ISO/IEC 27002:2022 §8.12"

  - id: ISO_27001_A.8.13
    pillar: "Technological controls (A.8)"
    title: "Information backup"
    description: >-
      Backup copies of information, software, and systems shall be
      maintained and regularly tested in accordance with an agreed
      backup policy. Backup copies shall be stored at a separate
      location at sufficient physical distance from the primary facility.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.8.13"
      - "ISO/IEC 27002:2022 §8.13"

  - id: ISO_27001_A.8.14
    pillar: "Technological controls (A.8)"
    title: "Redundancy of information processing facilities"
    description: >-
      Information processing facilities shall be implemented with
      sufficient redundancy to meet availability requirements. Critical
      systems shall have redundant components and the ability to fail
      over without loss of service.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.14"
      - "ISO/IEC 27002:2022 §8.14"

  - id: ISO_27001_A.8.15
    pillar: "Technological controls (A.8)"
    title: "Logging"
    description: >-
      Logs that record activities, exceptions, faults, and information
      security events shall be produced, stored, protected, and
      analysed. Log integrity shall be maintained and logs retained
      for the required period.
    severity_default: high
    evidence_basis:
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.15"
      - "ISO/IEC 27002:2022 §8.15"

  - id: ISO_27001_A.8.16
    pillar: "Technological controls (A.8)"
    title: "Monitoring activities"
    description: >-
      Networks, systems, and applications shall be monitored for
      anomalous behaviour and appropriate actions taken to evaluate
      potential information security incidents. Monitoring thresholds
      and alert criteria shall be defined and reviewed regularly.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.16"
      - "ISO/IEC 27002:2022 §8.16"

  - id: ISO_27001_A.8.17
    pillar: "Technological controls (A.8)"
    title: "Clock synchronisation"
    description: >-
      The clocks of information processing systems used by the
      organisation shall be synchronised to approved time sources.
      Accurate time is required for log correlation, forensics, and
      compliance.
    severity_default: medium
    evidence_basis:
      - signal_prefix: OBS
    references:
      - "ISO/IEC 27001:2022 Annex A.8.17"
      - "ISO/IEC 27002:2022 §8.17"

  - id: ISO_27001_A.8.18
    pillar: "Technological controls (A.8)"
    title: "Use of privileged utility programs"
    description: >-
      The use of utility programs that might be capable of overriding
      system and application controls shall be restricted and tightly
      controlled. Only authorised administrators shall have access to
      privileged utilities.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
    references:
      - "ISO/IEC 27001:2022 Annex A.8.18"
      - "ISO/IEC 27002:2022 §8.18"

  - id: ISO_27001_A.8.19
    pillar: "Technological controls (A.8)"
    title: "Installation of software on operational systems"
    description: >-
      Procedures and measures shall be implemented to securely manage
      software installation on operational systems. Only authorised and
      verified software shall be installed; change management approval
      is required before installation.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
      - signal_prefix: TF
    references:
      - "ISO/IEC 27001:2022 Annex A.8.19"
      - "ISO/IEC 27002:2022 §8.19"

  - id: ISO_27001_A.8.20
    pillar: "Technological controls (A.8)"
    title: "Network security"
    description: >-
      Networks and network devices shall be secured, managed, and
      controlled to protect information in systems and applications.
      Security of networks shall include network architecture design,
      filtering, and change management.
    severity_default: high
    evidence_basis:
      - signal_prefix: TF
      - signal_prefix: EGR
    references:
      - "ISO/IEC 27001:2022 Annex A.8.20"
      - "ISO/IEC 27002:2022 §8.20"

  - id: ISO_27001_A.8.21
    pillar: "Technological controls (A.8)"
    title: "Security of network services"
    description: >-
      Security mechanisms, service levels, and management requirements
      for all network services shall be identified, implemented, and
      monitored. This applies whether services are provided in-house or
      outsourced.
    severity_default: high
    evidence_basis:
      - signal_prefix: EGR
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.21"
      - "ISO/IEC 27002:2022 §8.21"

  - id: ISO_27001_A.8.22
    pillar: "Technological controls (A.8)"
    title: "Segregation of networks"
    description: >-
      Groups of information services, users, and information systems
      shall be segregated in the organisation's networks. Network
      segmentation shall enforce least-privilege access between zones
      and prevent lateral movement in the event of a breach.
    severity_default: high
    evidence_basis:
      - signal_prefix: TF
      - signal_prefix: EGR
    references:
      - "ISO/IEC 27001:2022 Annex A.8.22"
      - "ISO/IEC 27002:2022 §8.22"

  - id: ISO_27001_A.8.23
    pillar: "Technological controls (A.8)"
    title: "Web filtering"
    description: >-
      Access to external websites shall be managed to reduce exposure to
      malicious content. Web filtering controls shall be implemented to
      block access to known malicious domains and categories of harmful
      content.
    introduced: "ISO27001:2022"
    severity_default: medium
    evidence_basis:
      - signal_prefix: EGR
    references:
      - "ISO/IEC 27001:2022 Annex A.8.23"
      - "ISO/IEC 27002:2022 §8.23"

  - id: ISO_27001_A.8.24
    pillar: "Technological controls (A.8)"
    title: "Use of cryptography"
    description: >-
      Rules for the effective use of cryptography, including cryptographic
      key management, shall be defined and implemented. Approved
      algorithms, key lengths, and protocols shall be mandated in policy
      and enforced technically.
    severity_default: high
    evidence_basis:
      - signal_prefix: CRYPTO
    references:
      - "ISO/IEC 27001:2022 Annex A.8.24"
      - "ISO/IEC 27002:2022 §8.24"

  - id: ISO_27001_A.8.25
    pillar: "Technological controls (A.8)"
    title: "Secure development life cycle"
    description: >-
      Rules for the secure development of software and systems shall be
      established and applied to developments within the organisation.
      Security requirements shall be embedded throughout all phases of
      the development lifecycle.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.25"
      - "ISO/IEC 27002:2022 §8.25"

  - id: ISO_27001_A.8.26
    pillar: "Technological controls (A.8)"
    title: "Application security requirements"
    description: >-
      Information security requirements shall be identified, specified,
      and approved when developing or acquiring applications. Security
      requirements shall include functional security requirements and
      controls for managing misuse.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.26"
      - "ISO/IEC 27002:2022 §8.26"

  - id: ISO_27001_A.8.27
    pillar: "Technological controls (A.8)"
    title: "Secure system architecture and engineering principles"
    description: >-
      Principles for engineering secure systems shall be established,
      documented, maintained, and applied to any information system
      implementation efforts. Security architecture shall be reviewed
      and validated against known threat models.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.27"
      - "ISO/IEC 27002:2022 §8.27"

  - id: ISO_27001_A.8.28
    pillar: "Technological controls (A.8)"
    title: "Secure coding"
    description: >-
      Secure coding principles shall be applied to software development
      within the organisation. Secure coding standards, training, and
      tooling (SAST, SCA) shall be used to prevent the introduction of
      known vulnerability classes.
    introduced: "ISO27001:2022"
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.28"
      - "ISO/IEC 27002:2022 §8.28"

  - id: ISO_27001_A.8.29
    pillar: "Technological controls (A.8)"
    title: "Security testing in development and acceptance"
    description: >-
      Security testing processes shall be defined and implemented in
      the development life cycle. Acceptance testing shall validate
      security requirements, and test results shall be documented and
      reviewed before production deployment.
    severity_default: high
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.29"
      - "ISO/IEC 27002:2022 §8.29"

  - id: ISO_27001_A.8.30
    pillar: "Technological controls (A.8)"
    title: "Outsourced development"
    description: >-
      The organisation shall direct, monitor, and review the activities
      relating to outsourced system development. Suppliers performing
      development work shall meet the organisation's security
      requirements and development standards.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.30"
      - "ISO/IEC 27002:2022 §8.30"

  - id: ISO_27001_A.8.31
    pillar: "Technological controls (A.8)"
    title: "Separation of development, test and production environments"
    description: >-
      Development, testing, and operational environments shall be
      separated and access between them controlled. Sensitive production
      data shall not be used in development or test environments without
      appropriate masking.
    severity_default: high
    evidence_basis:
      - signal_prefix: TF
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.31"
      - "ISO/IEC 27002:2022 §8.31"

  - id: ISO_27001_A.8.32
    pillar: "Technological controls (A.8)"
    title: "Change management"
    description: >-
      Changes to information processing facilities and information
      systems shall be subject to change management procedures.
      Changes shall be evaluated for security impact, tested, and
      approved before implementation.
    severity_default: high
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.8.32"
      - "ISO/IEC 27002:2022 §8.32"

  - id: ISO_27001_A.8.33
    pillar: "Technological controls (A.8)"
    title: "Test information"
    description: >-
      Test information shall be appropriately selected, protected, and
      managed. Operational information used for testing shall be
      protected with controls equivalent to those applied in the
      production environment.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "ISO/IEC 27001:2022 Annex A.8.33"
      - "ISO/IEC 27002:2022 §8.33"

  - id: ISO_27001_A.8.34
    pillar: "Technological controls (A.8)"
    title: "Protection of information systems during audit testing"
    description: >-
      Audit tests and other assurance activities involving assessment of
      operational systems shall be planned and agreed between the assessor
      and appropriate management to minimise disruptions to business
      processes and prevent unintended access or modification.
    severity_default: medium
    evidence_basis:
      - context_input: ops_runbooks
    references:
      - "ISO/IEC 27001:2022 Annex A.8.34"
      - "ISO/IEC 27002:2022 §8.34"
