# SWAO community framework metadata (design 029 §2.3 + §11)
# Sprint-039 #0358 Phase 1 migration from the standard-scope PoC stub at
# `swao/controls/standard/iso-27001-controls.yaml`. Thin packaging --
# control set preserved verbatim from the stub (same 5 controls); only
# the wrapper graduates to design-029 community shape. Catalogue depth
# can grow in a future sprint without another wrapper migration.

framework:
  id: ISO_27001
  name: "Information Security Management"
  version: "2022"
  authority: "International Organization for Standardization"
  contributor:
    name: "Accenture SWAO team (community packaging)"
    url: "https://accenture.example/swao/community-frameworks/iso-27001"
  applicability_hints:
    - enterprise
    - ism
    - broad_coverage
  assessment_type_scope: [app, aud]
  description: >-
    International standard for Information Security Management Systems (ISMS). The 2022 revision restructured Annex A into 93 controls across four themes: organisational, people, physical, technological.
  references:
    - "ISO/IEC 27001:2022"
    - "ISO/IEC 27002:2022 (controls reference)"
  catalogue_version: "0.1.0"
  last_reviewed: "2026-05-24"
