control_id: BSI_CON2_A1
framework_id: BSI_GRUNDSCHUTZ_2023
collected_at: 2026-07-07
collected_by: consultant

# Aggregator (design 029 §3.4): any "no" at the control severity (high)
# -> GAP; mix of "yes" + "n/a" -> SATISFIED; any "unknown" -> PARTIAL.

questions:
  - id: q1
    text: "Are all staff who handle personal data formally committed to data protection obligations (signed commitment, NDA, or equivalent on file)?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "Employment contracts include data protection clause; contractor NDAs on file"
  - id: q2
    text: "Has a data protection officer been appointed (or is non-appointment formally documented with justification)?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "DPO appointed 2025-03; processes health data qualifying as special-category under GDPR Art. 9"
  - id: q3
    text: "Is the DPO's independence from operational IT management formally confirmed (separate reporting line or documented independence statement)?"
    answer: "unknown"
    severity_if_no: high
    evidence_ref: "DPO reports to General Counsel; relationship to CTO not formally documented"
  - id: q4
    text: "Has the data protection policy been communicated to all staff handling personal data, with acknowledgement recorded?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "Annual data protection briefing; completion tracked in HR system"
  - id: q5
    text: "Do contractor and third-party staff handling personal data sign data protection commitments equivalent to those for employees?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "Contractor MSA includes data protection obligations clause; verified for active contractors"
