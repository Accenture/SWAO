# SWAO community framework metadata (design 029 §2.3 + §11)
#
# SAMA Cyber Security Framework v1.0 (2017) -- mandatory for all SAMA-supervised
# entities in the Saudi Arabian financial sector. This catalogue models 30
# domain-area controls across the 5 SAMA CSF domains. Maturity model: 6 levels
# (Level 0 Incomplete to Level 5 Optimising); regulatory minimum is Level 3
# (Defined) across all domains.
#
# Source: Saudi Arabian Monetary Authority (SAMA), Document No. 381000091275.
# PDF available at: https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx
# Research provenance: docs/custom-frameworks/_research/saudi-arabia-regulatory-frameworks.md

framework:
  id: SAMA_CSF
  name: "Saudi Arabian Monetary Authority -- Cyber Security Framework v1.0"
  version: "CSF v1.0 -- issued by SAMA, first published 2017; current as of 2026"
  authority: "Saudi Arabian Monetary Authority (SAMA)"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
  applicability_hints:
    - ksa_financial_sector
    - ksa_regulated_entity
    - banking
    - insurance
    - finance_company
  assessment_type_scope: [app, aud]
  description: >
    SAMA Cyber Security Framework (CSF) v1.0, the mandatory cybersecurity
    framework for Saudi Arabian financial sector entities regulated by SAMA.
    Covers banks, insurance companies, finance companies, payment providers,
    and other SAMA-regulated entities. Uses a 6-level process maturity model
    (Level 0 Incomplete to Level 5 Optimising); the regulatory minimum is
    Level 3 (Defined) across all 5 domains. This SWAO catalogue covers all
    5 domains with ~30 domain-area controls derived from the framework's
    subdomain structure. See research-notes.md for sourcing details.
  references:
    - "https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx"
    - "docs/custom-frameworks/_research/saudi-arabia-regulatory-frameworks.md"
  catalogue_version: "1.0.0"
  last_reviewed: "2026-07-18"

  # Signal prefix -- emitted local signals use this as their namespace.
  # 8-char prefix fits within the design 029 §13 advisory band (3-8 chars).
  signal_prefix: SAMA_CSF

  # Cross-mapping hints for the LLM-augmented heatmap matcher.
  # SAMA CSF itself explicitly cites ISO/IEC 27001, NIST CSF, PCI DSS,
  # COBIT 5, and Basel III as its reference frameworks.
  cross_mapping_hints:
    target_frameworks:
      - NCA_ECC           # KSA national cybersecurity baseline (dual obligation for CNI banks)
      - ISO_27001         # ISO/IEC 27001:2022 -- cited within SAMA CSF
      - NIST_CSF          # NIST Cybersecurity Framework -- cited within SAMA CSF
      - COBIT_5           # ISACA COBIT 5 -- cited within SAMA CSF
      - PCI_DSS           # PCI DSS -- cited within SAMA CSF
      - SOC_2             # Trust Services Criteria -- operational overlap

  # Native rating scale: SAMA CSF uses a 6-level process maturity model
  # aligned with ISO/IEC 15504 (Process Capability Assessment). Level 3
  # (Defined) is the regulatory minimum across all 5 domains. SWAO maps
  # any domain below Level 3 to BLOCKED.
  rating_scale:
    type: maturity
    levels:
      0: "Incomplete -- process not implemented or fails to achieve its purpose"
      1: "Initial -- process implemented but not managed"
      2: "Managed -- process planned, monitored, and adjusted"
      3: "Defined -- process tailored from organisation-wide standard (REGULATORY MINIMUM)"
      4: "Quantitatively Managed -- process controlled using statistical methods"
      5: "Optimising -- continuous improvement of process performance"
    regulatory_minimum_level: 3

  redistribution_note: >
    The SAMA Cyber Security Framework is issued by the Saudi Arabian Monetary
    Authority. Control descriptions in this catalogue paraphrase the official
    framework text for SWAO ingestion. Verify against the official SAMA
    publication at https://www.sama.gov.sa/en-US/RulesInstructions/BankingRules/Pages/CyberSecurityFramework.aspx
