questions:
  - id: q1
    text: "Is the erasure procedure documented end-to-end across production stores, search indexes, caches, backups and downstream pipelines?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "RUNBOOK-ERASURE-001 v2.3"
  - id: q2
    text: "Is the erasure procedure rehearsed against a sample data subject at least annually?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "Erasure-drill log 2026-03"
  - id: q3
    text: "Is the measured time-to-delete within the one-month Art 12(3) SLA?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "Erasure-drill 2026-03 median 9 days; P99 21 days"
  - id: q4
    text: "Where erasure is refused on one of the Art 17(3) exceptions (legal claims, public interest, freedom of expression, archiving, legal obligation), is the refusal documented to the data subject with the reason?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "Refusal-template v1.2"
  - id: q5
    text: "Where data have been made public (Art 17(2)), are reasonable steps taken to inform other controllers processing the data?"
    answer: "n/a"
    severity_if_no: medium
    evidence_ref: "Workload does not publish personal data"
  - id: q6
    text: "Are downstream copies in vector stores / RAG corpora / training datasets included in the erasure scope?"
    answer: "unknown"
    severity_if_no: high
    evidence_ref: "Pending design review; tracker AI-ERASE-2026-005"
