control_id: GDPR_Art_7
framework_id: GDPR
collected_at: 2026-05-22
collected_by: consultant

# Aggregator (design 029 §3.4): any "no" at the control severity (critical)
# -> GAP; mix of "yes" + "n/a" -> SATISFIED; any "unknown" -> PARTIAL.

questions:
  - id: q1
    text: "Where consent is the lawful basis, is the consent capture opt-in (no pre-ticked boxes; no bundled consent)?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "Consent UI flows v3.1; screenshot bundle EVD-CONSENT-001"
  - id: q2
    text: "Can the controller demonstrate (per Art 7(1)) that each data subject has consented? (Consent records retained + linked to the data subject.)"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "Consent ledger schema in `governance/consent-ledger.yaml`"
  - id: q3
    text: "Is the consent request presented in clear and plain language, distinguishable from other matters (Art 7(2))?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "Consent UI flows reviewed by legal 2026-04-12"
  - id: q4
    text: "Is consent withdrawal as easy as giving consent (Art 7(3))?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "One-click unsubscribe + self-service consent dashboard"
  - id: q5
    text: "Is performance of any contract conditional on consent that is not necessary for the contract (Art 7(4))?"
    answer: "no"
    severity_if_no: high
    evidence_ref: "Legal review 2026-04-12 -- no bundled consent in any user journey"
  - id: q6
    text: "For children below the Member-State age (Art 8), is parental authorisation verified before processing?"
    answer: "n/a"
    severity_if_no: high
    evidence_ref: "Workload not directed at children; age-gate at signup"
