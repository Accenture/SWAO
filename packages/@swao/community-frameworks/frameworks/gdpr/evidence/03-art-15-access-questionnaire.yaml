control_id: GDPR_Art_15
framework_id: GDPR
collected_at: 2026-05-22
collected_by: consultant

# Aggregator (design 029 §3.4): any "no" at the control severity (critical)
# -> GAP; mix of "yes" + "n/a" -> SATISFIED; any "unknown" -> PARTIAL.

questions:
  - id: q1
    text: "Is there a documented data-subject-access-request (DSAR) workflow?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "RUNBOOK-DSAR-001 (privacy wiki)"
  - id: q2
    text: "Does the response confirm whether or not personal data are being processed?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "DSAR template section 2"
  - id: q3
    text: "Does the response carry every Art 15(1)(a)-(h) element (purposes, categories, recipients, retention, rights, complaint, source, automated decision-making)?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "DSAR template section 3; sample EVD-DSAR-2026-042"
  - id: q4
    text: "Is the first copy provided free of charge (Art 15(3))?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "DSAR pricing policy v2.0"
  - id: q5
    text: "Is the response delivered within one month of receipt (Art 12(3))?"
    answer: "yes"
    severity_if_no: critical
    evidence_ref: "DSAR SLA dashboard 2025 avg 14 days"
  - id: q6
    text: "Where complexity warrants a two-month extension (Art 12(3)), is the data subject informed within the first month?"
    answer: "yes"
    severity_if_no: high
    evidence_ref: "DSAR template extension-notification email"
  - id: q7
    text: "Is identity verification proportionate (not excessively burdensome) (Recital 64)?"
    answer: "yes"
    severity_if_no: medium
    evidence_ref: "ID-verification policy v3.0 (signed-in user: account session; signed-out: government ID + selfie)"
