controls:
  # ======================================================================
  # Chapter II -- Principles (Articles 5-11)
  # ======================================================================
  - id: GDPR_Art_5_1_a
    pillar: "Chapter II -- Principles"
    title: "Lawfulness, fairness and transparency (Art 5(1)(a))"
    description: >-
      Personal data shall be processed lawfully, fairly and in a transparent
      manner in relation to the data subject. Recital 39: any information
      addressed to the public or to the data subject shall be concise, easily
      accessible and easy to understand. Operationalised together with Art 6
      (lawful basis) and Art 12-14 (information to data subjects).
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-5-1-a-lawfulness-fairness-transparency.md" }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.5.34, SOC_2_P1.1, AI10P-DAT-01]
    remediation: "Document the lawful basis for each processing operation; publish privacy notices in plain language; remove covert tracking."
    # Sprint-038 #0348: hybrid tag taxonomy per the operator decision.
    # Per-framework `axis.value` form for regulation-shaped filtering;
    # universal `applies-to.*` set for cross-framework data-class queries.
    # GDPR axes: obligation (principle/right/controller/processor/dpo),
    # actor (controller-only/processor-only/controller-and-processor/dpo),
    # scope (domestic-only/cross-border-applies/chapter-v-transfer).

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_5_1_b
    pillar: "Chapter II -- Principles"
    title: "Purpose limitation (Art 5(1)(b))"
    description: >-
      Personal data shall be collected for specified, explicit and legitimate
      purposes and not further processed in a manner incompatible with those
      purposes. Further processing for archiving in the public interest,
      scientific or historical research, or statistical purposes is not
      considered incompatible (Recital 50).
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-5-1-b-purpose-limitation.md" }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.5.33, SOC_2_P1.1]
    remediation: "Maintain a purpose registry; gate cross-purpose reuse through DPO review."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_5_1_c
    pillar: "Chapter II -- Principles"
    title: "Data minimisation (Art 5(1)(c))"
    description: >-
      Personal data shall be adequate, relevant and limited to what is
      necessary in relation to the purposes for which they are processed
      (Recital 39). On review, any field collected but unused at the purpose
      level is justified or dropped.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-5-1-c-data-minimisation.md" }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.5.34, SOC_2_C1.1, AI10P-DAT-02]
    remediation: "Audit collected fields against the purpose registry; drop unused attributes; design new collection minimal-first."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_5_1_d
    pillar: "Chapter II -- Principles"
    title: "Accuracy (Art 5(1)(d))"
    description: >-
      Personal data shall be accurate and, where necessary, kept up to date;
      every reasonable step must be taken to ensure that personal data that
      are inaccurate are erased or rectified without delay. Operationalised
      together with the data subject's Art 16 right to rectification.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/02-art-5-1-d-accuracy-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.8.10, SOC_2_PI1.4]
    remediation: "Wire a self-service rectification flow; instrument data-quality metrics; reconcile against source systems."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_5_1_e
    pillar: "Chapter II -- Principles"
    title: "Storage limitation (Art 5(1)(e))"
    description: >-
      Personal data shall be kept in a form which permits identification of
      data subjects for no longer than is necessary for the purposes for
      which the personal data are processed. Longer storage permitted only
      for archiving / research / statistical purposes subject to Art 89
      safeguards (Recital 39).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/02-art-5-1-e-storage-limitation.md" }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.5.33, ISO_27001_A.8.10]
    remediation: "Define and enforce retention schedules per purpose; automate purge / pseudonymisation at TTL."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_5_1_f
    pillar: "Chapter II -- Principles"
    title: "Integrity and confidentiality (security principle) (Art 5(1)(f))"
    description: >-
      Personal data shall be processed in a manner that ensures appropriate
      security, including protection against unauthorised or unlawful
      processing and against accidental loss, destruction or damage, using
      appropriate technical or organisational measures (Recital 39).
      Operationalised in Art 32 (security of processing); the principle
      itself is an Art 83(5) Tier-1 fineable obligation.
    severity_default: critical
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: ["https://gdpr-info.eu/art-5-gdpr/"]
    overrides: [GDPR_Art_5]
    maps_to: [ISO_27001_A.5.10, ISO_27001_A.8.24, SOC_2_CC6.1, AI10P-DAT-01]
    remediation: "Trace evidence to Art 32 sub-controls; close any technical-control gap surfaced in Art 32 family."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_6
    pillar: "Chapter II -- Principles"
    title: "Lawfulness of processing -- six lawful bases (Art 6)"
    description: >-
      Processing shall be lawful only if and to the extent that at least one
      of: (a) consent of the data subject; (b) performance of a contract;
      (c) compliance with a legal obligation; (d) protection of vital
      interests; (e) performance of a task in the public interest or
      exercise of official authority; (f) legitimate interests pursued by
      the controller (subject to balancing against the rights and freedoms
      of the data subject -- not available to public authorities in the
      performance of their tasks). Recital 47 elaborates the legitimate-
      interests balancing test.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-6-lawful-basis.md" }
    references: ["https://gdpr-info.eu/art-6-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, HIPAA_164.502]
    remediation: "For each processing purpose record the chosen lawful basis; for (f) record the balancing test (LIA)."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_7
    pillar: "Chapter II -- Principles"
    title: "Conditions for consent (Art 7)"
    description: >-
      Where processing is based on consent, the controller shall be able to
      demonstrate that the data subject has consented (1); consent shall be
      presented in an intelligible and easily accessible form using clear
      and plain language (2); the data subject shall have the right to
      withdraw consent at any time and withdrawal shall be as easy as giving
      consent (3); when assessing whether consent is freely given, account
      shall be taken of whether performance of a contract is conditional on
      consent that is not necessary for the contract (4). Recitals 32 / 42 /
      43 elaborate.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/02-art-7-consent-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-7-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, AI10P-DAT-01]
    remediation: "Implement opt-in consent capture (no pre-ticked boxes); store consent records; expose easy withdrawal."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_8
    pillar: "Chapter II -- Principles"
    title: "Conditions applicable to child's consent in relation to information society services (Art 8)"
    description: >-
      Where information society services are offered directly to a child and
      Art 6(1)(a) consent is the lawful basis, processing shall be lawful
      where the child is at least 16 years old (Member States may lower to
      not below 13). For children below the applicable age, processing is
      lawful only if and to the extent that consent is given or authorised
      by the holder of parental responsibility. Recital 38.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/02-art-8-children-consent.md" }
    references: ["https://gdpr-info.eu/art-8-gdpr/"]
    overrides: []
    maps_to: [COPPA_312, ISO_27001_A.5.34]
    remediation: "Implement age-gating at the consent boundary; verify parental authorisation for under-age users in scope."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_9
    pillar: "Chapter II -- Principles"
    title: "Processing of special categories of personal data (Art 9)"
    description: >-
      Processing of personal data revealing racial or ethnic origin,
      political opinions, religious or philosophical beliefs, or trade-union
      membership, and the processing of genetic data, biometric data for
      the purpose of uniquely identifying a natural person, data concerning
      health, sex life or sexual orientation, shall be prohibited (1) unless
      one of ten specific exceptions in (2) applies. Recitals 51-56.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-9-special-categories.md" }
    references: ["https://gdpr-info.eu/art-9-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.12, ISO_27001_A.8.24, HIPAA_164.514, AI10P-DAT-02]
    remediation: "Map every special-category processing to the chosen Art 9(2) exception; tighten access controls and encryption at rest beyond the baseline."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_10
    pillar: "Chapter II -- Principles"
    title: "Processing of personal data relating to criminal convictions and offences (Art 10)"
    description: >-
      Processing of personal data relating to criminal convictions and
      offences or related security measures shall be carried out only under
      the control of official authority or when authorised by Union or
      Member State law providing for appropriate safeguards. Any
      comprehensive register of criminal convictions shall be kept only
      under the control of official authority.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/02-art-10-criminal-data.md" }
    references: ["https://gdpr-info.eu/art-10-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.12, HIPAA_164.514]
    remediation: "Confirm legal authorisation before any criminal-conviction processing; restrict access to a defined need-to-know set."

    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_11
    pillar: "Chapter II -- Principles"
    title: "Processing which does not require identification (Art 11)"
    description: >-
      If the purposes for which a controller processes personal data do not
      or do no longer require the identification of a data subject, the
      controller shall not be obliged to maintain, acquire or process
      additional information to identify the data subject. Where the
      controller is able to demonstrate that it is not in a position to
      identify the data subject, Articles 15-20 shall not apply unless the
      data subject provides additional information enabling identification.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/02-art-11-no-identification.md" }
    references: ["https://gdpr-info.eu/art-11-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Where re-identification is not required, document the design; refuse Art 15-20 requests with the documented rationale."

  # ======================================================================
  # Chapter III -- Rights of the data subject (Articles 12-23)
  # ======================================================================
    tags:
      - "applies-to.pii"
      - "obligation.principle"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_12
    pillar: "Chapter III -- Data Subject Rights"
    title: "Transparent information, communication and modalities (Art 12)"
    description: >-
      The controller shall provide information on processing and on the
      rights of the data subject (Articles 13-22 and 34) in a concise,
      transparent, intelligible and easily accessible form, using clear and
      plain language, in particular for any information addressed
      specifically to a child. Information shall be provided in writing or
      by other means and free of charge. Action on a request shall be
      without undue delay and in any event within one month of receipt
      (extendable by two further months given complexity).
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/03-art-12-transparency.md" }
    references: ["https://gdpr-info.eu/art-12-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, SOC_2_P5.1]
    remediation: "Publish a privacy notice in plain language; implement a 30-day-SLA data-subject-rights inbox."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_13
    pillar: "Chapter III -- Data Subject Rights"
    title: "Information to be provided where personal data are collected from the data subject (Art 13)"
    description: >-
      Where personal data are collected from the data subject, the
      controller shall, at the time the data are obtained, provide: identity
      and contact details of the controller / representative / DPO; purposes
      of processing and the lawful basis; recipients or categories of
      recipients; intent to transfer to a third country and the safeguards
      (Art 46); retention period; the data subject's rights (Art 15-22);
      right to lodge a complaint with a supervisory authority; whether
      provision is a statutory / contractual requirement; existence of
      automated decision-making including profiling (Art 22) and
      meaningful information about the logic involved.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/03-art-13-notice-direct.md" }
    references: ["https://gdpr-info.eu/art-13-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, SOC_2_P1.1]
    remediation: "Author and version a privacy notice carrying every Art 13 element; serve it at collection touchpoints."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_14
    pillar: "Chapter III -- Data Subject Rights"
    title: "Information to be provided where personal data have not been obtained from the data subject (Art 14)"
    description: >-
      Where personal data are not obtained from the data subject, the
      controller shall provide the same set of information as Art 13 within
      a reasonable period after obtaining the data and in any event at the
      latest within one month, or if disclosed to a recipient at the latest
      when first disclosed, or if disclosed to the data subject at first
      communication. Exceptions: data subject already has the information;
      provision impossible or disproportionate effort; obtaining /
      disclosure expressly laid down by Union / Member State law;
      professional-secrecy obligations.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/03-art-14-notice-indirect.md" }
    references: ["https://gdpr-info.eu/art-14-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34]
    remediation: "For each indirect-collection source (broker, public register, partner), draft and serve the Art 14 notice within the timescale."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_15
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right of access by the data subject (Art 15)"
    description: >-
      The data subject shall have the right to obtain from the controller
      confirmation as to whether or not personal data concerning him or her
      are being processed, and where that is the case, access to the
      personal data and the following information: purposes; categories of
      data; recipients or categories of recipients; retention period; rights
      of rectification / erasure / restriction / objection; right to lodge
      a complaint; source of data where not collected directly; existence
      of automated decision-making (Art 22) and meaningful information
      about the logic. A copy of the data shall be provided free of charge
      for the first copy.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/03-art-15-access-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-15-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, SOC_2_C1.1]
    remediation: "Stand up a self-service access portal or a documented manual workflow with the 30-day SLA; verify the format covers every Art 15(1)(a)-(h) element."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_16
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right to rectification (Art 16)"
    description: >-
      The data subject shall have the right to obtain from the controller
      without undue delay the rectification of inaccurate personal data
      concerning him or her. Taking into account the purposes of the
      processing, the data subject shall have the right to have incomplete
      personal data completed, including by means of providing a
      supplementary statement.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/03-art-16-rectification-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-16-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.8.10]
    remediation: "Wire a self-service rectification flow tied to the access portal; propagate corrections to recipients per Art 19."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_17
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right to erasure ('right to be forgotten') (Art 17)"
    description: >-
      The data subject shall have the right to obtain from the controller
      the erasure of personal data concerning him or her without undue
      delay, and the controller shall have the obligation to erase, where
      one of the following applies: data no longer necessary for the
      purpose; consent withdrawn and no other legal ground; objection
      upheld; data unlawfully processed; legal obligation to erase; data
      collected from a child for information society services. Where the
      controller has made the data public, taking account of available
      technology and cost, it shall take reasonable steps including
      technical measures to inform other controllers processing the data.
      Exceptions: freedom of expression, legal obligation, public interest
      in the area of public health, archiving / research / statistical
      purposes, legal claims.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/03-art-17-erasure-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-17-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.8.10, AI10P-DAT-02]
    remediation: "Document the erasure procedure end-to-end (production stores, backups, downstream pipelines); rehearse it; measure achieved time-to-delete."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_18
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right to restriction of processing (Art 18)"
    description: >-
      The data subject shall have the right to obtain restriction of
      processing where one of the following applies: accuracy is contested;
      processing is unlawful and the data subject opposes erasure
      preferring restriction; the controller no longer needs the data but
      the data subject requires them for legal claims; the data subject
      has objected pursuant to Art 21(1) pending verification of overriding
      legitimate grounds. Restricted data may only be processed (apart from
      storage) with consent, for legal claims, for protection of rights of
      another person, or for important public interest.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/03-art-18-restriction.md" }
    references: ["https://gdpr-info.eu/art-18-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.8.10]
    remediation: "Implement a 'restricted' state on records (soft-delete + processing flag) and respect it in every read path."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_19
    pillar: "Chapter III -- Data Subject Rights"
    title: "Notification obligation regarding rectification, erasure or restriction (Art 19)"
    description: >-
      The controller shall communicate any rectification or erasure of
      personal data or restriction of processing carried out in accordance
      with Articles 16, 17(1) and 18 to each recipient to whom the personal
      data have been disclosed, unless this proves impossible or involves
      disproportionate effort. The controller shall inform the data
      subject about those recipients if the data subject requests it.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/03-art-19-third-party-propagation.md" }
    references: ["https://gdpr-info.eu/art-19-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.19]
    remediation: "Maintain the recipient register (linked to Art 30 ROPA); pipe rectification / erasure / restriction events to each recipient."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_20
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right to data portability (Art 20)"
    description: >-
      The data subject shall have the right to receive the personal data
      concerning him or her which he or she has provided to a controller,
      in a structured, commonly used and machine-readable format, and have
      the right to transmit those data to another controller where the
      processing is based on consent (Art 6(1)(a) or Art 9(2)(a)) or on a
      contract (Art 6(1)(b)) and the processing is carried out by
      automated means. Where technically feasible the data subject shall
      have the right to have the personal data transmitted directly from
      one controller to another.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/03-art-20-portability-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-20-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.8.10, AI10P-DAT-02]
    remediation: "Expose an export endpoint producing JSON / CSV for in-scope data; document the data dictionary; benchmark the export time."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_21
    pillar: "Chapter III -- Data Subject Rights"
    title: "Right to object (Art 21)"
    description: >-
      The data subject shall have the right to object on grounds relating
      to his or her particular situation at any time to processing based
      on Art 6(1)(e) or Art 6(1)(f), including profiling based on those
      provisions. The controller shall no longer process the data unless
      it demonstrates compelling legitimate grounds which override the
      interests, rights and freedoms of the data subject, or for the
      establishment, exercise or defence of legal claims. Where personal
      data are processed for direct marketing, the data subject shall have
      the right to object at any time, including profiling -- and after
      objection the data shall not be processed for that purpose.
    severity_default: critical
    evidence_basis:
      - { manual_questionnaire: "evidence/03-art-21-objection-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-21-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, AI10P-OUT-01]
    remediation: "Stand up an objection workflow; for direct-marketing expose a one-click opt-out and honour it across all channels."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_22
    pillar: "Chapter III -- Data Subject Rights"
    title: "Automated individual decision-making, including profiling (Art 22)"
    description: >-
      The data subject shall have the right not to be subject to a decision
      based solely on automated processing, including profiling, which
      produces legal effects concerning him or her or similarly
      significantly affects him or her. Exceptions: (a) necessary for
      entering into or performance of a contract; (b) authorised by Union
      or Member State law providing suitable safeguards; (c) based on
      explicit consent. In cases (a) and (c) the controller shall
      implement suitable measures to safeguard rights and freedoms, at
      least the right to obtain human intervention on the part of the
      controller, to express his or her point of view and to contest the
      decision.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/03-art-22-automated-decisions.md" }
    references: ["https://gdpr-info.eu/art-22-gdpr/"]
    overrides: []
    maps_to: [EU_AI_ACT_Art_14, AI10P-GOV-01, ISO_42001_A.6.3]
    remediation: "Identify every solely-automated decision; either remove it from scope, secure explicit consent, or wire a human-in-the-loop with overturn authority."

    tags:
      - "applies-to.pii"
      - "obligation.right"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_23
    pillar: "Chapter III -- Data Subject Rights"
    title: "Restrictions (Art 23)"
    description: >-
      Union or Member State law may restrict by way of legislative measure
      the scope of the obligations and rights provided for in Articles 12
      to 22 and Art 34, as well as Art 5 in so far as its provisions
      correspond to the rights and obligations provided for in Articles 12
      to 22, when such a restriction respects the essence of the
      fundamental rights and freedoms and is a necessary and proportionate
      measure in a democratic society to safeguard one of ten enumerated
      public interests (national security, defence, public security,
      criminal-offence prevention, etc.).
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/03-art-23-restrictions.md" }
    references: ["https://gdpr-info.eu/art-23-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Identify the specific restricting law for the workload's jurisdiction; document where Art 12-22 rights are constrained and why."

  # ======================================================================
  # Chapter IV -- Controller and Processor (Articles 24-43)
  # ======================================================================
    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_24
    pillar: "Chapter IV -- Controller and Processor"
    title: "Responsibility of the controller (Art 24)"
    description: >-
      Taking into account the nature, scope, context and purposes of
      processing as well as the risks of varying likelihood and severity,
      the controller shall implement appropriate technical and
      organisational measures to ensure and to be able to demonstrate that
      processing is performed in accordance with this Regulation. Those
      measures shall be reviewed and updated where necessary. Where
      proportionate, those measures shall include appropriate data
      protection policies. Adherence to approved codes of conduct (Art 40)
      or approved certification mechanisms (Art 42) may be used as an
      element to demonstrate compliance.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-24-controller-responsibility.md" }
    references: ["https://gdpr-info.eu/art-24-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.1, SOC_2_CC1.4]
    remediation: "Publish the controller's data-protection policy; map each policy clause to the operational control evidencing it."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_25
    pillar: "Chapter IV -- Controller and Processor"
    title: "Data protection by design and by default (Art 25)"
    description: >-
      Taking into account the state of the art, the cost of implementation
      and the nature, scope, context and purposes of processing, as well
      as the risks of varying likelihood and severity, the controller
      shall, both at the time of the determination of the means for
      processing and at the time of the processing itself, implement
      appropriate technical and organisational measures (e.g.
      pseudonymisation) designed to implement data-protection principles
      effectively. The controller shall implement appropriate measures to
      ensure that, by default, only personal data necessary for each
      specific purpose are processed -- in terms of the amount collected,
      the extent of processing, the period of storage and accessibility --
      and shall ensure that by default personal data are not made
      accessible without the individual's intervention to an indefinite
      number of natural persons.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-25-privacy-by-design.md" }
    references: ["https://gdpr-info.eu/art-25-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.8.27, AI10P-DAT-02, AI10P-DAT-01]
    remediation: "Adopt privacy-by-design templates for new services; default-off for non-essential collection; default-private for sharing."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_26
    pillar: "Chapter IV -- Controller and Processor"
    title: "Joint controllers (Art 26)"
    description: >-
      Where two or more controllers jointly determine the purposes and
      means of processing, they shall be joint controllers. They shall in
      a transparent manner determine their respective responsibilities for
      compliance, in particular as regards the exercising of the rights of
      the data subject and their respective duties to provide the
      information referred to in Art 13 and 14, by means of an arrangement
      between them. The essence of the arrangement shall be made available
      to the data subject. Irrespective of the terms of the arrangement,
      the data subject may exercise rights under this Regulation in
      respect of and against each controller.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-26-joint-controllers.md" }
    references: ["https://gdpr-info.eu/art-26-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.19]
    remediation: "Identify joint controllers in scope; execute a joint-controller arrangement; publish the essence to data subjects."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_27
    pillar: "Chapter IV -- Controller and Processor"
    title: "Representatives of controllers / processors not established in the Union (Art 27)"
    description: >-
      Where Art 3(2) applies, the controller or processor shall designate
      in writing a representative in the Union. The obligation does not
      apply to processing which is occasional, does not include large-
      scale processing of special categories (Art 9) or criminal-conviction
      data (Art 10), and is unlikely to result in a risk to rights and
      freedoms; nor to public authorities. The representative shall be
      established in one of the Member States where the data subjects are.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-27-representative-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-27-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "If the controller / processor is outside the Union and Art 3(2) applies, appoint and document the EU representative."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_28
    pillar: "Chapter IV -- Controller and Processor"
    title: "Processor (Art 28)"
    description: >-
      The controller shall use only processors providing sufficient
      guarantees to implement appropriate technical and organisational
      measures. Processing by a processor shall be governed by a contract
      that sets out the subject matter, duration, nature and purpose of
      processing, the type of personal data and categories of data
      subjects, and the obligations and rights of the controller. The
      contract shall stipulate that the processor: processes only on
      documented instructions; ensures persons authorised to process are
      subject to confidentiality; takes all measures required pursuant to
      Art 32; respects conditions for engaging another processor; assists
      the controller with data-subject rights and with Art 32-36; deletes
      or returns personal data after the end of services; and makes
      available all information necessary to demonstrate compliance.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-28-processor-agreement.md" }
    references: ["https://gdpr-info.eu/art-28-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.19, ISO_27001_A.5.23, SOC_2_CC9.2, HIPAA_164.504]
    remediation: "For every processor in scope, execute a written Art 28 contract (DPA); verify the eight required clauses are present."

    tags:
      - "applies-to.pii"
      - "obligation.processor"
      - "actor.processor-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_29
    pillar: "Chapter IV -- Controller and Processor"
    title: "Processing under the authority of the controller or processor (Art 29)"
    description: >-
      The processor and any person acting under the authority of the
      controller or of the processor, who has access to personal data,
      shall not process those data except on instructions from the
      controller, unless required to do so by Union or Member State law.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-29-authority.md" }
    references: ["https://gdpr-info.eu/art-29-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.15, ISO_27001_A.6.6]
    remediation: "Document the instruction set the processor / staff operate under; audit any processing outside the documented set."

    tags:
      - "applies-to.pii"
      - "obligation.processor"
      - "actor.processor-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_30
    pillar: "Chapter IV -- Controller and Processor"
    title: "Records of processing activities (ROPA) (Art 30)"
    description: >-
      Each controller (and where applicable the representative) shall
      maintain a record of processing activities under its responsibility,
      containing: name and contact details of the controller (and joint
      controllers, representative, DPO); purposes; categories of data
      subjects and categories of personal data; categories of recipients
      including in third countries / international organisations;
      transfers to third countries / international organisations including
      identification of the country and the documented suitable
      safeguards; envisaged time limits for erasure; a general description
      of the technical and organisational security measures referred to
      in Art 32(1). Each processor shall maintain a record of all
      categories of processing activities carried out on behalf of a
      controller. The obligation does not apply to enterprises employing
      fewer than 250 persons unless the processing is likely to result in
      a risk to rights and freedoms, is not occasional, or includes
      special categories (Art 9) or criminal-conviction data (Art 10).
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-30-ropa.md" }
    references: ["https://gdpr-info.eu/art-30-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, SOC_2_CC2.1]
    remediation: "Author and maintain the controller ROPA and the processor ROPA; refresh on material change; expose to the supervisory authority on request."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_31
    pillar: "Chapter IV -- Controller and Processor"
    title: "Cooperation with the supervisory authority (Art 31)"
    description: >-
      The controller and the processor and, where applicable, their
      representatives, shall cooperate, on request, with the supervisory
      authority in the performance of its tasks.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-31-cooperation.md" }
    references: ["https://gdpr-info.eu/art-31-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Name the supervisory-authority point of contact; rehearse a cooperation drill annually."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_32_a
    pillar: "Chapter IV -- Controller and Processor"
    title: "Security of processing -- pseudonymisation and encryption (Art 32(1)(a))"
    description: >-
      Taking into account the state of the art, the costs of
      implementation and the nature, scope, context and purposes of
      processing as well as the risk of varying likelihood and severity
      for the rights and freedoms of natural persons, the controller and
      the processor shall implement appropriate technical and
      organisational measures to ensure a level of security appropriate to
      the risk, including inter alia as appropriate: the pseudonymisation
      and encryption of personal data.
    severity_default: high
    evidence_basis:
      - { signal_prefix: CRYPTO }
    references: ["https://gdpr-info.eu/art-32-gdpr/"]
    overrides: [GDPR_Art_32]
    maps_to: [ISO_27001_A.8.24, SOC_2_CC6.1, PCI_DSS_3.4, HIPAA_164.312_a_2_iv]
    remediation: "Encrypt personal data at rest and in transit with documented key management; apply pseudonymisation where the use case allows."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_32_b
    pillar: "Chapter IV -- Controller and Processor"
    title: "Security of processing -- ongoing confidentiality, integrity, availability and resilience (Art 32(1)(b))"
    description: >-
      The ability to ensure the ongoing confidentiality, integrity,
      availability and resilience of processing systems and services.
    severity_default: high
    evidence_basis:
      - { signal_prefix: IAM }
    references: ["https://gdpr-info.eu/art-32-gdpr/"]
    overrides: [GDPR_Art_32]
    maps_to: [ISO_27001_A.5.15, SOC_2_CC6.1, SOC_2_A1.2]
    remediation: "Maintain the CIA-triad controls evidenced by IAM, change-management, vulnerability-management and BCP / DR."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_32_c
    pillar: "Chapter IV -- Controller and Processor"
    title: "Security of processing -- restore availability after incident (Art 32(1)(c))"
    description: >-
      The ability to restore the availability and access to personal data
      in a timely manner in the event of a physical or technical incident.
    severity_default: high
    evidence_basis:
      - { signal_prefix: OBS }
    references: ["https://gdpr-info.eu/art-32-gdpr/"]
    overrides: [GDPR_Art_32]
    maps_to: [ISO_27001_A.5.30, SOC_2_A1.2]
    remediation: "Document and rehearse the RTO / RPO for personal-data systems; integrate with Art 33 / 34 breach response."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_32_d
    pillar: "Chapter IV -- Controller and Processor"
    title: "Security of processing -- regular testing and evaluation (Art 32(1)(d))"
    description: >-
      A process for regularly testing, assessing and evaluating the
      effectiveness of technical and organisational measures for ensuring
      the security of the processing.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-32-d-testing-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-32-gdpr/"]
    overrides: [GDPR_Art_32]
    maps_to: [ISO_27001_A.5.36, SOC_2_CC4.1]
    remediation: "Schedule annual pen-test / red-team and quarterly TVM cycle; track effectiveness metrics across the year."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_33
    pillar: "Chapter IV -- Controller and Processor"
    title: "Notification of a personal data breach to the supervisory authority (Art 33)"
    description: >-
      In the case of a personal data breach, the controller shall without
      undue delay and, where feasible, not later than 72 hours after
      having become aware of it, notify the personal data breach to the
      supervisory authority competent in accordance with Art 55, unless
      the personal data breach is unlikely to result in a risk to the
      rights and freedoms of natural persons. Where the notification is
      not made within 72 hours, it shall be accompanied by reasons for
      the delay. The processor shall notify the controller without undue
      delay after becoming aware of a personal data breach. The
      controller shall document any personal data breaches, comprising
      the facts, its effects and the remedial action taken.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-33-breach-notification-sa-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-33-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.24, ISO_27001_A.5.25, SOC_2_CC7.4]
    remediation: "Define and rehearse the breach-notification runbook with the 72-hour clock; capture every breach in the breach register."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_34
    pillar: "Chapter IV -- Controller and Processor"
    title: "Communication of a personal data breach to the data subject (Art 34)"
    description: >-
      When the personal data breach is likely to result in a high risk to
      the rights and freedoms of natural persons, the controller shall
      communicate the personal data breach to the data subject without
      undue delay. The communication shall describe the nature of the
      breach in clear and plain language. The communication shall not be
      required if: the controller has implemented appropriate measures
      (e.g. strong encryption) that render the data unintelligible; the
      controller has taken subsequent measures that ensure the high risk
      is no longer likely to materialise; or it would involve
      disproportionate effort (in which case a public communication or
      similar measure is required instead).
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-34-breach-communication-ds-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-34-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34]
    remediation: "Maintain the high-risk threshold criteria; draft a plain-language communication template; rehearse against scenarios."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_35_a
    pillar: "Chapter IV -- Controller and Processor"
    title: "DPIA -- when required (Art 35(1)-(4))"
    description: >-
      Where a type of processing in particular using new technologies, and
      taking into account the nature, scope, context and purposes of the
      processing, is likely to result in a high risk to the rights and
      freedoms of natural persons, the controller shall, prior to the
      processing, carry out an assessment of the impact. A DPIA shall be
      required in particular in cases of: (a) systematic and extensive
      evaluation of personal aspects based on automated processing
      including profiling on which decisions are based that produce legal
      effects or similarly significantly affect the natural person; (b)
      processing on a large scale of special categories (Art 9) or
      criminal-conviction data (Art 10); (c) systematic monitoring of a
      publicly accessible area on a large scale.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-35-a-dpia-threshold-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-35-gdpr/"]
    overrides: []
    maps_to: [EU_AI_ACT_Art_27, ISO_42001_A.6.2]
    remediation: "Run the DPIA-threshold checklist on every new processing operation; archive the determination either way."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_35_b
    pillar: "Chapter IV -- Controller and Processor"
    title: "DPIA -- content (Art 35(7))"
    description: >-
      The DPIA shall contain at least: (a) a systematic description of
      the envisaged processing operations and the purposes, including
      where applicable the legitimate interest pursued; (b) an assessment
      of the necessity and proportionality of the processing in relation
      to the purposes; (c) an assessment of the risks to the rights and
      freedoms of data subjects; (d) the measures envisaged to address
      the risks, including safeguards, security measures and mechanisms
      to ensure the protection of personal data and to demonstrate
      compliance.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-35-b-dpia-content.md" }
    references: ["https://gdpr-info.eu/art-35-gdpr/"]
    overrides: []
    maps_to: [EU_AI_ACT_Art_27, ISO_42001_A.6.2]
    remediation: "Adopt a DPIA template covering the four required content elements; review with the DPO before sign-off."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_35_c
    pillar: "Chapter IV -- Controller and Processor"
    title: "DPIA -- review (Art 35(11))"
    description: >-
      Where necessary, the controller shall carry out a review to assess
      if processing is performed in accordance with the data protection
      impact assessment, at least when there is a change of the risk
      represented by the processing operations.
    severity_default: medium
    evidence_basis:
      - { context_input: "evidence/04-art-35-c-dpia-review.md" }
    references: ["https://gdpr-info.eu/art-35-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Trigger a DPIA review on material change (new model, new region, new vendor); record the review outcome."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_36
    pillar: "Chapter IV -- Controller and Processor"
    title: "Prior consultation (Art 36)"
    description: >-
      The controller shall consult the supervisory authority prior to
      processing where a DPIA under Art 35 indicates that the processing
      would result in a high risk in the absence of measures taken by the
      controller to mitigate the risk. Where the supervisory authority is
      of the opinion that the intended processing would infringe this
      Regulation, in particular where the controller has insufficiently
      identified or mitigated the risk, the supervisory authority shall
      provide written advice to the controller within eight weeks
      (extendable by six weeks given complexity).
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-36-prior-consultation-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-36-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Define the residual-risk threshold for prior consultation; engage the supervisory authority at least 8 weeks before the go-live date."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-only"
      - "scope.cross-border-applies"
  - id: GDPR_Art_37
    pillar: "Chapter IV -- Controller and Processor"
    title: "Designation of the data protection officer (Art 37)"
    description: >-
      The controller and the processor shall designate a DPO in any case
      where: (a) processing is carried out by a public authority or body;
      (b) core activities consist of processing operations which, by
      virtue of their nature, scope and / or purposes, require regular
      and systematic monitoring of data subjects on a large scale; (c)
      core activities consist of processing on a large scale of special
      categories of data referred to in Art 9 and personal data relating
      to criminal convictions and offences referred to in Art 10. A group
      of undertakings may appoint a single DPO. The DPO shall be
      designated on the basis of professional qualities, in particular
      expert knowledge of data protection law and practices.
    severity_default: high
    evidence_basis:
      - { manual_questionnaire: "evidence/04-art-37-dpo-designation-questionnaire.yaml" }
    references: ["https://gdpr-info.eu/art-37-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.2, ISO_42001_A.5.4]
    remediation: "Apply the Art 37(1) decision tree; if DPO is required, designate, publish contact details and notify the supervisory authority."

    tags:
      - "applies-to.pii"
      - "obligation.dpo"
      - "actor.dpo"
      - "scope.cross-border-applies"
  - id: GDPR_Art_38
    pillar: "Chapter IV -- Controller and Processor"
    title: "Position of the data protection officer (Art 38)"
    description: >-
      The controller and processor shall ensure that the DPO is involved,
      properly and in a timely manner, in all issues which relate to the
      protection of personal data. The DPO shall be provided with the
      resources necessary to carry out the tasks. The DPO shall not be
      dismissed or penalised for performing the tasks; the DPO shall
      directly report to the highest management level. Data subjects may
      contact the DPO regarding all issues related to processing of their
      personal data. The DPO is bound by secrecy or confidentiality
      concerning the performance of the tasks.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-38-dpo-position.md" }
    references: ["https://gdpr-info.eu/art-38-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.2]
    remediation: "Publish the DPO reporting line; embed DPO sign-off in change-management for personal-data systems."

    tags:
      - "applies-to.pii"
      - "obligation.dpo"
      - "actor.dpo"
      - "scope.cross-border-applies"
  - id: GDPR_Art_39
    pillar: "Chapter IV -- Controller and Processor"
    title: "Tasks of the data protection officer (Art 39)"
    description: >-
      The DPO shall have at least the following tasks: (a) to inform and
      advise the controller / processor and the employees; (b) to monitor
      compliance with this Regulation, with other Union / Member State
      data protection provisions and with the policies of the controller
      / processor; (c) to provide advice where requested as regards the
      DPIA and monitor its performance; (d) to cooperate with the
      supervisory authority; (e) to act as the contact point for the
      supervisory authority. The DPO shall in the performance of his or
      her tasks have due regard to the risk associated with processing
      operations.
    severity_default: high
    evidence_basis:
      - { context_input: "evidence/04-art-39-dpo-tasks.md" }
    references: ["https://gdpr-info.eu/art-39-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Document the DPO's task plan; track monitoring activity volume as a leading indicator."

    tags:
      - "applies-to.pii"
      - "obligation.dpo"
      - "actor.dpo"
      - "scope.cross-border-applies"
  - id: GDPR_Art_40
    pillar: "Chapter IV -- Controller and Processor"
    title: "Codes of conduct (Art 40) -- informational"
    description: >-
      Member States, the supervisory authorities, the Board and the
      Commission shall encourage the drawing up of codes of conduct
      intended to contribute to the proper application of this
      Regulation. Adherence to an approved code may be used to
      demonstrate compliance with Art 24 / 25 / 28 / 32 / 35 obligations.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/04-art-40-codes-of-conduct.md" }
    references: ["https://gdpr-info.eu/art-40-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Where industry codes of conduct exist for the workload's sector, evaluate adherence as a demonstrate-compliance lever."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_42
    pillar: "Chapter IV -- Controller and Processor"
    title: "Certification (Art 42) -- informational"
    description: >-
      Member States, the supervisory authorities, the Board and the
      Commission shall encourage the establishment of data protection
      certification mechanisms and of data protection seals and marks,
      for the purpose of demonstrating compliance with this Regulation.
      Certification shall be voluntary and available via a process that
      is transparent. Certification shall be issued for a maximum period
      of three years and may be renewed.
    severity_default: low
    evidence_basis:
      - { context_input: "evidence/04-art-42-certification.md" }
    references: ["https://gdpr-info.eu/art-42-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Where a recognised certification is available, assess the cost / benefit case; record the decision."

  # ======================================================================
  # Chapter V -- Transfers of personal data to third countries or international organisations (Articles 44-49)
  # ======================================================================
    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.cross-border-applies"
  - id: GDPR_Art_44
    pillar: "Chapter V -- Third-Country Transfers"
    title: "General principle for transfers (Art 44)"
    description: >-
      Any transfer of personal data which are undergoing processing or
      are intended for processing after transfer to a third country or to
      an international organisation shall take place only if the
      conditions laid down in Chapter V are complied with by the
      controller and processor, including for onward transfers from the
      third country or international organisation to another. All
      provisions in this Chapter shall be applied in order to ensure that
      the level of protection of natural persons guaranteed by this
      Regulation is not undermined.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-44-transfer-principle.md" }
    references: ["https://gdpr-info.eu/art-44-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34, AI10P-DAT-01]
    remediation: "Document every cross-border transfer; verify each transfer rests on an Art 45 / 46 / 49 lawful basis."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"
  - id: GDPR_Art_45
    pillar: "Chapter V -- Third-Country Transfers"
    title: "Transfers on the basis of an adequacy decision (Art 45)"
    description: >-
      A transfer of personal data to a third country or an international
      organisation may take place where the Commission has decided that
      the third country, a territory or one or more specified sectors
      within that third country, or the international organisation in
      question ensures an adequate level of protection. Such a transfer
      shall not require any specific authorisation. The Commission shall
      monitor on an ongoing basis developments that could affect the
      adequacy decision and shall review the decisions at least every
      four years.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-45-adequacy-decisions.md" }
    references: ["https://gdpr-info.eu/art-45-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Identify which transfers benefit from an adequacy decision; monitor for adequacy-decision changes (Schrems precedent)."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"
  - id: GDPR_Art_46
    pillar: "Chapter V -- Third-Country Transfers"
    title: "Transfers subject to appropriate safeguards (Art 46)"
    description: >-
      In the absence of an adequacy decision the controller or processor
      may transfer personal data to a third country or international
      organisation only if it has provided appropriate safeguards and on
      condition that enforceable data subject rights and effective legal
      remedies are available. Safeguards may be provided by: (a) a
      legally binding and enforceable instrument between public
      authorities; (b) binding corporate rules (Art 47); (c) standard
      data protection clauses adopted by the Commission; (d) standard
      data protection clauses adopted by a supervisory authority and
      approved by the Commission; (e) an approved code of conduct
      (Art 40) together with binding and enforceable commitments;
      (f) an approved certification mechanism (Art 42) together with
      binding and enforceable commitments.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-46-appropriate-safeguards.md" }
    references: ["https://gdpr-info.eu/art-46-gdpr/"]
    overrides: []
    maps_to: [ISO_27001_A.5.34]
    remediation: "For each non-adequacy transfer, identify the chosen safeguard (typically SCCs 2021/914); execute the contract; document the transfer-impact assessment (TIA)."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"
  - id: GDPR_Art_47
    pillar: "Chapter V -- Third-Country Transfers"
    title: "Binding corporate rules (Art 47)"
    description: >-
      The competent supervisory authority shall approve binding corporate
      rules (BCRs) provided that they: (a) are legally binding and apply
      to and are enforced by every member concerned of the group of
      undertakings; (b) expressly confer enforceable rights on data
      subjects; (c) fulfil the requirements laid down in paragraph 2.
      BCRs must specify the structure of the group, data transfers
      including categories and purposes, legally binding nature
      internally and externally, application of the general data
      protection principles, the rights of data subjects, acceptance of
      liability for any breaches, how the BCRs are communicated to data
      subjects, complaint procedures, verification mechanisms,
      cooperation with the supervisory authority, reporting of changes,
      and data protection training.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-47-bcr.md" }
    references: ["https://gdpr-info.eu/art-47-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Adopt BCRs where the group structure justifies the cost and the safeguard set fits the transfer matrix; engage the lead supervisory authority early."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"
  - id: GDPR_Art_48
    pillar: "Chapter V -- Third-Country Transfers"
    title: "Transfers or disclosures not authorised by Union law (Art 48)"
    description: >-
      Any judgment of a court or tribunal and any decision of an
      administrative authority of a third country requiring a controller
      or processor to transfer or disclose personal data may only be
      recognised or enforceable in any manner if based on an
      international agreement, such as a mutual legal assistance treaty,
      in force between the requesting third country and the Union or a
      Member State, without prejudice to other grounds for transfer
      pursuant to this Chapter.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-48-foreign-orders.md" }
    references: ["https://gdpr-info.eu/art-48-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Document the response posture to foreign disclosure orders (US CLOUD Act, third-country subpoenas); route via legal."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"
  - id: GDPR_Art_49
    pillar: "Chapter V -- Third-Country Transfers"
    title: "Derogations for specific situations (Art 49)"
    description: >-
      In the absence of an adequacy decision or appropriate safeguards
      (Art 46), including BCRs, a transfer or a set of transfers of
      personal data to a third country or international organisation
      shall take place only on one of the following conditions: (a)
      explicit consent of the data subject after having been informed of
      the possible risks; (b) necessary for the performance of a
      contract; (c) necessary for the conclusion or performance of a
      contract in the interest of the data subject; (d) necessary for
      important reasons of public interest; (e) necessary for legal
      claims; (f) necessary in order to protect vital interests; (g)
      made from a register which according to Union / Member State law
      is intended to provide information to the public. Where a transfer
      could not be based on (a)-(g), it may take place only if it is not
      repetitive, concerns a limited number of data subjects, is
      necessary for compelling legitimate interests, and the controller
      has assessed all the circumstances and provided suitable
      safeguards.
    severity_default: critical
    evidence_basis:
      - { context_input: "evidence/05-art-49-derogations.md" }
    references: ["https://gdpr-info.eu/art-49-gdpr/"]
    overrides: []
    maps_to: []
    remediation: "Use Art 49 derogations as a narrow last-resort path; document each invocation in the transfer register; never rely on derogations as a structural safeguard."

    tags:
      - "applies-to.pii"
      - "obligation.controller"
      - "actor.controller-and-processor"
      - "scope.chapter-v-transfer"