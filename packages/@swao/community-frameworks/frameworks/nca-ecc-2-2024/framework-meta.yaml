# SWAO community framework metadata -- NCA_ECC
# Hand-authored from the NCA ECC-2:2024 PDF (TLP:White, Document Classification: Public).
# Source artefact: docs/custom-frameworks/nca-ecc-2-2024/research-notes.md
# Issue: #1133

framework:
  id: NCA_ECC
  name: "Essential Cybersecurity Controls (ECC-2:2024)"
  version: "ECC-2:2024 -- issued 2024"
  authority: "National Cybersecurity Authority (NCA), Kingdom of Saudi Arabia"
  contributor:
    name: "Helmut Schindlwick (Accenture SWAO team)"
    email: "https://github.com/Accenture/SWAO/discussions"
    organisation: "Accenture GmbH"
    date: "2026-07-18"
  applicability_hints:
    - ksa_regulated_entity
    - cloud_workload
    - government_systems
    - critical_infrastructure
    - financial_services
  assessment_type_scope: [app, aud]
  description: >
    NCA Essential Cybersecurity Controls version 2 (ECC-2:2024), issued by the National
    Cybersecurity Authority of the Kingdom of Saudi Arabia. Establishes the minimum
    mandatory cybersecurity baseline for all entities subject to NCA oversight, including
    government agencies and critical sector organisations. Covers 28 subdomains across
    four domains: Cybersecurity Governance (10 subdomains), Cybersecurity Defense (15),
    Cybersecurity Resilience (1), and Third-Party and Cloud Computing Cybersecurity (2).
    This SWAO catalogue maps one control per subdomain (28 controls total). Defense
    controls include four automated signal prefixes: IAM (identity and access management),
    CRYPTO (cryptography), INFRA (backup and recovery), and OBS (event logs and
    monitoring). All other controls rely on consultant-furnished evidence files.
    Cross-mapped to ISO_27001, NIST_CSF, SAMA_CSF, NCA_CCC_CSP, and NCA_CCC_CST.
  references:
    - "https://nca.gov.sa/en/Pages/ECC.aspx"
    - "docs/custom-frameworks/nca-ecc-2-2024/research-notes.md"
  catalogue_version: "1.0.0"
  last_reviewed: "2026-07-18"

  signal_prefix: NCA_ECC

  cross_mapping_hints:
    target_frameworks:
      - ISO_27001
      - NIST_CSF
      - SAMA_CSF
      - NCA_CCC_CSP
      - NCA_CCC_CST

  redistribution_note: >
    NCA ECC-2:2024 is issued by the National Cybersecurity Authority of the Kingdom of
    Saudi Arabia and is classified TLP:White / Document Classification: Public. Control
    descriptions in this catalogue faithfully paraphrase the subdomain requirement text
    from the official ECC-2:2024 document for SWAO ingestion. The Arabic version is the
    binding language for all matters relating to meaning or interpretation. No legal
    advice is provided; consult the official NCA publication and qualified counsel for
    interpretation applicable to a specific entity and workload.
