# SWAO Community Framework -- SOC 2 Trust Services Criteria

regime_meta:
  id: SOC_2
  name: "SOC 2 Trust Services Criteria"
  version: "2017-revised"
  scope: community
  authority: "American Institute of Certified Public Accountants (AICPA)"
  contributor:
    name: "Accenture SWAO team (community packaging)"
    email: "https://github.com/Accenture/SWAO/discussions"
    url: "https://accenture.example/swao/community-frameworks/soc-2"
  applicability_hints: [saas, b2b, us_market]
  description: >
    AICPA Trust Services Criteria for SOC 2 reports cover security,
    availability, processing integrity, confidentiality, and privacy.
    Common Criteria (CC1-CC9) form the security baseline applied across
    all five categories.
  references:
    - "AICPA Trust Services Criteria 2017 (revised 2022)"
  last_reviewed: "2026-05-24"
  catalogue_version: "1.0.0"

controls:
  - id: SOC_2_CC1.1
    title: "Control environment -- integrity and ethical values"
    description: >
      The entity demonstrates a commitment to integrity and ethical
      values. Code of conduct, hiring practices, and training together
      establish an environment where security policies are taken
      seriously.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
      - context_input: ops_runbooks
    references:
      - "AICPA TSC CC1.1"

  - id: SOC_2_CC2.1
    title: "Communication and information"
    description: >
      The entity obtains or generates relevant, quality information to
      support the functioning of internal control. Includes documented
      architecture, threat modelling, and risk assessment outputs.
    severity_default: medium
    evidence_basis:
      - context_input: solution_arch
    references:
      - "AICPA TSC CC2.1"

  - id: SOC_2_CC5.1
    title: "Control activities -- selection and development of controls"
    description: >
      The entity selects and develops control activities that
      contribute to the mitigation of risks to the achievement of
      objectives to acceptable levels.
    severity_default: medium
    evidence_basis:
      - signal_prefix: TF
      - signal_prefix: PP
    references:
      - "AICPA TSC CC5.1-CC5.3"

  - id: SOC_2_CC6.1
    title: "Logical and physical access controls"
    description: >
      The entity implements logical access security software,
      infrastructure, and architectures over protected information
      assets to protect them from security events.
    severity_default: high
    evidence_basis:
      - signal_prefix: IAM
      - signal_prefix: CRYPTO
    references:
      - "AICPA TSC CC6.1-CC6.8"

  - id: SOC_2_CC7.1
    title: "System operations -- detection and monitoring"
    description: >
      To meet its objectives, the entity uses detection and monitoring
      procedures to identify changes to configurations that result in
      the introduction of new vulnerabilities and susceptibilities to
      newly discovered vulnerabilities.
    severity_default: medium
    evidence_basis:
      - signal_prefix: OBS
      - signal_prefix: SBOM
    references:
      - "AICPA TSC CC7.1-CC7.5"
