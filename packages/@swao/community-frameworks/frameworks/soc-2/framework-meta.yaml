# SWAO community framework metadata (design 029 §2.3 + §11)
# Sprint-039 #0358 Phase 1 migration from the standard-scope PoC stub at
# `swao/controls/standard/soc2-controls.yaml`. Thin packaging --
# control set preserved verbatim from the stub (same 5 controls); only
# the wrapper graduates to design-029 community shape. Catalogue depth
# can grow in a future sprint without another wrapper migration.

framework:
  id: SOC_2
  name: "SOC 2 Trust Services Criteria"
  version: "2017-revised"
  authority: "American Institute of Certified Public Accountants (AICPA)"
  contributor:
    name: "Accenture SWAO team (community packaging)"
    url: "https://accenture.example/swao/community-frameworks/soc-2"
  applicability_hints:
    - saas
    - b2b
    - us_market
  assessment_type_scope: [app, aud]
  description: >-
    AICPA Trust Services Criteria for SOC 2 reports cover security, availability, processing integrity, confidentiality, and privacy. Common Criteria (CC1-CC9) form the security baseline applied across all five categories.
  references:
    - "AICPA Trust Services Criteria 2017 (revised 2022)"
  catalogue_version: "0.1.0"
  last_reviewed: "2026-05-24"
