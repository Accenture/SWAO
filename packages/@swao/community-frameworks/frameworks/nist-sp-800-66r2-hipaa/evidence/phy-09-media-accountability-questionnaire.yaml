  - id: q5
    text: "Are removable-media devices (USB sticks, external drives) under the same accountability regime?"
    answer: "unknown"
    severity_if_no: medium
    evidence_ref: "Removable media is technically blocked at endpoint; accountability for the few exception cases is unclear"
