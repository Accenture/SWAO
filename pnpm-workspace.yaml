# pnpm workspace root (ADR-0047 Phase 1, sprint-057).
# Declares all packages in the workspace. Overrides merged from
# packages/swao/pnpm-workspace.yaml when the workspace root was established.

packages:
  - packages/swao
  - packages/@swao/*
  - '!packages/@swao/module-doctor'
  - '../swao-premium/packages/@swao/*'

# Sprint-037 #0347 Part B overrides (previously in packages/swao/pnpm-workspace.yaml).
# uuid >= 11: transitive from exceljs; bumps past CVE flagged by Dependabot #18/#19.
overrides:
  fast-uri: '>=4.1.5'
  form-data: '>=4.0.6'
  hono: '>=4.13.7'
  ws: '>=8.21.0'
  vite: '>=7.3.5 <9.0.0'
  vitest: '>=4.1.11 <5.0.0'
  '@vitest/mocker': '>=4.1.11 <5.0.0'
  ip-address: '>=10.7.1'
  uuid: '>=11.0.0'
  tmp: '>=0.2.6'
  js-yaml: '>=5.4.1'
  adm-zip: '>=0.6.1'
  brace-expansion: '>=5.0.11'
  undici: '>=6.28.1'
  body-parser: '>=2.3.0'
  find-my-way: '>=9.7.0'
  postcss: '>=8.5.26'
  nanoid: '>=3.3.18'
  liquidjs: '>=10.29.0'
  '@fastify/static': '>=10.1.2'
  '@hono/node-server': '>=2.0.5'
  # #2626: 5 moderate vulnerability overrides (qs, fastify, xmldom) -- sprint-131
  'qs': '>=6.16.0'
  'fastify': '>=5.12.4'
  '@xmldom/xmldom': '>=0.8.15'
  # #2932 sprint-144: proxy-addr (CRITICAL GHSA-jqcg-44mw-7w3h via @modelcontextprotocol/sdk>express)
  # source-map-js (HIGH GHSA-68fv-2mgg-jv7q via vitest>postcss)
  # sprintf-js: no patch available (latest 1.1.3 < advisory threshold); added to ignoreGhsas
  'proxy-addr': '>=2.0.8'
  'source-map-js': '>=1.2.2'
  # #2955 sprint-144: @modelcontextprotocol/sdk DoS vulnerability (GHSA-6qxp-vccf-f47h, HIGH)
  '@modelcontextprotocol/sdk': '>=1.31.0'

onlyBuiltDependencies:
  - esbuild
  - node-pty

allowBuilds:
  esbuild: true
  node-pty: true

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm  # braces: no patch available (fix requires >=3.0.4, not yet published)
    - GHSA-hp3w-g68c-fv3c  # sprintf-js: no patch available (fix requires >=1.1.4, latest is 1.1.3)
