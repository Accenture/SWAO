# pnpm workspace root (ADR-0047 Phase 1, sprint-057).
# Declares all packages in the workspace. Overrides merged from
# packages/swao/pnpm-workspace.yaml when the workspace root was established.

packages:
  - packages/swao
  - packages/@swao/*
  - '!packages/@swao/module-doctor'
  - '../swao-premium/packages/@swao/*'

# Sprint-037 #0347 Part B overrides (previously in packages/swao/pnpm-workspace.yaml).
# uuid >= 11: transitive from exceljs; bumps past CVE flagged by Dependabot #18/#19.
overrides:
  fast-uri: '>=4.2.3 <5.0.0'
  form-data: '>=4.0.6'
  hono: '>=4.13.7'
  ws: '>=8.21.0'
  vite: '>=8.1.6 <9.0.0'
  vitest: '>=4.1.12 <5.0.0'
  '@vitest/mocker': '>=4.1.12 <5.0.0'
  ip-address: '>=10.7.4 <11.0.0'
  # sprint-153 (#3494): zod CVE-2023-54404 (Black Duck HIGH, clean from 4.6.7); one major for the whole tree
  zod: '>=4.6.7 <5.0.0'
  uuid: '>=11.0.0'
  tmp: '>=0.2.6'
  js-yaml: '>=5.4.1'
  adm-zip: '>=0.6.1'
  brace-expansion: '>=5.0.11'
  # #3501: GHSA-xjj6-f33q-929c (undici < 8.12.2) and GHSA-27r3-jxmh-p828 (body-parser < 2.4.0), HIGH
  undici: '>=8.12.2 <9.0.0'
  body-parser: '>=2.4.0 <3.0.0'
  find-my-way: '>=9.7.0'
  postcss: '>=8.5.26'
  nanoid: '>=3.3.18'
  liquidjs: '>=10.29.0'
  '@fastify/static': '>=10.1.2'
  # #3560: GHSA-rmxm-3fg6-px4f (@hono/node-server < 2.1.3) and GHSA-6pq8-jhm2-2vcw (qs < 6.16.1), MODERATE
  '@hono/node-server': '>=2.1.3'
  # #2626: 5 moderate vulnerability overrides (qs, fastify, xmldom) -- sprint-131
  'qs': '>=6.16.1'
  'fastify': '>=5.12.6 <6.0.0'
  '@xmldom/xmldom': '>=0.8.15'
  # #2932 sprint-144: proxy-addr (CRITICAL GHSA-jqcg-44mw-7w3h via @modelcontextprotocol/sdk>express)
  # source-map-js (HIGH GHSA-68fv-2mgg-jv7q via vitest>postcss)
  # sprintf-js: no patch available (latest 1.1.3 < advisory threshold); added to ignoreGhsas
  'proxy-addr': '>=2.0.8'
  'source-map-js': '>=1.2.2'
  # #2955 sprint-144: @modelcontextprotocol/sdk DoS vulnerability (GHSA-6qxp-vccf-f47h, HIGH)
  '@modelcontextprotocol/sdk': '>=1.31.0'
  # sprint-148: fast-jwt CRITICAL CVE-2026-34950 (RSA->HS256 algorithm confusion incomplete patch)
  # and MODERATE GHSA-687g-22h4-j4w4 (clockTolerance:Infinity JWT validation bypass)
  # Patched in fast-jwt >= 6.2.5; transitive via @fastify/jwt
  'fast-jwt': '>=6.2.5'
  # #3560: GHSA-3g3m-2fjr-6pw4 (glob < 14.0.2) and GHSA-g3hv-75wg-m249 (minimatch < 11.0.1), MODERATE.
  # Scoped to the two non-premium paths: @fastify/static (runtime, glob 13 -> 14 pulls minimatch 11)
  # and typescript-eslint (development only). The premium exceljs > archiver path (glob 7, minimatch
  # 3 and 5, also bundled in Community) cannot take an 8-major jump; accepted in auditConfig.ignoreGhsas below (#3560).
  '@fastify/static>glob': '>=14.0.2 <15.0.0'
  '@typescript-eslint/typescript-estree>minimatch': '>=11.0.1 <12.0.0'

onlyBuiltDependencies:
  - esbuild
  - node-pty

allowBuilds:
  esbuild: true
  node-pty: true

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm  # braces: no patch available (fix requires >=3.0.4, not yet published)
    - GHSA-hp3w-g68c-fv3c  # sprintf-js: no patch available (fix requires >=1.1.4, latest is 1.1.3)
    - GHSA-g3hv-75wg-m249  # minimatch 3/5 via exceljs > archiver (#3560, owner decision 2026-11-02; corrected 2026-11-02): also in the Community bundle (exceljs is a direct dependency of module-app-assessment, module-service-assessment and module-powerbi). Not reachable: the DoS needs a glob pattern, archiver only globs in glob()/directory(), which exceljs and SWAO never call (SWAO only reads workbooks and writes them in memory). Re-check 2027-02-01 or on an exceljs release
