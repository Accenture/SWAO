<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" xml:lang="de" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">So funktioniert SWAO: vom Workspace zum Onboarding</title>
  <desc id="d">Prozessablauf in sieben Schritten. Eine Workspace-Karte und eine Karte mit Eingabedateien speisen die SWAO-Engine, die 13 Analyse-Passes ausführt, statisch und LLM-gestützt. Die Passes erzeugen Ergebnisse (Signale und Bewertungen), die zu einer 7R-Migrationsentscheidung und weiter zum Onboarding in eine Landing Zone führen. Eine Schleife der kontinuierlichen Verbesserung führt von der 7R-Entscheidung zurück zum Workspace für eine erneute Bewertung.</desc>
