<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xml:lang="en" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Landing Zone Catalog Assessment</title>
  <desc id="d">Cinematic neon banner: the SWAO engine sends thin evaluation beams to five landing zone catalogue cards, each with a shield, padlock and region glyph in its own frame colour. Response beams lead to a verdict panel listing pass, partial and fail rows.</desc>
  <defs>
    <pattern id="hex" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M0,17.32 L10,0 L30,0 L40,17.32 L30,34.64 L10,34.64 Z M40,17.32 L60,17.32" fill="none" stroke="#a100ff" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#070707" stop-opacity="0"/>
      <stop offset="70%" stop-color="#070707" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070707" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a100ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f0d9ff"/>
      <stop offset="100%" stop-color="#a100ff"/>
    </radialGradient>
    <linearGradient id="pt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a100ff"/>
      <stop offset="100%" stop-color="#1bbaa4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arP" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a100ff"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1bbaa4"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 4 12; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="#070707"/>
  <rect width="1200" height="300" fill="url(#hex)"/>
  <rect width="1200" height="300" fill="url(#floorGlow)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>
