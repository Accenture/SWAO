  <polygon points="630.0,150.0 615.0,176.0 585.0,176.0 570.0,150.0 585.0,124.0 615.0,124.0" fill="url(#core)" stroke="#ffffff" filter="url(#bloom)"/>
  <circle cx="700" cy="124" r="3.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="505" cy="177" r="3" fill="#d0a0ff" filter="url(#glow)"/>
