  <path d="M186,120 L206,132 L206,150 M252,118 L272,108 M250,160 L270,170 L270,152 M190,168 L210,178" stroke="#e0b3ff" stroke-width="1.4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <ellipse cx="600" cy="150" rx="110" ry="28" fill="none" stroke="#d0a0ff" stroke-width="1.3" stroke-opacity="0.7" transform="rotate(-14 600 150)"/>
