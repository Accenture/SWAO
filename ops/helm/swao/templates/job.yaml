apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "swao.fullname" . }}
  labels:
    {{- include "swao.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "swao.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: swao
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - swao
            - assess
            - --app
            - {{ required "app.id is required -- set with --set app.id=<your-app-id>" .Values.app.id | quote }}
          env:
            - name: SWAO_LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- range $key, $value := .Values.credentials }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.app.workspacePvcName }}
