name: Release Community Edition

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.2)'
        required: true

permissions:
  contents: write

jobs:
  attach-community-assets:
    name: Attach Community binaries to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download Community binaries from private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist-community
          for ASSET in \
            "swao-community-win-x64.exe" \
            "swao-community-linux-x64" \
            "swao-community-linux-arm64" \
            "swao-community-macos-x64" \
            "swao-community-macos-arm64"; do
            gh release download "$VERSION" \
              --repo "Accenture-Cloud-First-Tech/315556_swao" \
              --pattern "$ASSET" \
              --dir dist-community
          done

      - name: Generate checksums
        run: |
          cd dist-community
          sha256sum swao-community-win-x64.exe \
                    swao-community-linux-x64 \
                    swao-community-linux-arm64 \
                    swao-community-macos-x64 \
                    swao-community-macos-arm64 > checksums.sha256
          cat checksums.sha256

      - name: Generate Community SBOM
        run: |
          npm install -g @cyclonedx/cdxgen --quiet
          cdxgen -o dist-community/swao-${{ steps.version.outputs.VERSION }}-community-sbom.cdx.json \
            --no-recurse --spec-version 1.5 .

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "$VERSION" \
            --title "SWAO Community Edition $VERSION" \
            --notes "Community Edition release. See [CHANGELOG](https://github.com/Accenture/SWAO/blob/main/swao/CHANGELOG.md) for details." \
            --verify-tag \
            || true
          gh release upload "$VERSION" \
            dist-community/swao-community-win-x64.exe \
            dist-community/swao-community-linux-x64 \
            dist-community/swao-community-linux-arm64 \
            dist-community/swao-community-macos-x64 \
            dist-community/swao-community-macos-arm64 \
            dist-community/checksums.sha256 \
            dist-community/swao-${{ steps.version.outputs.VERSION }}-community-sbom.cdx.json \
            --clobber

  publish-docker-community:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Community image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.community
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/accenture/swao:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=community-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=community-${{ matrix.arch }}

  publish-docker-community-manifest:
    needs: publish-docker-community
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Compose multi-arch Community manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            -t "ghcr.io/accenture/swao:${TAG}" \
            -t "ghcr.io/accenture/swao:community-${TAG}" \
            "ghcr.io/accenture/swao:${TAG}-amd64" \
            "ghcr.io/accenture/swao:${TAG}-arm64"
        shell: bash

      - name: Tag latest (stable tags only)
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            -t "ghcr.io/accenture/swao:latest" \
            "ghcr.io/accenture/swao:${TAG}-amd64" \
            "ghcr.io/accenture/swao:${TAG}-arm64"
        shell: bash
