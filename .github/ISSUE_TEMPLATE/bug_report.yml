name: Bug Report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I run `swao assess --app my-app`, the command...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Run `swao assess --app my-app`
        2. Wait for Pass 03 to complete
        3. See error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages or stack traces.

  - type: input
    id: version
    attributes:
      label: SWAO version
      description: Output of `swao health-check --version`
      placeholder: "SWAO v0.12.0 (Community)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon (ARM)
        - macOS Intel (x64)
        - Linux x64
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Licence tier
      options:
        - Community
        - Consultant
        - Enterprise
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant log output below. No need for backticks -- this renders automatically.
      render: shell
