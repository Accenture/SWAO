        status: in_progress
        notes: "GCP European Sovereign Cloud announced for 2024-2025; EUCS engagement underway"
      gdpr_dpa:
        status: available
        notes: "Google Cloud DPA + EU SCCs; Data Processing Addendum covers GDPR Art. 28"
      dora:
        status: partial
        notes: "Google Cloud DORA whitepaper published; formal attestation pending"

    compliance_regime_coverage:
      gdpr: satisfied
      bsi_c5: not_satisfied
      dora: partial
      hipaa: satisfied
      pci_dss: satisfied
      nis2: partial

    services:
      kubernetes:
        available: true
        managed: true
        service_name: "Google Kubernetes Engine (GKE)"
      postgresql:
        available: true
        managed: true
        service_name: "Cloud SQL for PostgreSQL / AlloyDB"
        versions: ["13", "14", "15", "16"]
      mysql:
        available: true
        managed: true
        service_name: "Cloud SQL for MySQL"
      redis:
        available: true
        managed: true
        service_name: "Memorystore for Redis"
      object_storage:
        available: true
        managed: true
        s3_compatible: false
        service_name: "Google Cloud Storage"
        notes: "XML API is largely S3-compatible; native API is Google-proprietary"
      serverless:
        available: true
        managed: true
        service_name: "Cloud Functions / Cloud Run"
      ml_inference:
        available: true
        managed: true
        service_name: "Vertex AI / Healthcare Natural Language API"
        notes: "Healthcare NLP available; sovereign data processing for EU requires Assured Workloads configuration"
      secrets_management:
        available: true
        service_name: "Secret Manager"
      container_registry:
        available: true
        service_name: "Artifact Registry"
      cdn:
        available: true
        managed: true
        service_name: "Cloud CDN"
        notes: "Global CDN; EU-only routing via Cloud Armor + origin configuration"
      byok_kms:
        available: true
        service_name: "Cloud KMS -- Customer-Managed Encryption Keys (CMEK)"
      load_balancer:
        available: true
        managed: true
        service_name: "Cloud Load Balancing"
      dns:
        available: true
        managed: true
        service_name: "Cloud DNS"

    meshstack_support:
      supported: true
      platform_identifier: "gcp-europe-west3"
      building_blocks_available: [kubernetes, postgresql, mysql, redis, networking, iam, secrets, object_storage, ml_inference]

    vendor_lock_in:
      overall_risk: high
      portability_score: 0.48
      exclusive_capabilities:
        - capability: "BigQuery (serverless analytics warehouse)"
          risk: critical
          note: "BigQuery uses a Google-proprietary SQL dialect and columnar storage format. No equivalent managed analytics warehouse exists on any EU sovereign provider. Migrating off BigQuery requires data export + replatform to open-source (ClickHouse, DuckDB) or another cloud warehouse (Snowflake, Redshift). Effort: very high."
        - capability: "Cloud Spanner (globally-distributed relational DB)"
          risk: critical
          note: "Spanner is the only managed globally-distributed relational database with external consistency. No equivalent on any other provider in this catalogue. Migration requires database redesign to CockroachDB (open-source) or sharded PostgreSQL."
        - capability: "Vertex AI (managed ML training + prediction pipeline)"
          risk: high
          note: "Vertex AI pipelines, Feature Store, and Model Registry use Google-proprietary APIs. Kubeflow (open-source) is the portable alternative but requires self-hosting and pipeline rewrites."
        - capability: "Healthcare Natural Language API"
          risk: high
          note: "GCP's medical entity extraction API. No equivalent managed service on EU sovereign providers. Migration to self-hosted clinical NLP required."
      proprietary_apis:
        - service: object_storage
          risk: medium
          migration_path: "Google Cloud Storage native JSON API is Google-proprietary. The XML API is largely S3-compatible but has edge cases (multi-part upload, object lock) that differ. Migrating to S3 or STACKIT Object Storage requires testing + SDK validation. Rclone can move data. Effort: low-medium."
        - service: serverless
          risk: medium
          migration_path: "Cloud Functions (Gen 1) uses a Google-proprietary deployment model. Cloud Run (container-based) is more portable -- OCI containers run anywhere. Workloads using Cloud Run are substantially more portable than those using Cloud Functions with Pub/Sub triggers."
        - service: ml_inference
          risk: high
          migration_path: "Vertex AI Prediction API and Healthcare NLP API are Google-proprietary. Open-source alternative for healthcare NLP: medspaCy or AWS Comprehend Medical (changes provider). Vertex AI prediction can be replaced by KServe on Kubernetes. Effort: high."
        - service: cdn
          risk: medium
          migration_path: "Cloud Armor WAF policies and Cloud CDN cache configuration use GCP-specific resource models. Cloud Armor security policies are expressible in CEL (Common Expression Language) which is open; but the rule schema is GCP-specific."
      data_egress_risk: high
      notes: >
        GCP lock-in is concentrated in data analytics and AI/ML. A workload that uses
        only GKE + Cloud SQL + Cloud Storage + Secret Manager is relatively portable.
        A workload that adds BigQuery, Pub/Sub, Vertex AI, or Spanner accumulates
        severe lock-in that has no direct equivalent on any EU sovereign provider.
        GCS XML API compatibility with S3 is partial and must be validated per use case.
        Cloud Run is a portable bright spot: OCI-standard containers with HTTP
        invocation are the most portable serverless execution model in the catalogue.
        IAM is Google-proprietary (role bindings + Workload Identity Federation) but
        the OIDC/SAML federation layer is standard.

    cost_tier: high
    sovereign_score: 0.28

    suitable_for_signals:
      - EU_only_residency
      - gdpr_regulated
      - hipaa_required
      - pci_dss_required
      - broad_service_catalogue_required
      - ml_inference_required
      - global_cdn_required
      - serverless_required
      - us_jurisdiction_acceptable

    not_suitable_for_signals:
      - no_us_parent_required
      - bsi_c5_required
      - DE_only_residency
      - cost_sensitive
      - low_vendor_lock_in_required

    last_reviewed: "2026-04-28"
    last_updated: "2026-04-28"
    review_sources:
      - "https://cloud.google.com/security/compliance/compliance-reports-manager"
      - "https://cloud.google.com/assured-workloads/docs/eu-regions-and-support"
      - "https://cloud.google.com/privacy"

