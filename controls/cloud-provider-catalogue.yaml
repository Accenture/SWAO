        notes: "Azure-proprietary API; S3 compatibility via third-party gateway"
      serverless:
        available: true
        managed: true
        service_name: "Azure Functions"
      ml_inference:
        available: true
        managed: true
        service_name: "Azure AI Services (Language, Vision, OpenAI Service)"
        notes: "Azure AI includes text analytics, medical entity extraction (alternative to Comprehend Medical)"
