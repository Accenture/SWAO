        available: true
        service_name: "AWS Key Management Service (KMS) -- Customer Managed Keys"
      load_balancer:
        available: true
        managed: true
        service_name: "AWS Application Load Balancer / Network Load Balancer"
      dns:
        available: true
        managed: true
        service_name: "Amazon Route 53"

