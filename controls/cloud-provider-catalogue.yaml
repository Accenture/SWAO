      supported: true
      platform_identifier: "aws-eu-central-1"
      building_blocks_available: [kubernetes, postgresql, mysql, redis, networking, iam, secrets, object_storage, ml_inference]

    vendor_lock_in:
      overall_risk: high
      portability_score: 0.50
      exclusive_capabilities:
        - capability: "Amazon Comprehend Medical"
          risk: critical
          note: "The only managed medical NLP service available in eu-central-1 with HIPAA BAA. No equivalent exists on any EU sovereign provider. Workloads depending on Comprehend Medical CANNOT migrate to STACKIT, OTC, or any dedicated sovereign provider without a full ML rearchitect or self-hosted model deployment."
        - capability: "Amazon Bedrock (foundation model API)"
          risk: high
          note: "AWS-exclusive managed foundation model API covering multiple LLM providers (Anthropic, Meta, Mistral) under AWS contract terms. No equivalent managed model gateway on EU sovereign providers."
        - capability: "AWS PrivateLink ecosystem"
          risk: medium
          note: "PrivateLink allows private connectivity to 150+ AWS and partner services without internet exposure. The breadth of PrivateLink-connected SaaS partners has no equivalent on other providers."
      proprietary_apis:
        - service: serverless
          risk: high
          migration_path: "AWS Lambda uses a proprietary event source model (SQS trigger, DynamoDB streams, Kinesis trigger, S3 event notifications). HTTP-triggered functions (Lambda + API Gateway) are portable to Cloud Run or Azure Functions. Event-source-integrated functions require full rewrite of the trigger integration layer."
        - service: ml_inference
          risk: critical
          migration_path: "Comprehend Medical API is AWS-proprietary. Alternative: deploy open-source clinical NLP model (e.g. medspaCy, Stanza) on Kubernetes. Effort: high. No managed alternative available on EU sovereign providers."
        - service: cdn
          risk: medium
          migration_path: "CloudFront distribution configuration and Lambda@Edge functions are AWS-proprietary. Cache behaviour rules and geo-restriction configs require manual recreation on alternative CDN. Effort: medium."
      data_egress_risk: high
      notes: >
        AWS lock-in is driven by two factors: (1) the breadth of proprietary managed services
        that have no equivalent on EU sovereign providers (Comprehend Medical being the most
        critical for health workloads), and (2) the IAM policy language (AWS JSON policy DSL)
        which is deeply embedded in every multi-service architecture.
        S3 has become a de-facto standard (all other providers implement S3-compatible APIs)
        which means S3-based storage itself is NOT a lock-in risk -- but S3 event notifications
        wired to Lambda ARE, because that integration is AWS-proprietary.
        EKS (standard K8s), RDS PostgreSQL (standard wire protocol), and ElastiCache Redis
        (standard Redis protocol) are the portable anchors. Lambda event integrations,
        Comprehend Medical, and Bedrock are the primary lock-in surfaces.

    cost_tier: high
    sovereign_score: 0.25

    suitable_for_signals:
