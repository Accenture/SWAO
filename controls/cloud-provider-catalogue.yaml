        available: true
        managed: true
        service_name: "Azure Load Balancer / Application Gateway"
      dns:
        available: true
        managed: true
        service_name: "Azure DNS"

    meshstack_support:
      supported: true
      platform_identifier: "azure-westeurope"
      building_blocks_available: [kubernetes, postgresql, mysql, redis, networking, iam, secrets, object_storage, ml_inference]

    vendor_lock_in:
      overall_risk: high
      portability_score: 0.45
      exclusive_capabilities:
        - capability: "Azure OpenAI Service (GPT-4, DALL-E via API)"
          risk: high
          note: "Azure-exclusive access to OpenAI models under enterprise terms. Migrating to self-hosted or alternative LLM requires model swap + prompt engineering rework."
        - capability: "Microsoft Entra ID (Azure AD) -- Conditional Access, PIM, hybrid identity"
          risk: high
          note: "Entra ID advanced features (Conditional Access policies, Privileged Identity Management) use Azure-proprietary policy DSL. OIDC/SAML federation is portable; the control plane is not."
        - capability: "Azure Front Door (global anycast WAF + CDN)"
          risk: medium
          note: "Front Door combines CDN, WAF, and global load balancing in one product. Decomposing to equivalent OSS stack requires multiple separate services."
      proprietary_apis:
        - service: object_storage
          risk: high
          migration_path: "Azure Blob Storage uses a proprietary REST API (not S3-compatible natively). Migration to S3 or S3-compatible storage requires data migration + full SDK rewrite. Rclone/AzCopy can move data but application code must change."
        - service: serverless
          risk: high
          migration_path: "Azure Functions uses a proprietary trigger/binding model (Event Hub trigger, Cosmos DB change-feed trigger, etc.). Core HTTP triggers are portable; Azure-specific triggers require full rewrite."
        - service: ml_inference
          risk: high
          migration_path: "Azure AI Services use a proprietary REST API with Azure-specific auth (APIM keys or Managed Identity). No open-standard alternative for medical entity extraction at comparable capability."
        - service: cdn
          risk: medium
          migration_path: "Azure Front Door rules engine and WAF policies use Azure-specific configuration language. Migrating to Cloudflare or OVHcloud CDN requires policy rewrite."
        - service: secrets_management
          risk: medium
          migration_path: "Azure Key Vault API is Azure-proprietary. Migrating to HashiCorp Vault or AWS Secrets Manager requires SDK swap + application config changes. Secrets themselves are portable (export/import)."
      data_egress_risk: high
      notes: >
        Azure has the highest lock-in risk of any provider in this catalogue.
        The combination of proprietary object storage API (Blob vs S3), proprietary
        Functions trigger model, Entra ID advanced identity features, and Azure-specific
        ARM/Bicep IaC means that a workload that uses Azure services beyond AKS and
        PostgreSQL is accumulating lock-in debt with every service adopted.
        AKS (standard K8s), Azure Database for PostgreSQL (standard wire protocol),
        and Azure Cache for Redis (standard Redis protocol) are the portable anchors.
        Everything else carries medium-to-high migration cost.

    cost_tier: high
    sovereign_score: 0.35

    suitable_for_signals:
      - EU_only_residency
      - gdpr_regulated
      - hipaa_required
      - pci_dss_required
      - broad_service_catalogue_required
      - ml_inference_required
