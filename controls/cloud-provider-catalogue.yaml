  - id: stackit_de_sovereign
    name: "STACKIT (Schwarz Group)"
    type: dedicated_sovereign
    jurisdiction: DE
    description: >
      German-sovereign cloud operated by the Schwarz Group (Lidl/Kaufland parent).
      All infrastructure physically in Germany. No US parent company.
      Positioned for BSI C5, GDPR Art.9, and DORA workloads in the German market.

    residency:
      regions: [de-01, de-02]
      data_residency_guarantees:
        - DE_only
        - EU_only

    certifications:
      bsi_c5:
        status: attested
        scope: "IaaS + PaaS"
        last_audited: "2024-12"
        evidence_url: "https://stackit.de/en/security-and-compliance/"
      iso_27001:
        status: certified
        last_audited: "2024-06"
      eucs_high:
        status: in_progress
        notes: "EUCS High certification expected 2026"
      gdpr_dpa:
        status: available
        notes: "GDPR Art. 28 DPA available for all customers"
      dora:
        status: partial
        notes: "ICT risk management controls present; full DORA attestation pending"

    compliance_regime_coverage:
      gdpr: satisfied
      bsi_c5: satisfied
      dora: partial
      hipaa: not_applicable
      pci_dss: in_progress
      nis2: partial

    services:
      kubernetes:
        available: true
        managed: true
        service_name: "SKE (Sovereign Kubernetes Engine)"
      postgresql:
        available: true
        managed: true
        service_name: "STACKIT PostgreSQL Flex"
        versions: ["14", "15", "16"]
      mysql:
        available: true
        managed: true
        service_name: "STACKIT MySQL Flex"
      redis:
        available: true
        managed: true
        service_name: "STACKIT Redis"
      object_storage:
        available: true
        managed: true
        s3_compatible: true
        service_name: "STACKIT Object Storage"
      serverless:
        available: false
        notes: "No equivalent to AWS Lambda or Azure Functions"
      ml_inference:
        available: false
        notes: "No equivalent to AWS Comprehend Medical or Azure AI Services"
      secrets_management:
        available: true
        service_name: "STACKIT Secrets Manager"
      container_registry:
        available: true
        service_name: "STACKIT Container Registry"
      cdn:
        available: false
        notes: "Planned; not GA as of 2026-04"
      byok_kms:
        available: true
        service_name: "STACKIT Key Management Service"
      load_balancer:
        available: true
        managed: true
        service_name: "STACKIT Load Balancer"
      dns:
        available: true
        managed: true
        service_name: "STACKIT DNS"

    meshstack_support:
      supported: true
      platform_identifier: "stackit-de-01"
      building_blocks_available: [kubernetes, postgresql, redis, networking, iam, secrets]

    vendor_lock_in:
      overall_risk: low
      portability_score: 0.90
      exclusive_capabilities: []
      proprietary_apis:
        - service: secrets_management
          risk: low
          migration_path: "STACKIT Secrets Manager API is STACKIT-specific; migrating to HashiCorp Vault or AWS Secrets Manager requires SDK swap. Data export supported."
      data_egress_risk: low
      notes: >
        STACKIT uses S3-compatible object storage, standard PostgreSQL wire protocol,
        and CNCF-standard Kubernetes. Migration away is primarily a data-move + config
        exercise. The primary lock-in risk is the limited service catalogue: workloads
        that need CDN or ML inference cannot stay on STACKIT and must be rearchitected
        regardless of provider choice.

    cost_tier: medium
    sovereign_score: 0.95

    suitable_for_signals:
      - DE_only_residency
      - EU_only_residency
      - bsi_c5_required
      - gdpr_regulated
      - no_us_parent_required

    not_suitable_for_signals:
      - global_cdn_required
      - ml_inference_sovereign
      - us_jurisdiction_acceptable

    last_reviewed: "2026-04-28"
    last_updated: "2026-04-28"
    review_sources:
      - "https://stackit.de/en/security-and-compliance/"
      - "https://docs.stackit.cloud/"

