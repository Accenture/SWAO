      gdpr_dpa:
        status: available
        notes: "Microsoft DPA + EU Standard Contractual Clauses; EU Data Boundary programme for data residency"
      dora:
        status: partial
        notes: "Microsoft DORA whitepaper published; formal attestation pending"

    compliance_regime_coverage:
