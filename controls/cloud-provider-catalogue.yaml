# Cloud Provider Capability Catalogue
# SWAO Compliance Ruleset Library -- runtime asset
# Version: 2026-04
# Schema: cloud-provider-catalogue-v1
#
# Used by: SPEC §10.5 (Landing Zone Mapper); SYNTH pass (Pass 9) landing zone matching sub-pass
# Design: swao-premium/docs/design/012-cloud-provider-catalogue.md
#
# provider.type values:
#   hyperscaler_eu_region   -- major hyperscaler operating an EU-located region
#   dedicated_sovereign     -- cloud built for EU/national sovereignty; EU or national operating entity
#   gaia_x_compliant        -- Gaia-X certified provider (certification maturing; assigned when ratified)
#   managed_private         -- managed hosting / colocation provider; no hyperscaler-level PaaS
#   hyperscaler_gov         -- government-specific hyperscaler cloud (not in v1 scope)
#
# certification.status values:
#   attested        -- third-party attested (e.g. BSI C5 Type II attestation report issued)
#   certified       -- formal certification body has issued a certificate (ISO 27001 etc.)
#   in_progress     -- assessment underway; not yet issued
#   not_assessed    -- provider has not pursued this certification
#   not_applicable  -- certification is outside scope for this provider type
#   partial         -- subset of services or scope covered; not comprehensive
#
# compliance_regime_coverage values:
#   satisfied       -- provider fully satisfies the SWAO compliance regime requirements
#   partial         -- provider satisfies key controls but not comprehensive
#   in_progress     -- provider is working toward satisfying this regime
#   not_applicable  -- provider does not seek this regime's coverage
#   not_satisfied   -- provider has known gaps that disqualify it for this regime
#
# cost_tier: low | medium | high   (relative to hyperscaler EU on-demand pricing)
# sovereign_score: 0.0-1.0         (how strongly sovereign: national entity + BSI C5 + no US parent)
#
# vendor_lock_in.overall_risk: low | medium | high
#   How difficult it is to migrate away from this provider.
#   low   -- primarily open-standard APIs (K8s, PostgreSQL wire, S3); migration is config + data move
#   medium -- mix of open + proprietary; some API rewrite required for specific services
#   high   -- significant proprietary API surface; substantial rewrite + migration engineering
#
# vendor_lock_in.portability_score: 0.0-1.0
#   Fraction of managed services using open or interoperable standards.
#   1.0 = fully portable; 0.0 = fully proprietary.
#
# vendor_lock_in.exclusive_capabilities: capabilities unique to this provider with no equivalent
#   elsewhere in the catalogue. Signals that a workload depending on these has NO migration path
#   without rearchitecting that feature.
#
# vendor_lock_in.proprietary_apis: services with non-standard or provider-specific APIs
#   even where the function is generic (e.g. object storage with non-S3 API).
#   Each entry includes lock_in_risk (low|medium|high) and a migration_path note.
#
# vendor_lock_in.data_egress_risk: low | medium | high
#   Economic lock-in via data transfer costs when migrating stored data out.
#   high = hyperscaler-scale egress pricing; low = minimal or no egress fees.
#
# service.lock_in_risk: low | medium | high | critical (added to individual service entries)
#   Specific lock-in risk for this service API on this provider.
#
# Update process: edit this file directly; bump last_reviewed + last_updated on changed entry.
# Commit: chore(controls): update cloud-provider-catalogue -- <provider> <change>
# No code change required unless the matching algorithm reads a new field.
# Quarterly review: https://github.com/Accenture/SWAO/issues
# See design doc §Catalogue update process for full governance.

