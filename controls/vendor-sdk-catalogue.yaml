# Vendor SDK Catalogue
# SWAO Compliance Ruleset Library -- runtime asset
# Version: 2026-10
# Schema: Zod VendorSdkCatalogueSchema
#   (swao/packages/@swao/module-app-assessment/src/catalogue/reference-catalogues.ts)
#
# Used by: Pass 01 (INV), signal INV-09 (passes/inv-reference-scans.ts).
#   Detection rules for vendor-proprietary SDK dependencies that affect the
#   portability score and the 7R disposition. INV-09 severity follows
#   sovereign_impact: blocks_migration high, partial medium, manageable low,
#   none informational.
# Purpose: generic runtime asset. It must not contain engagement-specific
#   content (client names or pseudonyms, one application's configuration,
#   costs or volumes) and must not recommend one particular provider.
#
# Detection scope (dependency manifests and lock files):
#   npm_packages      package.json, package-lock.json, yarn.lock, pnpm-lock.yaml
#   cargo_crates      Cargo.toml, Cargo.lock
#   pip_packages      requirements*.txt, pyproject.toml, Pipfile
#   maven_group_ids   pom.xml, build.gradle(.kts); matched against the groupId
#   nuget_packages    *.csproj, packages.config
#   jar_patterns      file names in the source tree
# A trailing `*` in a pattern means prefix matching.
#
# lock_in_level values:
#   extreme   -- proprietary API and data format; migration requires a rewrite
#   high      -- proprietary SDK; a standard alternative exists but migration is significant
#   medium    -- abstraction layer available; SDK swap feasible
#   low       -- thin wrapper; easily replaced
#
# sovereign_impact values and the rule applied to every entry (#3302):
#   blocks_migration  -- the SDK calls APIs that only one US-parented cloud
#                        provider implements. Its EU-operated or "sovereign"
#                        offerings remain US-parented, so they do not count as
#                        a sovereign equivalent (the US-parent rule of
#                        sovereign-service-catalogue.yaml; CLOUD Act,
#                        https://www.law.cornell.edu/uscode/text/18/2713).
#                        Moving to an EU-parent provider means replacing every
#                        call. Applied to the AWS, Google Cloud, Firebase and
#                        Azure SDKs alike.
#   partial           -- a vendor-licensed product (message broker, database)
#                        that the customer can install and operate on any
#                        infrastructure, including an EU-parent provider, but
#                        that no EU-parent provider offers as a managed service
#                        that SWAO could cite; migration means licensed
#                        self-hosting or replacement.
#   manageable        -- a sovereign equivalent with a compatible API exists;
#                        the swap is straightforward.
#   none              -- third-party SaaS SDK. The SDK is not cloud
#                        infrastructure; the sovereignty verdict of the service
#                        itself is held by sovereign-service-catalogue.yaml
#                        (referenced by id, never copied here).
#
# Sources: every entry lists public sources (package registry pages for the
#   detection patterns, vendor documentation for product facts) with the date
#   each was checked, and a last_reviewed date. sovereign_alternative texts
#   are generic migration options, not claims about one provider's offering.
#
# Quality gate: tests/audit-gates/reference-catalogue-quality.gate.mjs
#   (#3296, #3302): every entry needs at least one source; review dates must
#   not be in the future and warn after 180 days.

last_reviewed: '2026-10-18'

sdks:

  # ===========================================================================
  # HYPERSCALER SDKs (cloud-provider-proprietary APIs; US-parented providers)
  # ===========================================================================

  # --- AWS ---

  - id: aws-sdk-js-v3
    name: "AWS SDK for JavaScript (v3 and v2)"
    vendor: aws
    lock_in_level: extreme
    sovereign_impact: blocks_migration
    detection:
      npm_packages:
        - pattern: "@aws-sdk/*"
          match: prefix
        - pattern: "aws-sdk"
          match: exact
      description: "AWS SDK for JavaScript v3 (@aws-sdk/client-* packages) and v2 (aws-sdk, end of support announced by AWS)"
    services_implied:
      - S3, DynamoDB, Lambda, SQS, SNS, Cognito, CloudWatch, KMS, Secrets Manager
    sovereign_alternative: >
      Replace provider-specific calls with portable interfaces: S3 with any
      S3-compatible object store, DynamoDB with PostgreSQL or another
      self-managed database, Lambda with a container or open-source function
      runtime, SQS/SNS with RabbitMQ or Apache Kafka, Cognito with Keycloak.
    sources:
      - url: https://github.com/aws/aws-sdk-js-v3
        title: "AWS SDK for JavaScript v3 (modular @aws-sdk/client-* packages)"
        reviewed: '2026-10-18'
      - url: https://www.npmjs.com/package/aws-sdk
        title: "aws-sdk (v2) on npm"
        reviewed: '2026-10-18'
      - url: https://aws.amazon.com/blogs/developer/announcing-end-of-support-for-aws-sdk-for-javascript-v2/
        title: "AWS announcement: end of support for the AWS SDK for JavaScript v2"
        reviewed: '2026-10-18'
    last_reviewed: '2026-10-18'
    tags: [aws, hyperscaler, cloud_native]

