      to container workers deployed on OTC CCE as long-running job pods. This provides
      full control over runtime and allows GPU workers for AI-enabled bots. Define
      migration path per bot type (simple transform vs AI-assisted vs external API).
    last_reviewed: "2026-04-27"
    tags: [aws, serverless, compute, partial_sovereign_alternative]

