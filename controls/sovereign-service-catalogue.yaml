  # ===========================================================================
  # CONTAINER REGISTRY / SUPPLY CHAIN
  # ===========================================================================

  - id: docker-hub
    name: "Docker Hub"
    category: container_registry
    vendor: "Docker Inc. (US)"
    portability_verdict: available
    sovereign_evidence: eu_cdn_routing
    eu_details: >
      Docker Hub CDN serves EU clients from EU PoPs. No dedicated EU-sovereign
      registry; Docker Hub is US-hosted. For supply chain sovereignty, use a
      self-hosted or EU-hosted registry (Harbor on OTC, GitHub Container Registry
      with EU-resident GitHub Enterprise, or OTC SWR). EU CDN routing reduces
      latency but does not provide data residency guarantees for image layers.
    blocks_migration: false
    remediation: >
      Pin images by SHA256 digest (not tag) to prevent silent upstream changes.
      Evaluate migration to self-hosted Harbor registry on OTC or to EU GitHub
      Container Registry. For air-gapped sovereign environments, mandatory mirror
      to private EU registry required.
    last_reviewed: "2026-04-01"
    tags: [supply_chain, container_registry, image_pinning]

  - id: github-container-registry
    name: "GitHub Container Registry (ghcr.io)"
    category: container_registry
    vendor: "GitHub Inc. / Microsoft Corporation"
    portability_verdict: partial
    sovereign_evidence: eu_entity_available
    eu_details: >
      GitHub (a Microsoft subsidiary) offers data residency options for GitHub
      Enterprise Cloud with EU data residency add-on. Public ghcr.io is US-hosted.
      Microsoft Azure (GitHub parent) has EU sovereign regions. Data residency
      requires GitHub Enterprise + EU data residency feature.
    blocks_migration: false
    remediation: >
      For sovereign deployments, use GitHub Enterprise Cloud with EU data residency,
      or migrate to self-hosted Harbor / OTC SWR. Standard ghcr.io is insufficient
      for strict sovereign requirements.
    last_reviewed: "2026-04-01"
    tags: [supply_chain, container_registry]

