  # ===========================================================================
  # AWS MANAGED AI / ML SERVICES (no sovereign equivalent)
  # ===========================================================================

  - id: aws-comprehend-medical
    name: "AWS Comprehend Medical"
    category: ai_inference
    vendor: "Amazon Web Services Inc. (US)"
    portability_verdict: unavailable
    sovereign_evidence: no_eu_equivalent
    eu_details: >
      AWS Comprehend Medical is a managed NLP service for extracting medical
      entities from clinical text (ICD-10, RxNorm, SNOMED CT). No sovereign-cloud
      equivalent exists on OTC, IONOS, or certified German cloud platforms as of
      2026-04. The service operates in AWS-managed infrastructure; EU regions
      (eu-central-1) are available but AWS itself is not a BSI C5-certified
      sovereign provider. Processing GDPR Art. 9 health data (FHIR clinical notes,
      diagnostic reports) without an executed Art. 28 DPA with AWS EU creates a
      direct compliance violation.
    blocks_migration: true
    remediation: >
      Path A: Execute AWS EU Art. 28 DPA covering Comprehend Medical and obtain
      legal sign-off that AWS eu-central-1 satisfies DE_only data residency
      requirements. Path B (recommended): Disable the Comprehend Medical integration
      (incident INC-2025-0815 pre-migration gate). Replace with an open-source
      medical NLP pipeline self-hosted on OTC CCE: spaCy with SciSpaCy + en_core_sci_lg,
      Stanza with en_ner_bc5cdr_biobert, or MedCAT. These models run on CPU/GPU
      without GPU for inference on small volumes.
    last_reviewed: "2026-04-27"
    tags: [aws, ai_ml, medical_nlp, no_eu_sovereign, blocks_migration, gdpr_art9_risk]

  - id: aws-textract
    name: "AWS Textract"
    category: ai_inference
