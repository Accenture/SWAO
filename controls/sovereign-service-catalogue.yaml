    blocks_migration: false
    remediation: >
      Confirm DSN is EU-region ingest endpoint. Verify project is created in the
      Sentry EU region (not US). Configure PII scrubbing rules for any field that
      might contain GDPR Art. 9 data. Request EU DPA addendum.
    last_reviewed: "2026-04-01"
    tags: [observability, error_monitoring, pii_risk]

