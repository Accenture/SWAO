  # OBSERVABILITY / ERROR MONITORING
  # ===========================================================================

  - id: sentry
    name: "Sentry"
    category: observability
    vendor: "Functional Software Inc. (US) / Sentry EU"
    portability_verdict: available
    sovereign_evidence: eu_region_confirmed
    eu_details: >
      Sentry offers a dedicated EU-region deployment (sentry.io EU). EU ingest
      cluster at o<project>.ingest.sentry.io EU region. Data residency confirmed
