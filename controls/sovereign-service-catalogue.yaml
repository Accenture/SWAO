      If processing GDPR Art. 9 health data from clinical documents, an executed
      Art. 28 DPA is required.
    blocks_migration: false
    remediation: >
      Replace with self-hosted OCR pipeline on OTC CCE: Tesseract 5 (open-source)
      for basic OCR, or PaddleOCR for layout-aware document extraction. For complex
      medical forms, evaluate Azure Form Recognizer (EU region) as an interim step
      pending confirmed usage and volume data from HealthCo.
    last_reviewed: "2026-04-27"
    tags: [aws, ai_ml, ocr, no_eu_sovereign, unconfirmed_usage]

  # ===========================================================================
  # AWS MANAGED COMPUTE / SERVERLESS
  # ===========================================================================

  - id: aws-lambda
    name: "AWS Lambda"
    category: serverless_compute
    vendor: "Amazon Web Services Inc. (US)"
    portability_verdict: partial
    sovereign_evidence: eu_entity_available
    eu_details: >
      AWS Lambda is available in eu-central-1 (Frankfurt) but AWS is not a
      BSI C5-certified sovereign provider for the highest sensitivity classifications.
      OTC FunctionGraph is the nearest sovereign-cloud equivalent but has different
      runtime support, cold-start characteristics, and API surface. Medplum uses
