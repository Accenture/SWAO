  # ===========================================================================
  # FIREBASE / NATIVE-CLOUD (HIGH LOCK-IN)
  # ===========================================================================

  - id: firebase
    name: "Firebase (Google)"
    category: backend_as_a_service
    vendor: "Google LLC (US)"
    portability_verdict: unavailable
    sovereign_evidence: no_eu_equivalent
    eu_details: >
      Firebase has no EU-sovereign equivalent. Firebase data is processed in US
      datacentres (GCP US regions). No EU data residency option available for
      Firebase Realtime Database or Firestore in EU-only mode. Firebase Authentication
      processes data in the US. Using Firebase with GDPR Art. 9 data is not permissible
      without adequate safeguards (SCC + TIA required; adequacy unclear post-Schrems II).
    blocks_migration: true
    remediation: >
      Migrate Firebase to an EU-sovereign backend: Supabase (self-hosted on OTC),
      PocketBase, or native PostgreSQL + Actix-web/NestJS. Firebase Authentication
      can be replaced with Keycloak (self-hosted) or Okta EU cell.
    last_reviewed: "2026-04-01"
    tags: [baas, no_eu_sovereign, blocks_migration, high_lock_in]

  - id: aws-cognito
    name: "AWS Cognito"
    category: identity
    vendor: "Amazon Web Services Inc. (US)"
    portability_verdict: unavailable
    sovereign_evidence: no_eu_equivalent
    eu_details: >
      AWS Cognito is a US-originated service. While AWS has EU regions (Frankfurt,
      Ireland), AWS Cognito is not available on sovereign cloud platforms (OTC,
      IONOS, Hetzner). AWS itself is not a certified sovereign provider for German
      BSI C5 workloads of the highest classification. Cognito vendor lock-in is
      extreme (proprietary user pool format, non-standard JWT claims).
    blocks_migration: true
    remediation: >
      Migrate to Keycloak (self-hosted on OTC, IONOS, or on-prem), Authentik, or
      Okta EU cell. Export Cognito users before migration; Cognito does not export
      password hashes (users must reset passwords post-migration).
    last_reviewed: "2026-04-01"
    tags: [identity, no_eu_sovereign, blocks_migration, high_lock_in, aws]

