# Sovereign Cloud Service Catalogue
# SWAO Compliance Ruleset Library -- runtime asset
# Version: 2026-10
# Schema: Zod SovereignServiceEntrySchema
#   (swao/packages/@swao/module-app-assessment/src/catalogue/reference-catalogues.ts)
#
# Used by: Pass 07 (EGR), passes/pass-07-egr.ts. One EGR signal per catalogue
#   service whose client library or API host name is found in the source; the
#   detection keys live in SOVEREIGN_SERVICE_DETECTION in that file. When the
#   same service is also an egress destination, the two are reported as ONE
#   signal (#3296).
# Purpose: Reference list of common SaaS/PaaS services with their EU sovereign
#   availability status. This is a generic runtime asset: it must not contain
#   engagement-specific content (client names or pseudonyms, incident ids,
#   internal proxy endpoints, one application's volumes, costs or file names).
#
# ---------------------------------------------------------------------------
# Verdict rule (applied to every entry, #3296)
# ---------------------------------------------------------------------------
# The verdict rates the SERVICE as offered by its vendor, not a client's
# configuration. Two questions decide it:
#   1. Does the vendor document an EU/EEA data residency option for the
#      customer data of this service (its own offering; it may be a separate
#      plan, tenant type, region or host name)?
#   2. Are the operator and its ultimate parent established in the EU/EEA?
#
#   available   -- 1 yes AND 2 yes, and customer data is hosted in the EU/EEA
#                  without a hosting sub-processor whose parent is outside the
#                  EU/EEA. No extraterritorial access law of a third country
#                  applies to the operator.
#   partial     -- 1 yes, 2 no (or the hosting sub-processor has a non-EU
#                  parent), or the EU option covers only part of the
#                  customer data.
#   unavailable -- 1 no: the vendor documents no EU/EEA residency option for
#                  this service's customer data.
#
# US-parent vendors (CLOUD Act exposure vs EU data residency): a vendor whose
#   ultimate parent is a US company is subject to the US CLOUD Act (18 U.S.C.
#   2713), which lets US authorities require disclosure of data in the
#   provider's possession, custody or control regardless of where it is
#   stored. EU data residency therefore reduces but does not remove the
#   exposure. Rule: a US-parent vendor is NEVER `available`; with a
#   documented EU residency option it is `partial` (sovereign_evidence
#   eu_region_confirmed or eu_cdn_routing); without one it is `unavailable`.
#   This applies equally to EU subsidiaries and EU "sovereign" operating
#   companies of US groups (for example the AWS European Sovereign Cloud).
#   Third-country operators that are not US-parented (for example
#   Switzerland, with an EU adequacy decision) are assessed by the same two
#   questions; their hosting sub-processor decides between available and
#   partial. parent_jurisdiction records the parent's country.
#   CLOUD Act text: https://www.law.cornell.edu/uscode/text/18/2713
#
# verdict_confidence:
#   verified   -- every claim the verdict rests on is supported by a public
#                 source listed under `sources` (vendor documentation, trust
#                 or compliance page, official register), fetched on the
#                 `reviewed` date.
#   unverified -- at least one claim the verdict rests on could not be
#                 confirmed from a primary public source. Pass 07 caps the
#                 severity at medium and never treats the entry as a
#                 migration blocker.
#
# blocks_migration: true exactly when portability_verdict is unavailable AND
#   verdict_confidence is verified (enforced by the schema and by
#   tests/audit-gates/reference-catalogue-quality.gate.mjs).
#
# sovereign_evidence values:
#   eu_region_confirmed     -- documented EU-hosted region in vendor documentation
#   eu_entity_available     -- EU legal entity exists; data residency not documented
#   eu_cdn_routing          -- EU edge locations or partial EU localisation only
#   eu_proxy_available      -- third-party EU proxy available; vendor itself not EU-hosted
#   no_eu_equivalent        -- vendor documents no EU hosting for this service
#   not_assessed            -- not yet evaluated
#
# Certification claims (BSI C5 and similar) are recorded only with a source
# that names the attestation; otherwise they are omitted.
#
# Review: every entry carries last_reviewed and per-source reviewed dates.
# The quality gate warns when a review is older than its age threshold.

last_reviewed: '2026-10-17'

