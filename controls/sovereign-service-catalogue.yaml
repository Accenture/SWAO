# Sovereign Cloud Service Catalogue
# SWAO Compliance Ruleset Library -- runtime asset
# Version: 2026-04
# Schema: sovereign-service-catalogue-v1.schema.json
#
# Used by: SPEC §10.1a sovereign_service_availability sub-pass (Stage D)
# Purpose: Reference list of common SaaS/PaaS services with their EU sovereign
#   availability status. Each entry drives the portability_verdict emitted by
#   the sovereign_service_availability pass.
#
# portability_verdict values:
#   available   -- EU-hosted sovereign instance exists; data residency confirmed
#   partial     -- EU presence (CDN PoP, EU entity, or proxy) but full sovereign
#                  certification or contractual routing unconfirmed
#   unavailable -- No EU-sovereign equivalent; blocks migration to sovereign cloud
#
# sovereign_evidence values:
#   eu_region_confirmed     -- documented EU-hosted region in vendor privacy docs
#   eu_entity_available     -- EU legal entity exists; routing may need config
#   eu_cdn_routing          -- EU CDN PoP routes traffic; data residency not guaranteed
#   eu_proxy_available      -- third-party EU proxy available; vendor itself US-only
#   no_eu_equivalent        -- vendor has no EU hosting; US-only
#   not_assessed            -- not yet evaluated
#
# blocks_migration: true  -> presence of this service in egress prevents sovereign migration
#                           until replaced or verified. Only for unavailable verdicts.

services:

  # ===========================================================================
  # AI / ML INFERENCE
  # ===========================================================================

  - id: anthropic-api
    name: "Anthropic API"
    category: ai_inference
    vendor: "Anthropic PBC (US)"
    portability_verdict: partial
    sovereign_evidence: eu_proxy_available
    eu_details: >
      EU-resident proxy endpoint available via third-party proxy arrangement
      (e.g. acn-proxy://anthropic-eu). Anthropic itself is a US company with
      no EU-sovereign-certified region as of 2026-04. zero_retention must be
      configured and verified at the API level. Long-term sovereign alternative:
      EU-hosted open-weight model (Mistral via OTC, Aleph Alpha).
    blocks_migration: false
    remediation: >
      Confirm EU proxy endpoint routes to EU-resident inference infrastructure.
      Validate zero_retention=true is enforced at the API level. Obtain DPA with
      EU Standard Contractual Clauses. Consider Mistral or Aleph Alpha as
      sovereign fallback for GDPR Art. 9 data processing.
    last_reviewed: "2026-04-01"
    tags: [ai, llm, inference, gdpr_risk]

  - id: openai-api
    name: "OpenAI API"
    category: ai_inference
    vendor: "OpenAI LLC (US)"
    portability_verdict: partial
    sovereign_evidence: eu_entity_available
    eu_details: >
      OpenAI has EU data residency options (Azure OpenAI in EU regions) and
      an EU legal entity. Direct OpenAI API endpoint (api.openai.com) is US-hosted.
      Azure OpenAI Service in Germany North or Sweden Central is the sovereign path.
    blocks_migration: false
    remediation: >
      Switch to Azure OpenAI Service deployed in EU sovereign region (Germany
      North recommended for BSI C5). Confirm DPA covers Art. 9 data if applicable.
    last_reviewed: "2026-04-01"
    tags: [ai, llm, inference, gdpr_risk]

  # ===========================================================================
  # PAYMENT PROCESSING
  # ===========================================================================

  - id: stripe
    name: "Stripe"
    category: payments
    vendor: "Stripe Inc. (US) / Stripe Payments Europe, Limited (IE)"
    portability_verdict: partial
    sovereign_evidence: eu_entity_available
    eu_details: >
      Stripe Payments Europe, Limited (Dublin, Ireland) is the EU contracting
      entity. EU merchants are automatically contracted under EU entity. The global
      API endpoint (api.stripe.com) routes via EU CDN PoPs for EU clients but
      contractual data routing must be confirmed via the Stripe EU DPA addendum.
      Payment card data is tokenised; PCI DSS scope is at Stripe.
    blocks_migration: false
    remediation: >
      Confirm account is under Stripe EU legal entity. Request EU DPA addendum.
      Verify SCC coverage for EU-resident payment data. Confirm EU routing is
      active via Stripe dashboard or account team. Network flow evidence (CDN
      routing) is not sufficient -- contractual entity routing must be documented.
    last_reviewed: "2026-04-01"
    tags: [payments, pci, gdpr_risk, eu_entity_available]

